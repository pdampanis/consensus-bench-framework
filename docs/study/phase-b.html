  }
  function refreshChangeStats() {
    var tot = 0, doneH = 0, done = 0;
    CHANGES.forEach(function (c) { tot += c.hours; if (isChk('chg|' + c.n)) { doneH += c.hours; done++; } });
    var a = document.getElementById('chg-count'), b = document.getElementById('chg-hours'), m = document.getElementById('chg-meter');
    if (a) a.textContent = done + '/' + CHANGES.length;
    if (b) b.textContent = doneH + ' / ' + tot + ' h';
    if (m) m.style.width = (tot ? doneH / tot * 100 : 0).toFixed(1) + '%';
  }

  /* ---------- running the benchmark ---------- */
  var runState = { sys: 'etcd' };
  var STAGES = ['On the laptop (no cost)', 'First contact (about €1)', 'One system block (repeat per system)', 'End of each phase'];
  function sysItems(sys) {
    var ol = firstOf(part(secRun, STAGES[2]).blocks, 'ol');
    return (ol ? ol.items : []).map(function (it, i) { return { it: it, i: i }; }).filter(function (x) { return sys.paxi || !/^Paxi only/.test(x.it.text); });
  }
  function sysTally(sys) { var items = sysItems(sys), d = 0; items.forEach(function (x) { if (isChk('sys-' + sys.id + '|' + x.i)) d++; }); return { done: d, tot: items.length }; }
  function stageTally(si) {
    if (si === 2) { var d = 0, t = 0; SYSTEMS.forEach(function (s) { var x = sysTally(s); d += x.done; t += x.tot; }); return { done: d, tot: t }; }
    if (si === 3) { var ol = firstOf(part(secRun, STAGES[3]).blocks, 'ol'), n = ol ? ol.items.length : 0, dd = 0;
      ['A', 'B', 'C'].forEach(function (ph) { for (var i = 0; i < n; i++) if (isChk('end-' + ph + '|' + i)) dd++; }); return { done: dd, tot: n * 3 }; }
    var o = firstOf(part(secRun, STAGES[si]).blocks, 'ol'), len = o ? o.items.length : 0;
    return { done: countPrefix('run' + si, len), tot: len };
  }
  function viewRun() {
    var intro = part(secRun, null).blocks;
    var h = '<div class="view"><div class="step-head"><p class="eyebrow">Laptop to campaign</p><h1>Running the benchmark</h1>' +
      '<div class="prose">' + intro.map(function (b) { return '<p class="lede">' + b.html + '</p>'; }).join('') + '</div></div>';
    h += '<ol class="stages" aria-label="Stages">' + STAGES.map(function (s, si) {
      var t = stageTally(si);
      return '<li><button type="button" class="stage" data-act="jump" data-target="stage-' + si + '"><span class="mono small">' + (si + 1) + '</span><b>' + esc(s.replace(/ \(.*\)$/, '')) + '</b>' +
        '<span class="small muted" id="stage-t-' + si + '">' + t.done + '/' + t.tot + '</span></button></li>';
    }).join('') + '</ol>';
    [0, 1].forEach(function (si) {
      var ol = firstOf(part(secRun, STAGES[si]).blocks, 'ol');
      h += '<section class="section" id="stage-' + si + '"><div class="section-head"><h2>' + (si + 1) + ' · ' + esc(STAGES[si]) + '</h2></div>' +
        (ol ? checklist('run' + si, ol.items, 'Done') : '') + '</section>';
    });
    h += '<section class="section" id="stage-2"><div class="section-head"><h2>3 · ' + esc(STAGES[2]) + '</h2><span class="small muted">Ticks are kept per system</span></div>' +
      '<div class="chips scroll sys-chips" role="group" aria-label="System">' + SYSTEMS.map(function (s) {
        var t = sysTally(s);
        return '<button type="button" class="chip fam-' + s.fam + '" data-act="sys" data-v="' + s.id + '" aria-pressed="' + (runState.sys === s.id) + '"><span class="dot" data-s="' + (t.done === t.tot ? 'done' : t.done ? 'doing' : 'todo') + '"></span>' + esc(s.label) +
          ' <span class="muted small" data-sys-t="' + s.id + '">' + t.done + '/' + t.tot + '</span></button>';
      }).join('') + '</div><div id="sys-panel"></div></section>';
    var endB = part(secRun, STAGES[3]).blocks, endOl = firstOf(endB, 'ol');
    h += '<section class="section" id="stage-3"><div class="section-head"><h2>4 · ' + esc(STAGES[3]) + '</h2><span class="small muted">One tick per phase</span></div>';
    if (endOl) {
      h += '<div class="table-wrap"><table class="matrix"><thead><tr><th scope="col">Step</th>' + ['A', 'B', 'C'].map(function (p) { return '<th scope="col" class="c">Phase ' + p + '</th>'; }).join('') + '</tr></thead><tbody>' +
        endOl.items.map(function (it, i) {
          return '<tr><td>' + it.html + '</td>' + ['A', 'B', 'C'].map(function (ph) {
            var k = 'end-' + ph + '|' + i;
            return '<td class="c"><input type="checkbox" data-act="chk" data-k="' + k + '"' + (isChk(k) ? ' checked' : '') + ' aria-label="Phase ' + ph + ', step ' + (i + 1) + '"></td>';
          }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
    }
    endB.forEach(function (b) {
      if (b.t === 'table') h += costTable(b);
      else if (b.t === 'p') h += '<p class="small muted">' + b.html + '</p>';
    });
    h += '<div class="callout warnbox"><p><b>Destroy at the end of every phase.</b> A forgotten Phase A cluster costs about €7 a day; check that <code>hcloud server list</code> is empty.</p></div>';
    h += '</section></div>';
    return h;
  }
  function costTable(b) {
    var vals = b.rows.map(function (r) { var m = /([\d.]+)/.exec(strip(r[4])); return m ? +m[1] : 0; });
    var max = Math.max.apply(null, vals.concat([1])), sum = vals.reduce(function (a, v) { return a + v; }, 0);
    return '<h3>Cost by phase</h3><div class="table-wrap"><table><thead><tr>' + b.head.map(function (h, i) { return '<th scope="col"' + (i >= 2 ? ' class="num"' : '') + '>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
      b.rows.map(function (r, ri) {
        return '<tr>' + r.map(function (c, ci) {
          if (ci === 4) return '<td class="num"><span class="bar-cell" style="justify-content:flex-end"><span class="hbar" style="width:' + (vals[ri] / max * 70).toFixed(0) + 'px;background:var(--accent)"></span>' + c + '</span></td>';
          return '<td' + (ci >= 2 ? ' class="num"' : '') + '>' + c + '</td>';
        }).join('') + '</tr>';
      }).join('') + '<tr class="sum"><td colspan="4">Sum of the rows</td><td class="num">~€' + sum + '</td></tr></tbody></table></div>' +
      '<p class="small muted">The rows sum to about €' + sum + '; the repo’s budget is about €47, or €61 with 30% for reruns (intro above).</p>';
  }
  function drawSys() {
    var panel = document.getElementById('sys-panel');
    if (!panel) return;
    var sys = SYSTEMS.filter(function (s) { return s.id === runState.sys; })[0];
    var items = sysItems(sys);
    var h = '<div class="card fam-' + sys.fam + ' sys-card"><div class="section-head"><h3>' + esc(sys.label) + '</h3><a class="small" href="#' + stepRoute(sys.step) + '">Step ' + STEP_IDS[sys.step] + ' →</a></div>' +
      (sys.note ? '<p class="small callout">' + esc(sys.note) + '</p>' : '') +
      (sys.id !== 'etcd' ? '<p class="small muted">The commands below say <code>--system etcd --size 3</code>; use this system’s name and size. The cost table gives the sizes: 3 in phase A, etcd and KRaft also at 5 and 7, CometBFT and HotStuff at 4.</p>' : '<p class="small muted">The cost table gives the sizes: 3 in phase A, and etcd also at 5 and 7 in phase B.</p>') + '<ul class="cl">' + items.map(function (x, j) {
        var k = 'sys-' + sys.id + '|' + x.i, on = isChk(k), id = 'c-' + k.replace(/[^a-z0-9]+/gi, '-');
        var refused = sys.noFaults && /^(Faults|Failover):/.test(x.it.text);
        return '<li class="' + (on ? 'on' : '') + '"><input type="checkbox" id="' + id + '" data-act="chk" data-k="' + k + '"' + (on ? ' checked' : '') + '>' +
          '<label for="' + id + '"><span class="cl-n">' + (j + 1) + '</span><span class="cl-t">' + x.it.html + (refused ? ' <span class="badge b-bad">refused by code on main (B0)</span>' : '') + '</span></label></li>';
      }).join('') + '</ul></div>';
    panel.innerHTML = h;
  }
  function refreshRunTallies() {
    for (var si = 0; si < 4; si++) { var el = document.getElementById('stage-t-' + si); if (el) { var t = stageTally(si); el.textContent = t.done + '/' + t.tot; } }
    SYSTEMS.forEach(function (s) {
      var el = document.querySelector('[data-sys-t="' + s.id + '"]'); if (!el) return;
      var t = sysTally(s); el.textContent = t.done + '/' + t.tot;
      var d = el.parentNode.querySelector('.dot'); if (d) d.setAttribute('data-s', t.done === t.tot ? 'done' : t.done ? 'doing' : 'todo');
    });
  }

  /* ---------- analysis ---------- */
  var anaState = { md: false };
  function predTable() { return firstOf(part(secAna, 'Check each result against its prediction').blocks, 'table'); }
  function viewAnalysis() {
    var intro = part(secAna, null).blocks, ex = part(secAna, 'What exists').blocks, order = firstOf(part(secAna, 'The order to build and run it').blocks, 'ol');
    var chk = part(secAna, 'Check each result against its prediction').blocks.filter(function (b) { return b.t === 'p'; });
    var pt = predTable();
    var h = '<div class="view"><div class="step-head"><p class="eyebrow">From raw results to the thesis</p><h1>Analysis</h1>' +
      '<div class="prose">' + intro.map(function (b) { return '<p class="lede">' + b.html + '</p>'; }).join('') + '</div></div>';
    h += '<section class="section"><h2>What exists on main</h2>' + ex.map(function (b) {
      return b.t === 'table' ? tableHtml(b) + '<div class="chips small" aria-label="Legend"><span class="chip"><span class="st st-ok"></span>Works</span><span class="chip"><span class="st st-warn"></span>Works with a gap, or by hand</span><span class="chip"><span class="st st-bad"></span>Not built</span></div>' :
        '<div class="callout warnbox"><p>' + b.html + '</p></div>';
    }).join('') + '</section>';
    h += '<section class="section"><div class="section-head"><h2>The order to build and run it</h2><span class="small muted">Tick as you go</span></div>' + (order ? checklist('ana', order.items, 'Done') : '') + '</section>';
    h += '<section class="section" id="preds"><div class="section-head"><h2>Check each result against its prediction</h2>' +
      '<button type="button" class="btn" data-act="pred-md" aria-pressed="' + anaState.md + '">' + (anaState.md ? 'Hide text version' : 'Show as Markdown') + '</button></div>' +
      (chk[0] ? '<p>' + chk[0].html + '</p>' : '') +
      '<p class="small muted">Fill in Observed, Label and Evidence as results arrive. It saves in this browser only, so copy it into the thesis repo with “Show as Markdown”.</p>' +
      '<div id="pred-md"></div><div class="preds">' + (pt ? pt.rows.map(function (r, i) {
        var v = P.pred[i] || {};
        return '<div class="pred-card"><p class="pred-q"><b>' + r[0] + '</b></p><p class="small"><span class="muted">Expected:</span> ' + r[1] + '</p>' +
          '<label class="fld"><span>Observed</span><input type="text" data-pred="' + i + '" data-f="o" value="' + esc(v.o || '') + '" autocomplete="off"></label>' +
          '<label class="fld"><span>Label</span><select data-pred="' + i + '" data-f="l"><option value="">—</option>' + LABELS4.map(function (l) { return '<option' + (v.l === l ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('') + '</select></label>' +
          '<label class="fld"><span>Evidence</span><input type="text" data-pred="' + i + '" data-f="e" value="' + esc(v.e || '') + '" placeholder="run id, figure, file" autocomplete="off"></label></div>';
      }).join('') : '') + '</div>' +
      (chk[1] ? '<div class="callout fam-meas"><p class="eyebrow">The four gates for a conclusion</p><p>' + chk[1].html + '</p></div>' : '') + '</section></div>';
    return h;
  }
  function predMarkdown() {
    var pt = predTable(); if (!pt) return '';
    var cell = function (s) { return strip(s).replace(/\|/g, '\\|').trim(); };
    var lines = ['| ' + pt.head.map(cell).join(' | ') + ' |', '|' + pt.head.map(function () { return ' --- '; }).join('|') + '|'];
    pt.rows.forEach(function (r, i) { var v = P.pred[i] || {}; lines.push('| ' + [cell(r[0]), cell(r[1]), cell(v.o || ''), cell(v.l || ''), cell(v.e || '')].join(' | ') + ' |'); });
    return lines.join('\n');
  }
  function drawPredMd() {
    var el = document.getElementById('pred-md'); if (!el) return;
    el.innerHTML = anaState.md ? '<label class="sr-only" for="pred-md-text">Prediction table as Markdown</label><textarea id="pred-md-text" class="mdbox" readonly rows="11">' + esc(predMarkdown()) + '</textarea>' : '';
  }

  /* ---------- code index and sources ---------- */
  var srcState = { q: '' };
  var CODE = (function () {
    var byPath = {};
    C.links.forEach(function (l) {
      var m = /github\.com\/pdampanis\/consensus-bench-framework\/blob\/[0-9a-f]+\/([^#?]+)(?:\?plain=1)?(#L(\d+)(?:-L(\d+))?)?/.exec(l.href);
      if (!m) return;
      var f = byPath[m[1]] = byPath[m[1]] || { path: m[1], anchors: {}, cites: {} };
      var a = m[3] ? 'L' + m[3] + (m[4] ? '–' + m[4] : '') : 'file';
      f.anchors[a] = { href: l.href, start: m[3] ? +m[3] : 0 };
      var where = l.step != null ? l.step : l.h2;
      f.cites[where] = 1;
    });
    return Object.keys(byPath).sort().map(function (k) { return byPath[k]; });
  })();
  var SECTION_ROUTE = [[/^How to use/, 'overview', 'How to use it'], [/^What counts/, 'done', '“Done”'], [/^Changes/, 'changes', 'Changes'],
    [/^Running/, 'run', 'Running'], [/^Analysis/, 'analysis', 'Analysis'], [/sources$/, 'sources', 'Sources'], [/^Preface/, 'overview', 'Intro']];
  function citeChip(w) {
    var si = STEP_IDS.indexOf(w);
    if (si >= 0) return '<a class="chip mini fam-' + famOf(si) + '" href="#' + stepRoute(si) + '"><span class="dot" data-s="done"></span>' + w + '</a>';
    for (var i = 0; i < SECTION_ROUTE.length; i++) if (SECTION_ROUTE[i][0].test(w)) return '<a class="chip mini" href="#' + SECTION_ROUTE[i][1] + '">' + SECTION_ROUTE[i][2] + '</a>';
    return '<span class="chip mini">' + esc(w) + '</span>';
  }
  function citeOrder(w) { var si = STEP_IDS.indexOf(w); return si >= 0 ? si : 20; }
  function viewSources() {
    var lines = CODE.reduce(function (a, f) { return a + Object.keys(f.anchors).length; }, 0);
    var h = '<div class="view wide"><div class="step-head"><p class="eyebrow">Reference · commit ' + SITE.commit + ' on main</p><h1>Code index and sources</h1>' +
      '<p class="muted">Every file:line the Phase B doc links, grouped by file: ' + CODE.length + ' files, ' + lines + ' distinct line ranges. Each chip under a file is a step or section that cites it.</p></div>' +
      '<div class="searchbox"><label class="sr-only" for="src-q">Filter files</label><input id="src-q" type="search" placeholder="Filter by file, folder or step (e.g. RemoteRunner, driver, B6)…" value="' + esc(srcState.q) + '" autocomplete="off"></div>' +
      '<p class="small muted" id="src-count" aria-live="polite"></p><div id="src-list" class="codeidx"></div>';
    var sb = secSrc.parts[0].blocks, html = '';
    sb.forEach(function (b, i) {
      if (b.t === 'p' && i > 0 && b.text.length < 40) html += '<h3>' + b.html + '</h3>';
      else html += blocksHtml([b]);
    });
    h += '<section class="section"><h2>Phase B sources, as listed in the doc</h2><div class="prose">' + html + '</div></section></div>';
    return h;
  }
  function drawSources() {
    var list = document.getElementById('src-list'); if (!list) return;
    var q = srcState.q.trim().toLowerCase(), n = 0;
    var html = CODE.filter(function (f) {
      if (!q) return true;
      var hay = (f.path + ' ' + Object.keys(f.cites).join(' ')).toLowerCase();
      return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
    }).map(function (f) {
      n++;
      var parts = f.path.split('/'), name = parts.pop(), dir = parts.join('/').replace('harness/src/main/java/gr/thesis/bench/', '…/bench/');
      var anchors = Object.keys(f.anchors).sort(function (a, b) { return f.anchors[a].start - f.anchors[b].start; });
      var cites = Object.keys(f.cites).sort(function (a, b) { return citeOrder(a) - citeOrder(b); });
      return '<div class="refitem"><div><b class="mono">' + esc(name) + '</b> <span class="muted small mono">' + esc(dir) + '</span></div>' +
        '<div class="meta">' + anchors.map(function (a) { return '<a class="lnk mono" href="' + esc(f.anchors[a].href) + '" target="_blank" rel="noopener noreferrer">' + a + '</a>'; }).join('') + '</div>' +
        '<div class="meta"><span class="small muted">Cited in</span>' + cites.map(citeChip).join('') + '</div></div>';
    }).join('');
    list.innerHTML = html || '<p class="muted">No file matches. Try fewer words.</p>';
    document.getElementById('src-count').textContent = n + (n === 1 ? ' file' : ' files');
  }

  /* ---------- footer ---------- */
  function footer() {
    return '<footer class="foot"><p>Built from the Phase B doc, <a href="' + SITE.docUrl + '" target="_blank" rel="noopener noreferrer">' + esc(C.title) + '</a> ' +
      '(<span class="mono">' + SITE.docUrl + '</span>), as of ' + SITE.asOf + (SITE.corrected ? ', corrected on ' + SITE.corrected + ' (see the end of Phase B sources)' : '') + '. Code links point to <a href="' + SITE.repoUrl + '" target="_blank" rel="noopener noreferrer">commit ' + SITE.commit + ' on main</a>.</p>' +
      '<p>Theory first: <a href="' + SITE.phaseASiteUrl + '" target="_blank" rel="noopener noreferrer">Phase A interactive site</a> · <a href="' + SITE.phaseADocUrl + '" target="_blank" rel="noopener noreferrer">Phase A doc</a>.</p></footer>';
  }

  /* ---------- router ---------- */
  var main = document.getElementById('main');
  function render() {
    var r = currentRoute(), h;
    if (r === 'overview') h = viewOverview();
    else if (r === 'steps') h = viewSteps();
    else if (r === 'done') h = viewDone();
    else if (r === 'changes') h = viewChanges();
    else if (r === 'run') h = viewRun();
    else if (r === 'analysis') h = viewAnalysis();
    else if (r === 'sources') h = viewSources();
    else h = viewStep(+r.slice(6));
    main.innerHTML = h + footer();
    markCurrent();
    if (r === 'run') drawSys();
    if (r === 'analysis') drawPredMd();
    if (r === 'sources') drawSources();
    if (r.indexOf('step-') === 0) {
      var cur = document.querySelector('.steps-strip [aria-current="page"]');
      if (cur) { var sp = cur.parentNode; sp.scrollLeft = Math.max(0, cur.offsetLeft - sp.offsetLeft - 8); }
    }
    window.scrollTo(0, 0);
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b || b.tagName === 'INPUT') return;
    var act = b.getAttribute('data-act');
    if (act === 'status') {
      var n = +b.getAttribute('data-n'), v = b.getAttribute('data-v');
      setStatus(n, v);
      document.querySelectorAll('[data-act="status"][data-n="' + n + '"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === v)); });
    } else if (act === 'reset-progress') {
      if (b.getAttribute('data-confirm') === '1') { P = { steps: {}, chk: {}, pred: {} }; save(); refreshChrome(); render(); }
      else { b.setAttribute('data-confirm', '1'); b.textContent = 'Tap again to clear everything: steps, ticks and predictions'; }
    } else if (act === 'jump') {
      var t = document.getElementById(b.getAttribute('data-target'));
      if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    } else if (act === 'sys') {
      runState.sys = b.getAttribute('data-v');
      document.querySelectorAll('[data-act="sys"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      drawSys();
    } else if (act === 'pred-md') {
      anaState.md = !anaState.md; b.setAttribute('aria-pressed', String(anaState.md));
      b.textContent = anaState.md ? 'Hide text version' : 'Show as Markdown';
      drawPredMd();
      var ta = document.getElementById('pred-md-text'); if (ta) { ta.focus(); ta.select(); }
    }
  });
  document.addEventListener('change', function (ev) {
    var t = ev.target;
    if (t.getAttribute && t.getAttribute('data-act') === 'chk') {
      setChk(t.getAttribute('data-k'), t.checked);
      var li = t.closest('li'); if (li) li.classList.toggle('on', t.checked);
      var r = currentRoute();
      if (r.indexOf('step-') === 0) { var el = document.getElementById('tally'); if (el) el.textContent = tallyText(+r.slice(6)); }
      if (r === 'changes') refreshChangeStats();
      if (r === 'run') refreshRunTallies();
      refreshChrome();
    } else if (t.hasAttribute && t.hasAttribute('data-pred')) {
      savePred(t);
    }
  });
  function savePred(t) {
    var i = t.getAttribute('data-pred'), f = t.getAttribute('data-f');
    P.pred[i] = P.pred[i] || {}; P.pred[i][f] = t.value;
    if (!t.value) delete P.pred[i][f];
    save(); if (anaState.md) { var ta = document.getElementById('pred-md-text'); if (ta) ta.value = predMarkdown(); }
  }
  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (t.id === 'src-q') { srcState.q = t.value; drawSources(); }
    else if (t.hasAttribute && t.hasAttribute('data-pred')) savePred(t);
  });
  window.addEventListener('hashchange', render);

  buildTabbar();
  refreshChrome();
  render();
})();

</script>
</body>
