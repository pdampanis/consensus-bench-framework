uff analyzer); <a href=\"https://github.com/pdampanis/consensus-bench-framework/tree/121cf05/harness/src/main/java/gr/thesis/bench/topology\" target=\"_blank\" rel=\"noopener noreferrer\">topology/<\/a> (RemoteSshProvider, SshFaultInjector, ClusterProvider, image pins in LocalDockerProvider); <a href=\"https://github.com/pdampanis/consensus-bench-framework/tree/121cf05/harness/src/main/java/gr/thesis/bench/campaign\" target=\"_blank\" rel=\"noopener noreferrer\">campaign/<\/a> (RemoteRunner, MatrixRunner, Inventory); <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/results/CsvResultsWriter.java\" target=\"_blank\" rel=\"noopener noreferrer\">CsvResultsWriter.java<\/a>; <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java\" target=\"_blank\" rel=\"noopener noreferrer\">ValidityChecker.java<\/a>; <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/pom.xml\" target=\"_blank\" rel=\"noopener noreferrer\">pom.xml<\/a>","text":"Harness: Main.java; core/ (WorkloadEngine, EventLog, LatencyRecorder, Scenario, SystemUnderTest); driver/ (etcd, Kafka, CometBFT, Paxi, HotStuff analyzer); topology/ (RemoteSshProvider, SshFaultInjector, ClusterProvider, image pins in LocalDockerProvider); campaign/ (RemoteRunner, MatrixRunner, Inventory); CsvResultsWriter.java; ValidityChecker.java; pom.xml","children":[]},{"html":"Infrastructure: <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf\" target=\"_blank\" rel=\"noopener noreferrer\">main.tf<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/cloud-init.yaml\" target=\"_blank\" rel=\"noopener noreferrer\">cloud-init.yaml<\/a>, the <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/paxi/Dockerfile\" target=\"_blank\" rel=\"noopener noreferrer\">Paxi<\/a> and <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/hotstuff/Dockerfile\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuff<\/a> Dockerfiles, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/scripts/collect_block.sh\" target=\"_blank\" rel=\"noopener noreferrer\">collect_block.sh<\/a>","text":"Infrastructure: main.tf, cloud-init.yaml, the Paxi and HotStuff Dockerfiles, collect_block.sh","children":[]},{"html":"Analysis and thesis: <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py\" target=\"_blank\" rel=\"noopener noreferrer\">analyse.py<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/README.md\" target=\"_blank\" rel=\"noopener noreferrer\">analysis/README.md<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/docs/MEASUREMENTS.md\" target=\"_blank\" rel=\"noopener noreferrer\">thesis/docs/MEASUREMENTS.md<\/a>, the research questions in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/content/en/ch1.tex#L436-L460\" target=\"_blank\" rel=\"noopener noreferrer\">ch1.tex<\/a>","text":"Analysis and thesis: analyse.py, analysis/README.md, measurements.tex, thesis/docs/MEASUREMENTS.md, the research questions in ch1.tex","children":[]},{"html":"Branch comparison: <code>git diff --stat main origin/ninth-review-handoff -- harness/src/main<\/code> (file names only; that branch&#x27;s code was not read, except commits a6471e1 and 9e258fa)","text":"Branch comparison: git diff --stat main origin/ninth-review-handoff -- harness/src/main (file names only; that branch's code was not read, except commits a6471e1 and 9e258fa)","children":[]}]},{"t":"p","html":"<strong>Outside sources<\/strong>","text":"Outside sources"},{"t":"ul","items":[{"html":"<a href=\"https://etcd.io/docs/v3.4/op-guide/configuration\" target=\"_blank\" rel=\"noopener noreferrer\">etcd v3.4 configuration options<\/a>: heartbeat and election defaults","text":"etcd v3.4 configuration options: heartbeat and election defaults","children":[]},{"html":"etcd v3.4.30 source: <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdmain/help.go#L56-L59\" target=\"_blank\" rel=\"noopener noreferrer\">help.go L56-L59<\/a> and <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdmain/help.go#L120-L121\" target=\"_blank\" rel=\"noopener noreferrer\">L120-L121<\/a> (heartbeat 100 ms, election 1000 ms, <code>--pre-vote<\/code> false; the same values from <code>etcd --help<\/code> in the pinned image), <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L1586-L1588\" target=\"_blank\" rel=\"noopener noreferrer\">raft/raft.go L1586-L1588<\/a>, <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdserver/raft.go#L553\" target=\"_blank\" rel=\"noopener noreferrer\">etcdserver/raft.go L553<\/a>","text":"etcd v3.4.30 source: help.go L56-L59 and L120-L121 (heartbeat 100 ms, election 1000 ms, --pre-vote false; the same values from etcd --help in the pinned image), raft/raft.go L1586-L1588, etcdserver/raft.go L553","children":[]},{"html":"<a href=\"https://github.com/asonnino/hotstuff/blob/dc01ac8/README.md?plain=1#L10\" target=\"_blank\" rel=\"noopener noreferrer\">asonnino/hotstuff README at dc01ac8<\/a>: &quot;2-chain variant&quot;; the commit rule in <a href=\"https://github.com/asonnino/hotstuff/blob/dc01ac8/consensus/src/core.rs#L331-L336\" target=\"_blank\" rel=\"noopener noreferrer\">consensus/src/core.rs L331-L336<\/a>","text":"asonnino/hotstuff README at dc01ac8: \"2-chain variant\"; the commit rule in consensus/src/core.rs L331-L336","children":[]},{"html":"ailidani/paxi at 6823d0b: <a href=\"https://github.com/ailidani/paxi/blob/6823d0b/paxos/paxos.go#L343-L367\" target=\"_blank\" rel=\"noopener noreferrer\">paxos/paxos.go L343-L367<\/a> (Paxos replies after execution) and <a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L49-L54\" target=\"_blank\" rel=\"noopener noreferrer\">epaxos/replica.go<\/a> (EPaxos: reply after execution unless <code>-ReplyWhenCommit<\/code>, no recovery, execution without dependency order)","text":"ailidani/paxi at 6823d0b: paxos/paxos.go L343-L367 (Paxos replies after execution) and epaxos/replica.go (EPaxos: reply after execution unless -ReplyWhenCommit, no recovery, execution without dependency order)","children":[]}]},{"t":"p","html":"<strong>Checked on 20 Nov 2026.<\/strong> The four facts first stated from memory are now checked: etcd&#x27;s CheckQuorum (on, in code), Kafka 3.9.1&#x27;s session timeouts and flush default (from the pinned image&#x27;s start-up log), CometBFT v0.38.17&#x27;s timeouts (from <code>cometbft init<\/code> in the pinned image) and jetcd 0.8.5&#x27;s balancer (<code>round_robin<\/code>, from the jar). The first three matched the page; jetcd&#x27;s is the second of the two cases the page described. Corrected the same day: the branch decision (the branch has its own F50 fixes), PreVote under packet_loss and the shape of etcd&#x27;s failover (B1), Paxi&#x27;s reply point, recovery and execution order (B2, B4), what is known about CometBFT durability (B5, done table), the CometBFT window cap (B6), the HotStuff source (B7), gate 3 without metrics (B8), pooled percentiles (analysis) and HotStuff at rate 0 (run). A second, independent review the same day added: the window effect on etcd&#x27;s failover, CheckQuorum&#x27;s lease in the failover model, the register&#x27;s failover keys, the EPaxos slow path after a kill, gate 3&#x27;s order, and line-exact links into Markdown files.","text":"Checked on 20 Nov 2026. The four facts first stated from memory are now checked: etcd's CheckQuorum (on, in code), Kafka 3.9.1's session timeouts and flush default (from the pinned image's start-up log), CometBFT v0.38.17's timeouts (from cometbft init in the pinned image) and jetcd 0.8.5's balancer (round_robin, from the jar). The first three matched the page; jetcd's is the second of the two cases the page described. Corrected the same day: the branch decision (the branch has its own F50 fixes), PreVote under packet_loss and the shape of etcd's failover (B1), Paxi's reply point, recovery and execution order (B2, B4), what is known about CometBFT durability (B5, done table), the CometBFT window cap (B6), the HotStuff source (B7), gate 3 without metrics (B8), pooled percentiles (analysis) and HotStuff at rate 0 (run). A second, independent review the same day added: the window effect on etcd's failover, CheckQuorum's lease in the failover model, the register's failover keys, the EPaxos slow path after a kill, gate 3's order, and line-exact links into Markdown files."}]}]}],"preface":[{"t":"p","html":"2026-11-18 · Panagiotis Dampanis","text":"2026-11-18 · Panagiotis Dampanis"},{"t":"p","html":"The harness on branch main (commit 121cf05, 2026-11-11) is built and laptop-tested, but no cloud cell has run yet. Phase B ties each step of <a href=\"https://claude.ai/artifact/7DzYYjaEGHj5o2s6GErU5J\" target=\"_blank\" rel=\"noopener noreferrer\">Phase A<\/a> to the code that implements it, with file:line links. Each step says what to check, what to change, and what to predict before you run. <strong>Updated 20 Nov 2026:<\/strong> rechecked against the same commit and against the pinned etcd, Kafka, CometBFT, Paxi and HotStuff sources. The corrections are listed at the end of Phase B sources; the Phase B doc (rev 20) does not have them yet.","text":"The harness on branch main (commit 121cf05, 2026-11-11) is built and laptop-tested, but no cloud cell has run yet. Phase B ties each step of Phase A to the code that implements it, with file:line links. Each step says what to check, what to change, and what to predict before you run. Updated 20 Nov 2026: rechecked against the same commit and against the pinned etcd, Kafka, CometBFT, Paxi and HotStuff sources. The corrections are listed at the end of Phase B sources; the Phase B doc (rev 20) does not have them yet."}],"links":[{"href":"https://claude.ai/artifact/7DzYYjaEGHj5o2s6GErU5J","text":"Phase A","step":null,"section":"preface","h2":"Preface","item":"The harness on branch main (commit 121cf05, 2026-11-11) is built and laptop-tested, but no cloud cell has run yet. Phase B ties each step of Phase A to the code that implements it, with file:line links. Each step says what to check, what to change, and what to predict before you run. Updated 20 Nov 2026: rechecked against the same commit and against the pinned etcd, Kafka, CometBFT, Paxi and HotStuff sources. The corrections are listed at the end of Phase B sources; the Phase B doc (rev 20) does not have them yet."},{"href":"https://claude.ai/artifact/7DzYYjaEGHj5o2s6GErU5J","text":"Phase A doc","step":null,"section":"How to use it (about 14 weeks to the end of February)","h2":"How to use it (about 14 weeks to the end of February)","item":"Phase B is about 18 hours of reading, then about 35 hours of code changes, then the campaign. Each step B1–B8 pairs with the step of the same number in the Phase A doc."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/CLAUDE.md?plain=1#L11-L13","text":"CLAUDE.md","step":null,"section":"The loop for each step","h2":"How to use it (about 14 weeks to the end of February)","item":"Answer \"What to check\" from the code, not from the docs. The repo's own rule is that live code beats every doc (CLAUDE.md)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L99-L111","text":"measurements.tex","step":null,"section":"The loop for each step","h2":"How to use it (about 14 weeks to the end of February)","item":"Write the step's prediction into thesis/data/measurements.tex (the pred.* keys) and commit it alone, before any run. The thesis abstract promises predictions registered before measurements (measurements.tex)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L8-L16","text":"PROJECT_STATE.md","step":"B0","section":"Orient on main","h2":"Orient on main","item":"Main holds a complete instrument and zero cloud results. The suite has 172 tests; the last full gate passed 171, and the one failure was laptop noise in a Kafka parity test (PROJECT_STATE.md)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/CLAUDE.md?plain=1#L29-L35","text":"CLAUDE.md","step":"B0","section":"Build and test","h2":"Orient on main","item":"Build the two local images once: docker build -t paxi:6823d0b infra/paxi and docker build -t hotstuff:dc01ac8 infra/hotstuff (CLAUDE.md)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/LOCAL_TESTING.md?plain=1#L25-L35","text":"LOCAL_TESTING.md","step":"B0","section":"Build and test","h2":"Orient on main","item":"Run cd harness && mvn21 clean verify. Expect Tests run: 172, Failures: 0 (LOCAL_TESTING.md). Most tests need the Docker daemon."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L185-L224","text":"Main.java","step":"B0","section":"Build and test","h2":"Orient on main","item":"Try the one-command loop: java -jar target/consensus-bench-0.1.0-SNAPSHOT.jar local-run --size 3 --rate 100 --duration 6 --warmup 2 -v. It serves etcd only (Main.java)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L84-L155","text":"Main.java","step":"B0","section":"Built, wired, or neither","h2":"Orient on main","item":"Main.java"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L101-L108","text":"ValidityChecker.java","step":"B0","section":"Built, wired, or neither","h2":"Orient on main","item":"gate SKIPs (ValidityChecker.java)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L278-L283","text":"RemoteRunner.java","step":"B0","section":"Built, wired, or neither","h2":"Orient on main","item":"RemoteRunner.java"},{"href":"https://claude.ai/artifact/BCwqnxWxyowuYGHfZdUc8g","text":"this link","step":"B0","section":"Built, wired, or neither","h2":"Orient on main","item":"An older, slower reading guide to this code exists: \"Understanding Consensus Bench\" (September 2026, written against ninth-review-handoff), at this link if it is still available. Its paths and line numbers can differ from main, and nothing in Phase B depends on it."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/EXECUTION_AND_COST_MODEL.md?plain=1#L37-L42","text":"L40","step":"B0","section":"Docs that disagree with the code","h2":"Orient on main","item":"EXECUTION_AND_COST_MODEL.md still calls the SSH provider \"designed, not yet built\" (L40). It is built."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md?plain=1#L3-L4","text":"L3-L4","step":"B0","section":"Docs that disagree with the code","h2":"Orient on main","item":"HOW_TO_CONTINUE.md is dated 21 Jul and says 170 tests (L3-L4). Main has 172."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L41-L43","text":"LocalDockerProvider.java L41-L43","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"LocalDockerProvider.java L41-L43"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L163-L177","text":"RemoteSshProvider.java L163-L177","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"RemoteSshProvider.java L163-L177"},{"href":"https://etcd.io/docs/v3.4/op-guide/configuration","text":"etcd v3.4 docs","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"No timer flags. Defaults: heartbeat 100 ms, election 1000 ms (etcd v3.4 docs); --pre-vote defaults to false (etcd --help in the pinned v3.4.30 image, and help.go L120-L121)"},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdmain/help.go#L120-L121","text":"help.go L120-L121","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"No timer flags. Defaults: heartbeat 100 ms, election 1000 ms (etcd v3.4 docs); --pre-vote defaults to false (etcd --help in the pinned v3.4.30 image, and help.go L120-L121)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L73-L82","text":"EtcdDriver.java L73-L82","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"EtcdDriver.java L73-L82"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L84-L100","text":"EtcdDriver.java L84-L100","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"EtcdDriver.java L84-L100"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L51-L56","text":"SshFaultInjector.java L51-L56","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"SshFaultInjector.java L51-L56"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L69-L83","text":"SshFaultInjector.java L69-L83","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"SshFaultInjector.java L69-L83"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L117-L120","text":"RemoteSshProvider.java L117-L120","step":"B1","section":"Where it lives","h2":"Raft in etcd","item":"RemoteSshProvider.java L117-L120"},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L1586-L1588","text":"raft.go L1586-L1588","step":"B1","section":"What to check","h2":"Raft in etcd","item":"Randomized timeout. etcd v3.4.30 draws each follower's timeout as T + rand(T), in 100 ms ticks (raft.go L1586-L1588). With T = 1000 ms that is 1.0–1.9 s. After a leader crash, the first of the two surviving followers to time out campaigns, so the gap is the shorter of two draws, not one draw."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdserver/raft.go#L553","text":"etcdserver/raft.go L553","step":"B1","section":"What to check","h2":"Raft in etcd","item":"CheckQuorum. On, in code, with no flag: CheckQuorum: true in etcdserver/raft.go L553 at v3.4.30."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L843-L847","text":"raft.go L843-L847","step":"B1","section":"What to check","h2":"Raft in etcd","item":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader's NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (raft.go L843-L847), but its reply to the leader's next heartbeat carries the higher term (L874-L897) and the leader steps down (L870). That is an extra election inside the measured window; the code's own comment there says it \"can be prevented with Pre-Vote phase\". With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (RemoteRunner.java L130-L133), so for those it cannot."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L874-L897","text":"L874-L897","step":"B1","section":"What to check","h2":"Raft in etcd","item":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader's NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (raft.go L843-L847), but its reply to the leader's next heartbeat carries the higher term (L874-L897) and the leader steps down (L870). That is an extra election inside the measured window; the code's own comment there says it \"can be prevented with Pre-Vote phase\". With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (RemoteRunner.java L130-L133), so for those it cannot."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L870","text":"L870","step":"B1","section":"What to check","h2":"Raft in etcd","item":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader's NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (raft.go L843-L847), but its reply to the leader's next heartbeat carries the higher term (L874-L897) and the leader steps down (L870). That is an extra election inside the measured window; the code's own comment there says it \"can be prevented with Pre-Vote phase\". With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (RemoteRunner.java L130-L133), so for those it cannot."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L130-L133","text":"RemoteRunner.java L130-L133","step":"B1","section":"What to check","h2":"Raft in etcd","item":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader's NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (raft.go L843-L847), but its reply to the leader's next heartbeat carries the higher term (L874-L897) and the leader steps down (L870). That is an extra election inside the measured window; the code's own comment there says it \"can be prevented with Pre-Vote phase\". With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (RemoteRunner.java L130-L133), so for those it cannot."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L62-L64","text":"EtcdDriver.java L62-L64","step":"B1","section":"What to change","h2":"Raft in etcd","item":"Set jetcd's loadBalancerPolicy explicitly in EtcdDriver.java L62-L64, and state it. The default is round_robin; setting it explicitly gives the thesis a line to cite."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L50-L53","text":"OBSERVABILITY_AND_EXPECTATIONS.md L52","step":"B1","section":"What to change","h2":"Raft in etcd","item":"Correct the prediction in OBSERVABILITY_AND_EXPECTATIONS.md L52 from \"sub-second\" to 1–2 s. The same claim repeats at L167 and in PENDING_TASKS F26-DECISION."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L843-L847","text":"raft.go L843-L847","step":"B1","section":"Prediction to write down","h2":"Raft in etcd","item":"leader_kill, if the window is not the limit: failover_ms mostly between about 900 and 1,900 ms, plus any client reconnect time. It is the shorter of two random timeouts, so most values sit near the low end: median about 1.25 s, mean about 1.4 s. About one trial in ten takes 2–2.9 s, because CheckQuorum's lease can make the first campaign fail (raft.go L843-L847). These numbers come from a simulation of the v3.4.30 timer rules, not from a run. At the campaign rate the window is probably the limit: until the election ends, the followers forward each write to the dead leader (raft.go L1325-L1326), and those writes hang until the 5 s client timeout. Once they fill W = 200 (from about 240 ops/s at the median election time), the engine stops issuing (B8) and failover_ms is about 5 s, a harness number. Check this on the first leader_kill cell, and raise the window (ranked change 1)."},{"href":"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L1325-L1326","text":"raft.go L1325-L1326","step":"B1","section":"Prediction to write down","h2":"Raft in etcd","item":"leader_kill, if the window is not the limit: failover_ms mostly between about 900 and 1,900 ms, plus any client reconnect time. It is the shorter of two random timeouts, so most values sit near the low end: median about 1.25 s, mean about 1.4 s. About one trial in ten takes 2–2.9 s, because CheckQuorum's lease can make the first campaign fail (raft.go L843-L847). These numbers come from a simulation of the v3.4.30 timer rules, not from a run. At the campaign rate the window is probably the limit: until the election ends, the followers forward each write to the dead leader (raft.go L1325-L1326), and those writes hang until the 5 s client timeout. Once they fill W = 200 (from about 240 ops/s at the median election time), the engine stops issuing (B8) and failover_ms is about 5 s, a harness number. Check this on the first leader_kill cell, and raise the window (ranked change 1)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/paxi/Dockerfile#L15-L19","text":"infra/paxi/Dockerfile L15-L19","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"infra/paxi/Dockerfile L15-L19"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L204-L231","text":"RemoteSshProvider.java L204-L231","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"RemoteSshProvider.java L204-L231"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L809-L821","text":"RemoteSshProvider.java L809-L821","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"RemoteSshProvider.java L809-L821"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L80-L82","text":"PaxiDriver.java L80-L82","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"PaxiDriver.java L80-L82"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L29-L34","text":"PaxiDriver.java L29-L34","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"PaxiDriver.java L29-L34"},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/paxos/paxos.go#L343-L367","text":"paxos/paxos.go L343-L367","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"HTTP 200, sent after execution: checked in paxos/paxos.go L343-L367 at 6823d0b"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L157-L174","text":"PaxiDriver.java L157-L174","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"PaxiDriver.java L157-L174"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L645-L646","text":"PROJECT_STATE.md L645-L646","step":"B2","section":"Where it lives","h2":"Multi-Paxos in Paxi","item":"PROJECT_STATE.md L645-L646"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L205","text":"RemoteRunner.java L198-L205","step":"B2","section":"What to check","h2":"Multi-Paxos in Paxi","item":"Trace leader_kill by hand. The detected leader is node 1 (RemoteRunner.java L198-L205), and the driver only talks to node 1. After the kill, every write gets \"connection refused\" at once."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L682-L683","text":"PENDING_TASKS.md L682-L683","step":"B2","section":"What to check","h2":"Multi-Paxos in Paxi","item":"The ledger's story is different. F26 says follower-forwarded writes time out at 5 s because Paxi has no failure detector (PENDING_TASKS.md L682-L683). That needs writes entering at a follower, which never happens here."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/results/CsvResultsWriter.java#L131-L132","text":"CsvResultsWriter.java L131-L132","step":"B2","section":"What to check","h2":"Multi-Paxos in Paxi","item":"Error-rate edge. Fast failures at the full rate for the last 240 s of a 480 s run give an error rate near 0.5. The writer marks a run failed only above 0.5 (CsvResultsWriter.java L131-L132). So these cells will flip between complete and failed."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L45-L59","text":"LocalDockerProvider.java L45-L59","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"LocalDockerProvider.java L45-L59, pom.xml L33-L34"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/pom.xml#L33-L34","text":"pom.xml L33-L34","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"LocalDockerProvider.java L45-L59, pom.xml L33-L34"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L281-L322","text":"RemoteSshProvider.java L281-L322","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"RemoteSshProvider.java L281-L322"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L355-L411","text":"RemoteSshProvider.java L355-L411","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"RemoteSshProvider.java L355-L411"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L61","text":"KafkaDriver.java L61","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"KafkaDriver.java L61, L95-L97"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L95-L97","text":"L95-L97","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"KafkaDriver.java L61, L95-L97"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L109-L117","text":"KafkaDriver.java L109-L117","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"KafkaDriver.java L109-L117"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L133-L145","text":"KafkaDriver.java L133-L145","step":"B3","section":"Where it lives","h2":"ZooKeeper, KRaft and the Kafka write path","item":"KafkaDriver.java L133-L145"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L645-L646","text":"PROJECT_STATE.md L645-L646","step":"B3","section":"What to check","h2":"ZooKeeper, KRaft and the Kafka write path","item":"Durability. PROJECT_STATE.md L645-L646 says \"fsync-backed Kafka/etcd\". No log.flush.* setting exists in either recipe. etcd fsyncs; Kafka does not."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L204-L221","text":"RemoteSshProvider.java L206","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"RemoteSshProvider.java L206"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L80-L82","text":"PaxiDriver.java L80-L82","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"PaxiDriver.java L80-L82"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L224-L230","text":"WorkloadEngine.java L224-L230","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"WorkloadEngine.java L224-L230"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L96","text":"WorkloadEngine.java L96","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"WorkloadEngine.java L96, MatrixRunner.java L63-L69"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69","text":"MatrixRunner.java L63-L69","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"WorkloadEngine.java L96, MatrixRunner.java L63-L69"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L29-L34","text":"PaxiDriver.java L29-L34","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"PaxiDriver.java L29-L34"},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L12","text":"epaxos/replica.go L12","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"HTTP 200 after execution: -ReplyWhenCommit defaults to false and the recipe does not set it (epaxos/replica.go L12)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L201","text":"RemoteRunner.java L198-L201","step":"B4","section":"Where it lives","h2":"EPaxos in Paxi","item":"RemoteRunner.java L198-L201"},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L208-L221","text":"epaxos/replica.go L208-L221","step":"B4","section":"What to check","h2":"EPaxos in Paxi","item":"Conflicts at c = 0. Two writes interfere when they touch the same key while both are in flight. With 200 writes in flight over 999 keys, a write shares its key with another in-flight write about 18% of the time (1 − e^(−199/999)). So c = 0 is conflict-free only at low load. In Paxi the fast path also needs every dependency to be committed already (epaxos/replica.go L208-L221), so an overlapping write takes the slow path even when the replicas agree."},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L356-L384","text":"epaxos/replica.go L356-L384","step":"B4","section":"What to check","h2":"EPaxos in Paxi","item":"Commit vs execute. Checked at Paxi 6823d0b: EPaxos replies after execution (table above). Execution walks each replica's log in slot order and never reads the dependencies (epaxos/replica.go L356-L384). So latency includes waiting for earlier slots in the same replica's log, not for dependencies."},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L49-L54","text":"epaxos/replica.go L49-L54","step":"B4","section":"What to check","h2":"EPaxos in Paxi","item":"Recovery. Checked: Paxi's EPaxos has none. It registers handlers only for requests, PreAccept, Accept and Commit, with no Prepare and no timer (epaxos/replica.go L49-L54). A dead replica's unfinished commands never finish. Because execution ignores dependencies, they do not hold up the other replicas' commands. But they keep replica 0's commit counter below them for good, so later writes to the keys replica 0 was writing when it died take the slow path every time (L213-L214), including key 0 when c > 0."},{"href":"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L213-L214","text":"L213-L214","step":"B4","section":"What to check","h2":"EPaxos in Paxi","item":"Recovery. Checked: Paxi's EPaxos has none. It registers handlers only for requests, PreAccept, Accept and Commit, with no Prepare and no timer (epaxos/replica.go L49-L54). A dead replica's unfinished commands never finish. Because execution ignores dependencies, they do not hold up the other replicas' commands. But they keep replica 0's commit counter below them for good, so later writes to the keys replica 0 was writing when it died take the slow path every time (L213-L214), including key 0 when c > 0."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/EventLog.java#L101-L112","text":"EventLog.java L101-L112","step":"B4","section":"What to check","h2":"EPaxos in Paxi","item":"The failover number. After replica 0 dies, replicas 1 and 2 keep committing, so \"first commit after the kill\" arrives within milliseconds (EventLog.java L101-L112). Meanwhile a third of all writes fail fast at the dead endpoint."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L112-L115","text":"OBSERVABILITY_AND_EXPECTATIONS.md L113","step":"B4","section":"Prediction to write down","h2":"EPaxos in Paxi","item":"c = 0, saturation: EPaxos throughput above Paxos, because three leaders share the CPU work. Expect a smaller gain than the 2013 paper; Tollman et al. (2021) found the same. This differs from the repo's own registration, which expects the same throughput class at c = 0 (OBSERVABILITY_AND_EXPECTATIONS.md L113); commit one of the two, with the reason."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/Scenario.java#L6-L12","text":"Scenario.java L6-L12","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"Scenario.java L6-L12"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/SystemUnderTest.java#L12-L18","text":"SystemUnderTest.java L15-L18","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"SystemUnderTest.java L15-L18, RemoteSshProvider.java L104-L111"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L104-L111","text":"RemoteSshProvider.java L104-L111","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"SystemUnderTest.java L15-L18, RemoteSshProvider.java L104-L111"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/ClusterProvider.java#L59-L74","text":"ClusterProvider.java L63-L66","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"ClusterProvider.java L63-L66"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L60-L63","text":"infra/main.tf L60-L63","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"infra/main.tf L60-L63, methodology L29-L33"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L29-L33","text":"methodology L29-L33","step":"B5","section":"Where it lives","h2":"The price of BFT, as the code sets it up","item":"infra/main.tf L60-L63, methodology L29-L33"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L44-L52","text":"measurements.tex L50-L52","step":"B5","section":"What to check","h2":"The price of BFT, as the code sets it up","item":"The thesis register asks for BFT numbers at 7 nodes: tendermint.tput.n7, hotstuff.tput.n7, and two 4 → 7 scaling drops (measurements.tex L50-L52, L84-L85). The harness refuses size 7 for both, and Phase C provisions 4 nodes."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L83-L85","text":"L84-L85","step":"B5","section":"What to check","h2":"The price of BFT, as the code sets it up","item":"The thesis register asks for BFT numbers at 7 nodes: tendermint.tput.n7, hotstuff.tput.n7, and two 4 → 7 scaling drops (measurements.tex L50-L52, L84-L85). The harness refuses size 7 for both, and Phase C provisions 4 nodes."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L50-L53","text":"LocalDockerProvider.java L50-L53","step":"B6","section":"Where it lives","h2":"CometBFT","item":"LocalDockerProvider.java L50-L53"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L523-L540","text":"RemoteSshProvider.java L523-L540","step":"B6","section":"Where it lives","h2":"CometBFT","item":"RemoteSshProvider.java L523-L540"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L93-L139","text":"CometBftDriver.java L93-L139","step":"B6","section":"Where it lives","h2":"CometBFT","item":"CometBftDriver.java L93-L139"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L106","text":"CometBftDriver.java L106","step":"B6","section":"Where it lives","h2":"CometBFT","item":"CometBftDriver.java L106"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L586-L603","text":"RemoteSshProvider.java L586-L603","step":"B6","section":"Where it lives","h2":"CometBFT","item":"RemoteSshProvider.java L586-L603"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L201","text":"RemoteRunner.java L198-L201","step":"B6","section":"Where it lives","h2":"CometBFT","item":"RemoteRunner.java L198-L201"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L471-L485","text":"PROJECT_STATE.md L471-L485","step":"B6","section":"Where it lives","h2":"CometBFT","item":"PROJECT_STATE.md L471-L485"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L85-L86","text":"Main.java L85-L86","step":"B6","section":"What to check","h2":"CometBFT","item":"Little's law. Throughput can never exceed window ÷ latency: 200 ÷ 1.09 s ≈ 180 tx/s. The local one-validator run measured 220 tx/s at window 200, so expect about 180–220. campaign-run takes no --window (Main.java L85-L86) and hard-codes 200 (MatrixRunner.java L68). The repo's own guide warns about this for remote-run (PER_ALGORITHM_TEST_GUIDE.md L182-L184)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69","text":"MatrixRunner.java L68","step":"B6","section":"What to check","h2":"CometBFT","item":"Little's law. Throughput can never exceed window ÷ latency: 200 ÷ 1.09 s ≈ 180 tx/s. The local one-validator run measured 220 tx/s at window 200, so expect about 180–220. campaign-run takes no --window (Main.java L85-L86) and hard-codes 200 (MatrixRunner.java L68). The repo's own guide warns about this for remote-run (PER_ALGORITHM_TEST_GUIDE.md L182-L184)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PER_ALGORITHM_TEST_GUIDE.md?plain=1#L182-L184","text":"PER_ALGORITHM_TEST_GUIDE.md L182-L184","step":"B6","section":"What to check","h2":"CometBFT","item":"Little's law. Throughput can never exceed window ÷ latency: 200 ÷ 1.09 s ≈ 180 tx/s. The local one-validator run measured 220 tx/s at window 200, so expect about 180–220. campaign-run takes no --window (Main.java L85-L86) and hard-codes 200 (MatrixRunner.java L68). The repo's own guide warns about this for remote-run (PER_ALGORITHM_TEST_GUIDE.md L182-L184)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L827","text":"PENDING_TASKS.md L827","step":"B6","section":"What to check","h2":"CometBFT","item":"Gate 3 for CometBFT reads cmt_rounds, a gauge that drops to 0 every height, with a counter rule. The ledger says a real kill could FAIL that check (F52, PENDING_TASKS.md L827)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/hotstuff/Dockerfile#L32-L38","text":"infra/hotstuff/Dockerfile L32-L38","step":"B7","section":"Where it lives","h2":"HotStuff","item":"infra/hotstuff/Dockerfile L32-L38"},{"href":"https://github.com/asonnino/hotstuff/blob/dc01ac8/README.md?plain=1#L10","text":"README.md L10","step":"B7","section":"Where it lives","h2":"HotStuff","item":"README.md L10, core.rs L331-L336"},{"href":"https://github.com/asonnino/hotstuff/blob/dc01ac8/consensus/src/core.rs#L331-L336","text":"core.rs L331-L336","step":"B7","section":"Where it lives","h2":"HotStuff","item":"README.md L10, core.rs L331-L336"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L627-L695","text":"RemoteSshProvider.java L627-L695","step":"B7","section":"Where it lives","h2":"HotStuff","item":"RemoteSshProvider.java L627-L695"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L268-L274","text":"RemoteRunner.java L268-L274","step":"B7","section":"Where it lives","h2":"HotStuff","item":"RemoteRunner.java L268-L274"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/HotStuffLogAnalyzer.java#L216-L232","text":"HotStuffLogAnalyzer.java L216-L232","step":"B7","section":"Where it lives","h2":"HotStuff","item":"HotStuffLogAnalyzer.java L216-L232"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L325-L329","text":"RemoteRunner.java L325-L329","step":"B7","section":"Where it lives","h2":"HotStuff","item":"RemoteRunner.java L325-L329"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L278-L283","text":"RemoteRunner.java L278-L283","step":"B7","section":"Where it lives","h2":"HotStuff","item":"RemoteRunner.java L278-L283"},{"href":"https://github.com/asonnino/hotstuff/blob/dc01ac8/consensus/src/core.rs#L331-L336","text":"core.rs L331-L336","step":"B7","section":"What to check","h2":"HotStuff","item":"Variant: checked at dc01ac8. process_block commits b0 when b0.round + 1 == b1.round (core.rs L331-L336): a block commits once its child is certified in the next round. That is the 2-chain rule."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L161-L164","text":"DATA_ANALYSIS_METHODOLOGY.md L161-L164","step":"B7","section":"What to check","h2":"HotStuff","item":"Clocks. End-to-end latency = commit time in a node's log minus send time in the client's log, on different VMs. The methodology says latency uses only the client's clock (DATA_ANALYSIS_METHODOLOGY.md L161-L164). For HotStuff that is false; chrony skew of up to 5 ms enters directly."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L61-L62","text":"measurements.tex L61-L62","step":"B7","section":"What to check","h2":"HotStuff","item":"Only a mean. The analyzer outputs average latency only (L233). The thesis register asks for hotstuff.p99.n4 (measurements.tex L61-L62), which nothing on main can produce."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L129-L140","text":"OBSERVABILITY_AND_EXPECTATIONS.md L137","step":"B7","section":"What to check","h2":"HotStuff","item":"The repo's expectations doc calls it a \"three-phase pipeline\" (OBSERVABILITY_AND_EXPECTATIONS.md L137). At the pinned commit it is two (check 1)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L892-L901","text":"PENDING_TASKS.md L892-L901","step":"B7","section":"What to change","h2":"HotStuff","item":"Drop HotStuff faults from the plan unless February has slack. NEXT-4's three open questions are still unanswered (PENDING_TASKS.md L892-L901)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L114-L124","text":"WorkloadEngine.java L114-L124","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"WorkloadEngine.java L114-L124"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L135-L139","text":"L135-L137","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"L135-L137"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L122-L124","text":"L123","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"L123"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L126-L134","text":"L130-L134","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"L130-L134"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69","text":"MatrixRunner.java L63-L69","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"MatrixRunner.java L63-L69"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L86-L91","text":"MatrixRunner.java L90","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"MatrixRunner.java L90"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L80-L98","text":"MatrixRunner.java L80-L98","step":"B8","section":"The load model","h2":"The instrument: load, faults, validity","item":"MatrixRunner.java L80-L98"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L59-L60","text":"DATA_ANALYSIS_METHODOLOGY.md L59-L60","step":"B8","section":"What to check: the window","h2":"The instrument: load, faults, validity","item":"Little's law caps every run at W ÷ latency. With W = 200 that binds CometBFT at about 180–220 tx/s (B6) and may bind others. The methodology says saturation is found by raising concurrency \"the way Paxi does it\" (DATA_ANALYSIS_METHODOLOGY.md L59-L60). No code does that, and campaign-run cannot change W."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/ClusterProvider.java#L69-L83","text":"ClusterProvider.java L69-L83","step":"B8","section":"What to check: faults","h2":"The instrument: load, faults, validity","item":"Sources: ClusterProvider.java L69-L83, SshFaultInjector.java L51-L112, RemoteRunner.java L165-L205."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L51-L112","text":"SshFaultInjector.java L51-L112","step":"B8","section":"What to check: faults","h2":"The instrument: load, faults, validity","item":"Sources: ClusterProvider.java L69-L83, SshFaultInjector.java L51-L112, RemoteRunner.java L165-L205."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L165-L205","text":"RemoteRunner.java L165-L205","step":"B8","section":"What to check: faults","h2":"The instrument: load, faults, validity","item":"Sources: ClusterProvider.java L69-L83, SshFaultInjector.java L51-L112, RemoteRunner.java L165-L205."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/EventLog.java#L101-L112","text":"EventLog.java L101-L112","step":"B8","section":"What to check: faults","h2":"The instrument: load, faults, validity","item":"failover_ms = first commit after the mark (EventLog.java L101-L112). It means something only where all commits stop: etcd, Kafka, Paxos. For EPaxos and CometBFT it is near 0 by construction."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md?plain=1#L88-L92","text":"CAMPAIGN_RUNBOOK.md L88-L92","step":"B8","section":"What to check: faults","h2":"The instrument: load, faults, validity","item":"The runbook plans 180 s failover trials (CAMPAIGN_RUNBOOK.md L88-L92); the code runs them for 480 s like every cell. That adds about 1 h per 30 trials."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L94-L124","text":"ValidityChecker.java L94-L124","step":"B8","section":"What to check: validity and confidence","h2":"The instrument: load, faults, validity","item":"Gates on main (ValidityChecker.java L94-L124): rate adherence and convergence can run from the CSVs. Loadgen CPU, steal and clock need metrics/, which nothing on main writes. Fault ground truth FAILs any fault cell whose fault never fired (F51), for every system. Otherwise it SKIPs: for etcd, CometBFT and Kafka because metrics/ is missing, and for Paxos, EPaxos and HotStuff always. Window headroom, restarts and durability always SKIP."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L823-L839","text":"PENDING_TASKS.md L827-L830","step":"B8","section":"What to check: validity and confidence","h2":"The instrument: load, faults, validity","item":"Gate 3 has four open findings, F52–F55 (PENDING_TASKS.md L827-L830)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L183-L200","text":"DATA_ANALYSIS_METHODOLOGY.md L183-L200","step":"B8","section":"What to check: validity and confidence","h2":"The instrument: load, faults, validity","item":"Confidence grading exists only as text: the four-gate claim framework (DATA_ANALYSIS_METHODOLOGY.md L183-L200). There is no grading code on main."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L73-L82","text":"EtcdDriver.java L79-L81","step":null,"section":"What counts as \"done\", per system","h2":"What counts as \"done\", per system","item":"jetcd put() (EtcdDriver.java L79-L81)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L109-L131","text":"KafkaDriver.java L125-L131","step":null,"section":"What counts as \"done\", per system","h2":"What counts as \"done\", per system","item":"send() callback, acks=all (KafkaDriver.java L125-L131)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L93-L139","text":"CometBftDriver.java L106-L139","step":null,"section":"What counts as \"done\", per system","h2":"What counts as \"done\", per system","item":"broadcast_tx_commit (CometBftDriver.java L106-L139)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L134-L145","text":"PaxiDriver.java L134-L145","step":null,"section":"What counts as \"done\", per system","h2":"What counts as \"done\", per system","item":"HTTP PUT → 200 (PaxiDriver.java L134-L145)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/HotStuffLogAnalyzer.java#L216-L233","text":"HotStuffLogAnalyzer.java L216-L233","step":null,"section":"What counts as \"done\", per system","h2":"What counts as \"done\", per system","item":"No reply; log analysis (HotStuffLogAnalyzer.java L216-L233)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L84-L111","text":"Main.java L85-L86","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Window per system, and a concurrency sweep for saturation (about 3 h). Add --window to campaign-run (Main.java L85-L86) and a field to MatrixRunner.block (L63-L69). Without it, CometBFT saturation is about 180–220 tx/s (B6), etcd's leader_kill failover_ms measures the 5 s client timeout (B1), and the methodology's \"raise concurrency until it plateaus\" has no code."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69","text":"L63-L69","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Window per system, and a concurrency sweep for saturation (about 3 h). Add --window to campaign-run (Main.java L85-L86) and a field to MatrixRunner.block (L63-L69). Without it, CometBFT saturation is about 180–220 tx/s (B6), etcd's leader_kill failover_ms measures the 5 s client timeout (B1), and the methodology's \"raise concurrency until it plateaus\" has no code."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L126-L151","text":"ValidityChecker.java L130-L150","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Make validity filter the data (about 4 h). Add a CLI that runs ValidityChecker.checkTree over a results tree (ValidityChecker.java L130-L150). Make analyse.py read validity.json and exclude invalid runs (analyse.py L66-L71 checks status only). Add an offline window check: throughput × mean latency ≥ 0.9 × W means window-bound."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L66-L71","text":"analyse.py L66-L71","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Make validity filter the data (about 4 h). Add a CLI that runs ValidityChecker.checkTree over a results tree (ValidityChecker.java L130-L150). Make analyse.py read validity.json and exclude invalid runs (analyse.py L66-L71 checks status only). Add an offline window check: throughput × mean latency ≥ 0.9 × W means window-bound."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L44-L85","text":"measurements.tex","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Align the thesis register with the harness (about 2 h, mostly decisions). measurements.tex has keys for etcd, Tendermint and HotStuff only: none for KRaft, Kafka+ZK, Paxos or EPaxos. It also asks for BFT at n = 7 and a HotStuff p99, which main cannot produce (B5, B7). It also asks for failover keys for Tendermint and HotStuff (measurements.tex L68-L73), which main cannot produce or which mean nothing; replace them with change 4's metrics, or drop them."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L68-L73","text":"measurements.tex L68-L73","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Align the thesis register with the harness (about 2 h, mostly decisions). measurements.tex has keys for etcd, Tendermint and HotStuff only: none for KRaft, Kafka+ZK, Paxos or EPaxos. It also asks for BFT at n = 7 and a HotStuff p99, which main cannot produce (B5, B7). It also asks for failover keys for Tendermint and HotStuff (measurements.tex L68-L73), which main cannot produce or which mean nothing; replace them with change 4's metrics, or drop them."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L76-L82","text":"PaxiDriver.java L80-L82","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Paxos client entry (about 2 h). Either fail over to another endpoint in PaxiDriver.java L80-L82, or relabel the result (B2). Also cut Paxos leader_kill to 5 trials."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L114-L134","text":"RemoteRunner.java L125","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Failover trial timing, F56, F57 (about 3 h). Give leader_kill blocks the runbook's 180 s window, or update the budget. Take started after connect() (RemoteRunner.java L125). Give the fault thread's wait loop an exit (L170-L172)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L168-L173","text":"L170-L172","step":null,"section":"Changes before the campaign, ranked by risk to validity","h2":"Changes before the campaign, ranked by risk to validity","item":"Failover trial timing, F56, F57 (about 3 h). Give leader_kill blocks the runbook's 180 s window, or update the budget. Take started after connect() (RemoteRunner.java L125). Give the fault thread's wait loop an exit (L170-L172)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md?plain=1#L60-L72","text":"CAMPAIGN_RUNBOOK.md L60-L72","step":null,"section":"Running the benchmark: laptop to campaign","h2":"Running the benchmark: laptop to campaign","item":"The repo budgets about 118 machine hours and about €47, or €61 with 30% for reruns (CAMPAIGN_RUNBOOK.md L60-L72). Steps 7 and 10 cover gaps the repo's docs and code leave open."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L858-L863","text":"PENDING_TASKS.md L858-L863","step":null,"section":"On the laptop (no cost)","h2":"Running the benchmark: laptop to campaign","item":"Rerun the full gate on a quiet machine: cd harness && mvn21 clean verify, expecting 172 of 172 (NEXT-0, PENDING_TASKS.md L858-L863)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L97-L101","text":"infra/main.tf L97-L101","step":null,"section":"First contact (about €1)","h2":"Running the benchmark: laptop to campaign","item":"Check prices: hcloud server-type list, then fix hourly_eur in infra/main.tf L97-L101. The cpx21 price is marked unconfirmed."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/cloud-init.yaml#L19-L27","text":"cloud-init.yaml L19-L27","step":null,"section":"First contact (about €1)","h2":"Running the benchmark: laptop to campaign","item":"Set up the loadgen (not in the docs). cloud-init installs Docker, chrony and stress-ng, but no Java (cloud-init.yaml L19-L27). Install a Java 21 runtime. Copy the jar, deploy/inventory.env, and the private key the inventory names (main.tf L185)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L171-L188","text":"main.tf L185","step":null,"section":"First contact (about €1)","h2":"Running the benchmark: laptop to campaign","item":"Set up the loadgen (not in the docs). cloud-init installs Docker, chrony and stress-ng, but no Java (cloud-init.yaml L19-L27). Install a Java 21 runtime. Copy the jar, deploy/inventory.env, and the private key the inventory names (main.tf L185)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md?plain=1#L34-L38","text":"HOW_TO_CONTINUE.md L34-L38","step":null,"section":"First contact (about €1)","h2":"Running the benchmark: laptop to campaign","item":"Ship the two local images to each node: docker save paxi:6823d0b | ssh root@<node> docker load, and the same for hotstuff:dc01ac8, also to the loadgen (HOW_TO_CONTINUE.md L34-L38)."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PER_ALGORITHM_TEST_GUIDE.md?plain=1#L281-L301","text":"PER_ALGORITHM_TEST_GUIDE.md §8","step":null,"section":"First contact (about €1)","h2":"Running the benchmark: laptop to campaign","item":"One short cell per system: java -jar consensus-bench.jar remote-run --system etcd --scenario baseline --rate 300 --duration 120 --warmup 30 --inventory deploy/inventory.env -v. Then one leader_kill cell. Run the first-contact checks in PER_ALGORITHM_TEST_GUIDE.md §8."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L284-L288","text":"RemoteRunner.java L284-L288","step":null,"section":"One system block (repeat per system)","h2":"Running the benchmark: laptop to campaign","item":"Saturation: campaign-run --system etcd --size 3 --scenarios baseline --rates 0 --reps 5 --inventory deploy/inventory.env --out results. After change 1, repeat with larger windows until throughput stops rising. HotStuff has no saturation mode: remote-run refuses rate 0 for it (RemoteRunner.java L284-L288), so give it a rate sweep only."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L41-L74","text":"analyse.py L41-L74","step":null,"section":"What exists","h2":"Analysis: from raw results to the thesis","item":"analyse.py L41-L74"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L77-L110","text":"L77-L110","step":null,"section":"What exists","h2":"Analysis: from raw results to the thesis","item":"L77-L110"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L125-L149","text":"L125-L149","step":null,"section":"What exists","h2":"Analysis: from raw results to the thesis","item":"L125-L149"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L166-L181","text":"L166-L181","step":null,"section":"What exists","h2":"Analysis: from raw results to the thesis","item":"methodology §5 (L166-L181)"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L18-L24","text":"measurements.tex L18-L24","step":null,"section":"What exists","h2":"Analysis: from raw results to the thesis","item":"measurements.tex L18-L24"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L620-L623","text":"PROJECT_STATE.md L620-L623","step":null,"section":"Check each result against its prediction","h2":"Analysis: from raw results to the thesis","item":"The repo's rule: every material deviation gets one of four labels — measurement artifact, implementation property, environment, or protocol behaviour (PROJECT_STATE.md L620-L623). Fill in this table as results arrive."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L183-L200","text":"DATA_ANALYSIS_METHODOLOGY.md L183-L200","step":null,"section":"Check each result against its prediction","h2":"Analysis: from raw results to the thesis","item":"A claim enters the conclusions only if it clears the methodology's four gates: estimated with a CI, explained by mechanism, consistent in direction with the papers, and stated with its caveat (DATA_ANALYSIS_METHODOLOGY.md L183-L200). Anything less is an observation."},{"href":"https://claude.ai/artifact/7DzYYjaEGHj5o2s6GErU5J","text":"Phase A doc","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"Everything below was read on 18 Nov 2026, at commit 121cf05 on main, and rechecked on 20 Nov 2026 against the same commit. Theory comes from the Phase A doc."},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/CLAUDE.md","text":"CLAUDE.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"CLAUDE.md, README.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/README.md","text":"README.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"CLAUDE.md, README.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md","text":"PROJECT_STATE.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"PROJECT_STATE.md, PENDING_TASKS.md (seventh review and next increments), HOW_TO_CONTINUE.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md","text":"PENDING_TASKS.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"PROJECT_STATE.md, PENDING_TASKS.md (seventh review and next increments), HOW_TO_CONTINUE.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md","text":"HOW_TO_CONTINUE.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"PROJECT_STATE.md, PENDING_TASKS.md (seventh review and next increments), HOW_TO_CONTINUE.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md","text":"CAMPAIGN_RUNBOOK.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"CAMPAIGN_RUNBOOK.md, EXECUTION_AND_COST_MODEL.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/EXECUTION_AND_COST_MODEL.md","text":"EXECUTION_AND_COST_MODEL.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"CAMPAIGN_RUNBOOK.md, EXECUTION_AND_COST_MODEL.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md","text":"DATA_ANALYSIS_METHODOLOGY.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"DATA_ANALYSIS_METHODOLOGY.md, OBSERVABILITY_AND_EXPECTATIONS.md"},{"href":"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md","text":"OBSERVABILITY_AND_EXPECTATIONS.md","step":null,"section":"Phase B sources","h2":"Phase B sources","item":"DATA_ANALYSIS_METHODOLOGY.md, OBSERVABILITY_AND_EXPECTATIONS.md"},{"href":"h (function () {
