path after the kill, so p99 rises.","text":"replica_kill: about 33% errors after the kill. No growing stall on key 0: there is no recovery, but execution does not wait on dependencies either. Expect those keys, key 0 among them when c > 0, to stay on the slow path after the kill, so p99 rises.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"State that the knob is a hot-key share, give the realized overlap per cell, and say that one datacenter removes EPaxos&#x27;s WAN advantage. Also state that Paxi&#x27;s EPaxos has no recovery and executes without dependency order, so its latency leaves out a cost that a full EPaxos pays.","text":"State that the knob is a hot-key share, give the realized overlap per cell, and say that one datacenter removes EPaxos's WAN advantage. Also state that Paxi's EPaxos has no recovery and executes without dependency order, so its latency leaves out a cost that a full EPaxos pays."}]}]},{"h2":"Phase B · Step B5 — The price of BFT, as the code sets it up (about 1 h)","step":"B5","title":"The price of BFT, as the code sets it up","hours":"about 1 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The code confirms Phase A Step 5: no fault ever makes a node lie, so the thesis can only measure what BFT costs. But it changes three things at once between CFT and BFT: node count, hardware and, for HotStuff, the client. As wired, the cost of BFT cannot be separated from those.","text":"The code confirms Phase A Step 5: no fault ever makes a node lie, so the thesis can only measure what BFT costs. But it changes three things at once between CFT and BFT: node count, hardware and, for HotStuff, the client. As wired, the cost of BFT cannot be separated from those."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["No Byzantine behaviour","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/Scenario.java#L6-L12\" target=\"_blank\" rel=\"noopener noreferrer\">Scenario.java L6-L12<\/a>","Six scenarios: baseline, kill, double kill, loss, partition, slow. None equivocates"],["3f+1 with f = 1","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/SystemUnderTest.java#L12-L18\" target=\"_blank\" rel=\"noopener noreferrer\">SystemUnderTest.java L15-L18<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L104-L111\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L104-L111<\/a>","Both BFT systems run 4 nodes, and any other size is refused"],["More than f faults","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/ClusterProvider.java#L59-L74\" target=\"_blank\" rel=\"noopener noreferrer\">ClusterProvider.java L63-L66<\/a>","double_kill kills nodes 0 and 1: 2 &gt; f, a planned loss of liveness"],["Hardware","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L60-L63\" target=\"_blank\" rel=\"noopener noreferrer\">infra/main.tf L60-L63<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L29-L33\" target=\"_blank\" rel=\"noopener noreferrer\">methodology L29-L33<\/a>","CFT on ccx13 (2 vCPU); BFT on ccx23 (4 vCPU); &quot;compared within-family&quot;"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Count the differences between an etcd cell and a CometBFT cell: 3 vs 4 nodes, 2 vs 4 vCPU, Raft vs Tendermint, and durability (etcd fsyncs; CometBFT is not checked). Only Raft vs Tendermint is the protocol. The node count follows from 3f+1, the vCPU from D9, and the durability difference is unknown.","text":"Count the differences between an etcd cell and a CometBFT cell: 3 vs 4 nodes, 2 vs 4 vCPU, Raft vs Tendermint, and durability (etcd fsyncs; CometBFT is not checked). Only Raft vs Tendermint is the protocol. The node count follows from 3f+1, the vCPU from D9, and the durability difference is unknown.","children":[]},{"html":"The thesis register asks for BFT numbers at 7 nodes: <code>tendermint.tput.n7<\/code>, <code>hotstuff.tput.n7<\/code>, and two 4 → 7 scaling drops (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L44-L52\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex L50-L52<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L83-L85\" target=\"_blank\" rel=\"noopener noreferrer\">L84-L85<\/a>). The harness refuses size 7 for both, and Phase C provisions 4 nodes.","text":"The thesis register asks for BFT numbers at 7 nodes: tendermint.tput.n7, hotstuff.tput.n7, and two 4 → 7 scaling drops (measurements.tex L50-L52, L84-L85). The harness refuses size 7 for both, and Phase C provisions 4 nodes.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Add a hardware bridge: one etcd block at size 3 on the Phase C machines (saturation plus one sweep rate, n = 5, about 1.5 h, about €1). Then etcd vs CometBFT on ccx23 is a same-hardware comparison, and etcd ccx13 vs ccx23 measures the hardware effect alone.","text":"Add a hardware bridge: one etcd block at size 3 on the Phase C machines (saturation plus one sweep rate, n = 5, about 1.5 h, about €1). Then etcd vs CometBFT on ccx23 is a same-hardware comparison, and etcd ccx13 vs ccx23 measures the hardware effect alone.","children":[]},{"html":"Settle the n = 7 BFT question now. Either allow size 7 for CometBFT and HotStuff (f = 2, about €1.05/h on 7 × ccx23, two baseline blocks of about 4 h), or delete those keys from the thesis.","text":"Settle the n = 7 BFT question now. Either allow size 7 for CometBFT and HotStuff (f = 2, about €1.05/h on 7 × ccx23, two baseline blocks of about 4 h), or delete those keys from the thesis.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"Same hardware: CometBFT p50 ≥ one block interval; etcd p50 single-digit ms. The latency gap is mostly the block wait, not 3f+1.","text":"Same hardware: CometBFT p50 ≥ one block interval; etcd p50 single-digit ms. The latency gap is mostly the block wait, not 3f+1.","children":[]},{"html":"etcd on ccx23 vs ccx13: higher throughput, similar p50 (fsync and network bound, not CPU bound, at low load).","text":"etcd on ccx23 vs ccx13: higher throughput, similar p50 (fsync and network bound, not CPU bound, at low load).","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"One paragraph in the BFT chapter: &quot;We measure the price of BFT, not its benefit; no fault is Byzantine.&quot; Each cross-family number carries the hardware bridge beside it, or stays within-family as the methodology says.","text":"One paragraph in the BFT chapter: \"We measure the price of BFT, not its benefit; no fault is Byzantine.\" Each cross-family number carries the hardware bridge beside it, or stays within-family as the methodology says."}]}]},{"h2":"Phase B · Step B6 — CometBFT (about 2 h)","step":"B6","title":"CometBFT","hours":"about 2 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The CometBFT driver is correct, but the campaign runner would cap it at about 180–220 tx/s. That number would describe the harness, not Tendermint. <code>campaign-run<\/code> fixes the in-flight window at 200, and CometBFT latency is about one block interval.","text":"The CometBFT driver is correct, but the campaign runner would cap it at about 180–220 tx/s. That number would describe the harness, not Tendermint. campaign-run fixes the in-flight window at 200, and CometBFT latency is about one block interval."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Version","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L50-L53\" target=\"_blank\" rel=\"noopener noreferrer\">LocalDockerProvider.java L50-L53<\/a>","cometbft v0.38.17, pinned by digest, built-in <code>kvstore<\/code> app"],["Timeouts, block interval","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L523-L540\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L523-L540<\/a>","<code>cometbft init<\/code>, then three <code>sed<\/code> edits (subscription cap 2000, address book, Prometheus). No timeout is changed"],["&quot;Done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L93-L139\" target=\"_blank\" rel=\"noopener noreferrer\">CometBftDriver.java L93-L139<\/a>","<code>broadcast_tx_commit<\/code>; success only if <code>check_tx.code<\/code> and <code>tx_result.code<\/code> are both 0, so the tx is in a committed block"],["Which node gets the tx","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L106\" target=\"_blank\" rel=\"noopener noreferrer\">CometBftDriver.java L106<\/a>","Round-robin over all 4 RPC endpoints; the mempool gossips it to the proposer"],["Readiness","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L586-L603\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L586-L603<\/a>","Height ≥ 1 on node 1, which needs more than 2/3 of the votes"],["Proposer kill","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L201\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L198-L201<\/a>","Always replica 0, because the proposer rotates"],["Local evidence","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L471-L485\" target=\"_blank\" rel=\"noopener noreferrer\">PROJECT_STATE.md L471-L485<\/a>","1 validator: 602 tx/s, p50 1.09 s, window 600; at window 200 it was window-bound at 220 tx/s"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Little&#x27;s law. Throughput can never exceed window ÷ latency: 200 ÷ 1.09 s ≈ 180 tx/s. The local one-validator run measured 220 tx/s at window 200, so expect about 180–220. <code>campaign-run<\/code> takes no <code>--window<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L85-L86\" target=\"_blank\" rel=\"noopener noreferrer\">Main.java L85-L86<\/a>) and hard-codes 200 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69\" target=\"_blank\" rel=\"noopener noreferrer\">MatrixRunner.java L68<\/a>). The repo&#x27;s own guide warns about this for <code>remote-run<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PER_ALGORITHM_TEST_GUIDE.md?plain=1#L182-L184\" target=\"_blank\" rel=\"noopener noreferrer\">PER_ALGORITHM_TEST_GUIDE.md L182-L184<\/a>).","text":"Little's law. Throughput can never exceed window ÷ latency: 200 ÷ 1.09 s ≈ 180 tx/s. The local one-validator run measured 220 tx/s at window 200, so expect about 180–220. campaign-run takes no --window (Main.java L85-L86) and hard-codes 200 (MatrixRunner.java L68). The repo's own guide warns about this for remote-run (PER_ALGORITHM_TEST_GUIDE.md L182-L184).","children":[]},{"html":"Timeouts. Checked by running <code>cometbft init<\/code> in the pinned v0.38.17 image (20 Nov): <code>timeout_propose<\/code> 3 s, <code>timeout_prevote<\/code> and <code>timeout_precommit<\/code> 1 s, <code>timeout_commit<\/code> 1 s. Still copy each node&#x27;s <code>config/config.toml<\/code> into the run (What to change 2), so the thesis cites the run.","text":"Timeouts. Checked by running cometbft init in the pinned v0.38.17 image (20 Nov): timeout_propose 3 s, timeout_prevote and timeout_precommit 1 s, timeout_commit 1 s. Still copy each node's config/config.toml into the run (What to change 2), so the thesis cites the run.","children":[]},{"html":"What a dead proposer costs. Replica 0 still holds a quarter of the voting power, so every fourth height waits out <code>timeout_propose<\/code> before round 1. Average block interval: (3 × 1 s + 1 × about 4 s) ÷ 4 ≈ 1.75 s.","text":"What a dead proposer costs. Replica 0 still holds a quarter of the voting power, so every fourth height waits out timeout_propose before round 1. Average block interval: (3 × 1 s + 1 × about 4 s) ÷ 4 ≈ 1.75 s.","children":[]},{"html":"failover_ms. Most kills land while another validator proposes, so the next commit comes within a block. The number will look small and say little. The cost shows up as a periodic stall and in p99.","text":"failover_ms. Most kills land while another validator proposes, so the next commit comes within a block. The number will look small and say little. The cost shows up as a periodic stall and in p99.","children":[]},{"html":"Gate 3 for CometBFT reads <code>cmt_rounds<\/code>, a gauge that drops to 0 every height, with a counter rule. The ledger says a real kill could FAIL that check (F52, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L827\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md L827<\/a>).","text":"Gate 3 for CometBFT reads cmt_rounds, a gauge that drops to 0 every height, with a counter rule. The ledger says a real kill could FAIL that check (F52, PENDING_TASKS.md L827).","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Add <code>--window<\/code> to <code>campaign-run<\/code> and to <code>MatrixRunner.block<\/code>. For CometBFT use at least 2 × rate × 2 s; for saturation, about 2,000. That stays under the 2,000-subscriber cap the recipe sets, spread over 4 nodes.","text":"Add --window to campaign-run and to MatrixRunner.block. For CometBFT use at least 2 × rate × 2 s; for saturation, about 2,000. That stays under the 2,000-subscriber cap the recipe sets, spread over 4 nodes.","children":[]},{"html":"Copy each node&#x27;s <code>config.toml<\/code> into the run&#x27;s <code>logs/<\/code> folder, so the timeouts in the thesis come from the run, not from memory.","text":"Copy each node's config.toml into the run's logs/ folder, so the timeouts in the thesis come from the run, not from memory.","children":[]},{"html":"Collect block heights and times per run (<code>/blockchain<\/code> RPC or node logs). The block-interval series is the honest fault metric for this system.","text":"Collect block heights and times per run (/blockchain RPC or node logs). The block-interval series is the honest fault metric for this system.","children":[]},{"html":"Fix F52 before trusting gate 3 here.","text":"Fix F52 before trusting gate 3 here.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"Baseline p50 between 1.0 and 1.5 s at any rate below saturation; flat until the block-size knee.","text":"Baseline p50 between 1.0 and 1.5 s at any rate below saturation; flat until the block-size knee.","children":[]},{"html":"Saturation: window-bound at about 180–220 tx/s if unchanged; with a large window, well above that (the corpus anchor is about 1,700 tx/s at 4 nodes).","text":"Saturation: window-bound at about 180–220 tx/s if unchanged; with a large window, well above that (the corpus anchor is about 1,700 tx/s at 4 nodes).","children":[]},{"html":"Replica 0 kill: about 25% fast errors (its RPC is gone), average block interval about 1.75 s, p99 about 4–5 s.","text":"Replica 0 kill: about 25% fast errors (its RPC is gone), average block interval about 1.75 s, p99 about 4–5 s.","children":[]},{"html":"double_kill: height stops; zero commits.","text":"double_kill: height stops; zero commits.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"A timeout table (propose, prevote, precommit, commit) copied from the run&#x27;s own <code>config.toml<\/code>. Every CometBFT latency figure carries the caption &quot;includes waiting for the next block&quot;.","text":"A timeout table (propose, prevote, precommit, commit) copied from the run's own config.toml. Every CometBFT latency figure carries the caption \"includes waiting for the next block\"."}]}]},{"h2":"Phase B · Step B7 — HotStuff (about 2 h)","step":"B7","title":"HotStuff","hours":"about 2 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The implementation is asonnino/hotstuff, and its README at the pinned commit calls it the 2-chain variant; the commit rule in the code matches (check 1). So use the 2-chain row of the Phase A table, not the three-chain PODC protocol. HotStuff is also the one system the harness does not measure with its own client, and its latency is a mean computed across two machines&#x27; clocks.","text":"The implementation is asonnino/hotstuff, and its README at the pinned commit calls it the 2-chain variant; the commit rule in the code matches (check 1). So use the 2-chain row of the Phase A table, not the three-chain PODC protocol. HotStuff is also the one system the harness does not measure with its own client, and its latency is a mean computed across two machines' clocks."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Implementation","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/hotstuff/Dockerfile#L32-L38\" target=\"_blank\" rel=\"noopener noreferrer\">infra/hotstuff/Dockerfile L32-L38<\/a>","asonnino/hotstuff at commit dc01ac8, built with <code>--features benchmark<\/code>"],["Variant","<a href=\"https://github.com/asonnino/hotstuff/blob/dc01ac8/README.md?plain=1#L10\" target=\"_blank\" rel=\"noopener noreferrer\">README.md L10<\/a>, <a href=\"https://github.com/asonnino/hotstuff/blob/dc01ac8/consensus/src/core.rs#L331-L336\" target=\"_blank\" rel=\"noopener noreferrer\">core.rs L331-L336<\/a>","&quot;a minimal implementation of the 2-chain variant of the HotStuff consensus protocol&quot; (README at dc01ac8)"],["Start","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L627-L695\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L627-L695<\/a>","4 nodes, <code>node -vv run<\/code>, no <code>--parameters<\/code> file, so node defaults apply"],["Load","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L268-L274\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L268-L274<\/a>","The upstream client on the loadgen, fixed rate, 1,024-byte txs, all sent to node 0"],["&quot;Done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/HotStuffLogAnalyzer.java#L216-L232\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuffLogAnalyzer.java L216-L232<\/a>","A sample tx counts as committed at the earliest &quot;Committed B…&quot; log line on any node. The client gets no reply"],["Warmup","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L325-L329\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L325-L329<\/a>","The same formulas, over the post-warmup window only"],["Faults","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L278-L283\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L278-L283<\/a>","Refused: baseline only"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Variant: checked at dc01ac8. <code>process_block<\/code> commits b0 when <code>b0.round + 1 == b1.round<\/code> (<a href=\"https://github.com/asonnino/hotstuff/blob/dc01ac8/consensus/src/core.rs#L331-L336\" target=\"_blank\" rel=\"noopener noreferrer\">core.rs L331-L336<\/a>): a block commits once its child is certified in the next round. That is the 2-chain rule.","text":"Variant: checked at dc01ac8. process_block commits b0 when b0.round + 1 == b1.round (core.rs L331-L336): a block commits once its child is certified in the next round. That is the 2-chain rule.","children":[]},{"html":"Clocks. End-to-end latency = commit time in a node&#x27;s log minus send time in the client&#x27;s log, on different VMs. The methodology says latency uses only the client&#x27;s clock (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L161-L164\" target=\"_blank\" rel=\"noopener noreferrer\">DATA_ANALYSIS_METHODOLOGY.md L161-L164<\/a>). For HotStuff that is false; chrony skew of up to 5 ms enters directly.","text":"Clocks. End-to-end latency = commit time in a node's log minus send time in the client's log, on different VMs. The methodology says latency uses only the client's clock (DATA_ANALYSIS_METHODOLOGY.md L161-L164). For HotStuff that is false; chrony skew of up to 5 ms enters directly.","children":[]},{"html":"Only a mean. The analyzer outputs average latency only (L233). The thesis register asks for <code>hotstuff.p99.n4<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L61-L62\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex L61-L62<\/a>), which nothing on main can produce.","text":"Only a mean. The analyzer outputs average latency only (L233). The thesis register asks for hotstuff.p99.n4 (measurements.tex L61-L62), which nothing on main can produce.","children":[]},{"html":"A weaker &quot;done&quot;. Everyone else waits for the contacted node to reply after commit or apply. HotStuff counts the first node anywhere that logs the commit.","text":"A weaker \"done\". Everyone else waits for the contacted node to reply after commit or apply. HotStuff counts the first node anywhere that logs the commit.","children":[]},{"html":"The repo&#x27;s expectations doc calls it a &quot;three-phase pipeline&quot; (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L129-L140\" target=\"_blank\" rel=\"noopener noreferrer\">OBSERVABILITY_AND_EXPECTATIONS.md L137<\/a>). At the pinned commit it is two (check 1).","text":"The repo's expectations doc calls it a \"three-phase pipeline\" (OBSERVABILITY_AND_EXPECTATIONS.md L137). At the pinned commit it is two (check 1).","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Keep the per-sample latencies the analyzer already computes, and write p50/p99 beside the mean. The samples are there (L219-L230); only the summary drops them.","text":"Keep the per-sample latencies the analyzer already computes, and write p50/p99 beside the mean. The samples are there (L219-L230); only the summary drops them.","children":[]},{"html":"Record the measured chrony offset of loadgen and node 0 in each HotStuff manifest. State skew as a latency error bar.","text":"Record the measured chrony offset of loadgen and node 0 in each HotStuff manifest. State skew as a latency error bar.","children":[]},{"html":"Drop HotStuff faults from the plan unless February has slack. NEXT-4&#x27;s three open questions are still unanswered (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L892-L901\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md L892-L901<\/a>).","text":"Drop HotStuff faults from the plan unless February has slack. NEXT-4's three open questions are still unanswered (PENDING_TASKS.md L892-L901).","children":[]},{"html":"Fix the &quot;three-phase&quot; sentence, and remove the n = 7 HotStuff keys if B5&#x27;s decision is &quot;4 only&quot;.","text":"Fix the \"three-phase\" sentence, and remove the n = 7 HotStuff keys if B5's decision is \"4 only\".","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"Latency below CometBFT&#x27;s at the same rate: no fixed block wait, and a 2-chain commit of about 5 message delays.","text":"Latency below CometBFT's at the same rate: no fixed block wait, and a 2-chain commit of about 5 message delays.","children":[]},{"html":"Throughput: limited by the client&#x27;s rate and node 0&#x27;s mempool, not by consensus, at 4 nodes. Linear vs quadratic messages cannot show at n = 4.","text":"Throughput: limited by the client's rate and node 0's mempool, not by consensus, at 4 nodes. Linear vs quadratic messages cannot show at n = 4.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"One row: &quot;asonnino/hotstuff dc01ac8, 2-chain (Jolteon-style) variant, upstream client, latency from logs on two clocks&quot;. Every HotStuff figure carries that caveat.","text":"One row: \"asonnino/hotstuff dc01ac8, 2-chain (Jolteon-style) variant, upstream client, latency from logs on two clocks\". Every HotStuff figure carries that caveat."}]}]},{"h2":"Phase B · Step B8 — The instrument: load, faults, validity (about 3 h)","step":"B8","title":"The instrument: load, faults, validity","hours":"about 3 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The engine gets the hard part of Phase A Step 8 right: open loop, latency from the intended send time. Two things around it break fairness: one fixed in-flight window for every system, and validity gates that nothing runs. On main, a run is &quot;valid&quot; if its manifest says complete, and nothing more.","text":"The engine gets the hard part of Phase A Step 8 right: open loop, latency from the intended send time. Two things around it break fairness: one fixed in-flight window for every system, and validity gates that nothing runs. On main, a run is \"valid\" if its manifest says complete, and nothing more."}]},{"h3":"The load model","blocks":[{"t":"table","head":["Phase A idea","Code on main","Verdict"],"rows":[["Open loop","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L114-L124\" target=\"_blank\" rel=\"noopener noreferrer\">WorkloadEngine.java L114-L124<\/a>","Correct: a fixed schedule, one issuing thread"],["Coordinated omission","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L135-L139\" target=\"_blank\" rel=\"noopener noreferrer\">L135-L137<\/a>","Correct: latency = completion − intended send"],["Saturation","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L122-L124\" target=\"_blank\" rel=\"noopener noreferrer\">L123<\/a>","Rate 0 = closed loop with W clients. Fine for a throughput ceiling; do not quote its tail"],["Failed writes","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L126-L134\" target=\"_blank\" rel=\"noopener noreferrer\">L130-L134<\/a>","Counted, but not in the histogram. Fault-run percentiles describe survivors only"],["Warm-up, length","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69\" target=\"_blank\" rel=\"noopener noreferrer\">MatrixRunner.java L63-L69<\/a>","180 s discarded, 300 s measured, window 200, 1,024 B"],["Fault time","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L86-L91\" target=\"_blank\" rel=\"noopener noreferrer\">MatrixRunner.java L90<\/a>","Warm-up + 60 s = 240 s; packet loss 30%"],["Repetitions, order","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L80-L98\" target=\"_blank\" rel=\"noopener noreferrer\">MatrixRunner.java L80-L98<\/a>","n per cell from <code>--reps<\/code>; seeded shuffle within one system&#x27;s block; blocks run in series"]]}]},{"h3":"What to check: the window","blocks":[{"t":"ol","items":[{"html":"Little&#x27;s law caps every run at W ÷ latency. With W = 200 that binds CometBFT at about 180–220 tx/s (B6) and may bind others. The methodology says saturation is found by raising concurrency &quot;the way Paxi does it&quot; (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L59-L60\" target=\"_blank\" rel=\"noopener noreferrer\">DATA_ANALYSIS_METHODOLOGY.md L59-L60<\/a>). No code does that, and <code>campaign-run<\/code> cannot change W.","text":"Little's law caps every run at W ÷ latency. With W = 200 that binds CometBFT at about 180–220 tx/s (B6) and may bind others. The methodology says saturation is found by raising concurrency \"the way Paxi does it\" (DATA_ANALYSIS_METHODOLOGY.md L59-L60). No code does that, and campaign-run cannot change W.","children":[]},{"html":"Slow failures eat the window. A write that times out holds its slot for 5 s. If R × (share of writes timing out) × 5 s &gt; 200, the engine stalls. Example: a third of writes to an isolated node at 120 ops/s already fills it. The system then looks worse than it is.","text":"Slow failures eat the window. A write that times out holds its slot for 5 s. If R × (share of writes timing out) × 5 s > 200, the engine stalls. Example: a third of writes to an isolated node at 120 ops/s already fills it. The system then looks worse than it is.","children":[]},{"html":"The gate meant to catch this, <code>window_headroom<\/code>, always SKIPs on main (B0).","text":"The gate meant to catch this, window_headroom, always SKIPs on main (B0).","children":[]}]}]},{"h3":"What to check: faults","blocks":[{"t":"table","head":["Scenario","Mechanism","Target","Undone"],"rows":[["leader_kill","<code>docker kill<\/code> (SIGKILL)","detected leader; replica 0 for EPaxos and CometBFT","never (fresh cluster next run)"],["double_kill","two <code>docker kill<\/code>","nodes 0 and 1, leader or not","never"],["packet_loss","<code>tc netem loss 30%<\/code> on the private NIC","detected leader; replica 0 for EPaxos and CometBFT","after the run"],["network_partition","iptables DROP, target ↔ each peer","detected leader (replica 0 for EPaxos and CometBFT); the loadgen path stays open","after the run"],["slow_node","<code>stress-ng --cpu 2 --timeout 120s<\/code> on the host","detected leader; replica 0 for EPaxos and CometBFT","ends by itself at about 360 s"]]},{"t":"p","html":"Sources: <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/ClusterProvider.java#L69-L83\" target=\"_blank\" rel=\"noopener noreferrer\">ClusterProvider.java L69-L83<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L51-L112\" target=\"_blank\" rel=\"noopener noreferrer\">SshFaultInjector.java L51-L112<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L165-L205\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L165-L205<\/a>.","text":"Sources: ClusterProvider.java L69-L83, SshFaultInjector.java L51-L112, RemoteRunner.java L165-L205."},{"t":"ol","items":[{"html":"Every fault lasts to the end of the run. Recovery after healing is never measured.","text":"Every fault lasts to the end of the run. Recovery after healing is never measured.","children":[]},{"html":"slow_node stops at about 360 s, so half its window is a normal run.","text":"slow_node stops at about 360 s, so half its window is a normal run.","children":[]},{"html":"packet_loss also hits client traffic and Prometheus scrapes to that node (F55).","text":"packet_loss also hits client traffic and Prometheus scrapes to that node (F55).","children":[]},{"html":"failover_ms = first commit after the mark (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/EventLog.java#L101-L112\" target=\"_blank\" rel=\"noopener noreferrer\">EventLog.java L101-L112<\/a>). It means something only where all commits stop: etcd, Kafka, Paxos. For EPaxos and CometBFT it is near 0 by construction.","text":"failover_ms = first commit after the mark (EventLog.java L101-L112). It means something only where all commits stop: etcd, Kafka, Paxos. For EPaxos and CometBFT it is near 0 by construction.","children":[]},{"html":"The runbook plans 180 s failover trials (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md?plain=1#L88-L92\" target=\"_blank\" rel=\"noopener noreferrer\">CAMPAIGN_RUNBOOK.md L88-L92<\/a>); the code runs them for 480 s like every cell. That adds about 1 h per 30 trials.","text":"The runbook plans 180 s failover trials (CAMPAIGN_RUNBOOK.md L88-L92); the code runs them for 480 s like every cell. That adds about 1 h per 30 trials.","children":[]}]}]},{"h3":"What to check: validity and confidence","blocks":[{"t":"ol","items":[{"html":"Gates on main (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L94-L124\" target=\"_blank\" rel=\"noopener noreferrer\">ValidityChecker.java L94-L124<\/a>): rate adherence and convergence can run from the CSVs. Loadgen CPU, steal and clock need <code>metrics/<\/code>, which nothing on main writes. Fault ground truth FAILs any fault cell whose fault never fired (F51), for every system. Otherwise it SKIPs: for etcd, CometBFT and Kafka because <code>metrics/<\/code> is missing, and for Paxos, EPaxos and HotStuff always. Window headroom, restarts and durability always SKIP.","text":"Gates on main (ValidityChecker.java L94-L124): rate adherence and convergence can run from the CSVs. Loadgen CPU, steal and clock need metrics/, which nothing on main writes. Fault ground truth FAILs any fault cell whose fault never fired (F51), for every system. Otherwise it SKIPs: for etcd, CometBFT and Kafka because metrics/ is missing, and for Paxos, EPaxos and HotStuff always. Window headroom, restarts and durability always SKIP.","children":[]},{"html":"Nothing calls <code>check()<\/code>, and <code>analyse.py<\/code> never reads <code>validity.json<\/code>. So the six gates filter no thesis number today.","text":"Nothing calls check(), and analyse.py never reads validity.json. So the six gates filter no thesis number today.","children":[]},{"html":"Gate 3 has four open findings, F52–F55 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L823-L839\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md L827-L830<\/a>).","text":"Gate 3 has four open findings, F52–F55 (PENDING_TASKS.md L827-L830).","children":[]},{"html":"Confidence grading exists only as text: the four-gate claim framework (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L183-L200\" target=\"_blank\" rel=\"noopener noreferrer\">DATA_ANALYSIS_METHODOLOGY.md L183-L200<\/a>). There is no grading code on main.","text":"Confidence grading exists only as text: the four-gate claim framework (DATA_ANALYSIS_METHODOLOGY.md L183-L200). There is no grading code on main.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"p","html":"See the ranked list below; items 1, 2, 4 and 6 come from this step.","text":"See the ranked list below; items 1, 2, 4 and 6 come from this step."}]},{"h3":"Prediction to write down","blocks":[{"t":"p","html":"For each system, write the window you expect it to need: W ≥ 2 × target rate × expected p99. If a run&#x27;s throughput × mean latency comes within 10% of W, call it window-bound before you look at its numbers.","text":"For each system, write the window you expect it to need: W ≥ 2 × target rate × expected p99. If a run's throughput × mean latency comes within 10% of W, call it window-bound before you look at its numbers."}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"A methodology table: open loop, intended-time latency, W per system, 180 + 300 s, n = 5 and ≥ 30, seeded order within a block, the fault table above, and which gates actually ran.","text":"A methodology table: open loop, intended-time latency, W per system, 180 + 300 s, n = 5 and ≥ 30, seeded order within a block, the fault table above, and which gates actually ran."}]}]},{"h2":"Phase B · What counts as \"done\", per system","title":"What counts as \"done\", per system","parts":[{"h3":null,"blocks":[{"t":"p","html":"In six systems, the server the client contacted replies once the write is replicated and committed. HotStuff alone has no reply, and only etcd is known to be durable on disk at &quot;done&quot; (CometBFT and HotStuff are not checked). Put this table in the methodology chapter as it is.","text":"In six systems, the server the client contacted replies once the write is replicated and committed. HotStuff alone has no reply, and only etcd is known to be durable on disk at \"done\" (CometBFT and HotStuff are not checked). Put this table in the methodology chapter as it is."},{"t":"table","head":["System","Client call (code)","Completes when","On disk at &quot;done&quot;?","Caveat"],"rows":[["etcd","jetcd <code>put()<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L73-L82\" target=\"_blank\" rel=\"noopener noreferrer\">EtcdDriver.java L79-L81<\/a>)","A majority has the entry in its WAL, and the contacted member has applied it","Yes, fsynced on a majority","5 s client timeout"],["KRaft, Kafka+ZK","<code>send()<\/code> callback, <code>acks=all<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L109-L131\" target=\"_blank\" rel=\"noopener noreferrer\">KafkaDriver.java L125-L131<\/a>)","Every current ISR member (at least 2 of 3) has appended it","No: page cache on the ISR","Consensus is not on this path; ZAB or Raft only handles metadata and failover"],["CometBFT","<code>broadcast_tx_commit<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/CometBftDriver.java#L93-L139\" target=\"_blank\" rel=\"noopener noreferrer\">CometBftDriver.java L106-L139<\/a>)","The tx is in a block with more than 2/3 precommits, and both result codes are 0","Not checked","Includes waiting for the next block"],["Paxos (Paxi)","HTTP PUT → 200 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L134-L145\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L134-L145<\/a>)","A majority accepted it and the leader executed it (checked at 6823d0b)","No: in memory","Client talks only to the leader"],["EPaxos (Paxi)","HTTP PUT → 200, round-robin","Committed, and executed by the contacted replica (checked at 6823d0b)","No: in memory","No recovery; execution ignores dependencies"],["HotStuff","No reply; log analysis (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/HotStuffLogAnalyzer.java#L216-L233\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuffLogAnalyzer.java L216-L233<\/a>)","The earliest &quot;Committed&quot; log line, on any node, for the batch holding a sample tx","Not checked","Mean only; client and node clocks differ"]]},{"t":"p","html":"Two consequences for the thesis:","text":"Two consequences for the thesis:"},{"t":"ol","items":[{"html":"A latency comparison across rows compares different events. Say which event in every figure caption, and never put HotStuff in the same latency chart as the other six without that note.","text":"A latency comparison across rows compares different events. Say which event in every figure caption, and never put HotStuff in the same latency chart as the other six without that note.","children":[]},{"html":"The durability column is Phase A&#x27;s fairness trap in concrete form. etcd pays for fsync; Kafka and Paxi do not.","text":"The durability column is Phase A's fairness trap in concrete form. etcd pays for fsync; Kafka and Paxi do not.","children":[]}]}]}]},{"h2":"Phase B · Changes before the campaign, ranked by risk to validity","title":"Changes before the campaign, ranked by risk to validity","parts":[{"h3":null,"blocks":[{"t":"p","html":"Items 1–4 decide whether the numbers mean what the thesis says; skip them and some cells measure the harness. Items 7 and 9 change the provider recipes, so the seven goldens change too. Do those before the G2 read-through, or you will read it twice. Effort is my estimate.","text":"Items 1–4 decide whether the numbers mean what the thesis says; skip them and some cells measure the harness. Items 7 and 9 change the provider recipes, so the seven goldens change too. Do those before the G2 read-through, or you will read it twice. Effort is my estimate."},{"t":"ol","items":[{"html":"<strong>Pick the branch.<\/strong> Main lacks the exporter, self-metrics and grading code that <code>ninth-review-handoff<\/code> has (see &quot;How to use it&quot;). Decide first; a merge could cost more than everything below.","text":"Pick the branch. Main lacks the exporter, self-metrics and grading code that ninth-review-handoff has (see \"How to use it\"). Decide first; a merge could cost more than everything below.","children":[]},{"html":"<strong>Window per system, and a concurrency sweep for saturation<\/strong> (about 3 h). Add <code>--window<\/code> to <code>campaign-run<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L84-L111\" target=\"_blank\" rel=\"noopener noreferrer\">Main.java L85-L86<\/a>) and a field to <code>MatrixRunner.block<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69\" target=\"_blank\" rel=\"noopener noreferrer\">L63-L69<\/a>). Without it, CometBFT saturation is about 180–220 tx/s (B6), etcd&#x27;s leader_kill failover_ms measures the 5 s client timeout (B1), and the methodology&#x27;s &quot;raise concurrency until it plateaus&quot; has no code.","text":"Window per system, and a concurrency sweep for saturation (about 3 h). Add --window to campaign-run (Main.java L85-L86) and a field to MatrixRunner.block (L63-L69). Without it, CometBFT saturation is about 180–220 tx/s (B6), etcd's leader_kill failover_ms measures the 5 s client timeout (B1), and the methodology's \"raise concurrency until it plateaus\" has no code.","children":[]},{"html":"<strong>Make validity filter the data<\/strong> (about 4 h). Add a CLI that runs <code>ValidityChecker.checkTree<\/code> over a results tree (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L126-L151\" target=\"_blank\" rel=\"noopener noreferrer\">ValidityChecker.java L130-L150<\/a>). Make <code>analyse.py<\/code> read <code>validity.json<\/code> and exclude invalid runs (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L66-L71\" target=\"_blank\" rel=\"noopener noreferrer\">analyse.py L66-L71<\/a> checks status only). Add an offline window check: throughput × mean latency ≥ 0.9 × W means window-bound.","text":"Make validity filter the data (about 4 h). Add a CLI that runs ValidityChecker.checkTree over a results tree (ValidityChecker.java L130-L150). Make analyse.py read validity.json and exclude invalid runs (analyse.py L66-L71 checks status only). Add an offline window check: throughput × mean latency ≥ 0.9 × W means window-bound.","children":[]},{"html":"<strong>Align the thesis register with the harness<\/strong> (about 2 h, mostly decisions). <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L44-L85\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex<\/a> has keys for etcd, Tendermint and HotStuff only: none for KRaft, Kafka+ZK, Paxos or EPaxos. It also asks for BFT at n = 7 and a HotStuff p99, which main cannot produce (B5, B7). It also asks for failover keys for Tendermint and HotStuff (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L68-L73\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex L68-L73<\/a>), which main cannot produce or which mean nothing; replace them with change 4&#x27;s metrics, or drop them.","text":"Align the thesis register with the harness (about 2 h, mostly decisions). measurements.tex has keys for etcd, Tendermint and HotStuff only: none for KRaft, Kafka+ZK, Paxos or EPaxos. It also asks for BFT at n = 7 and a HotStuff p99, which main cannot produce (B5, B7). It also asks for failover keys for Tendermint and HotStuff (measurements.tex L68-L73), which main cannot produce or which mean nothing; replace them with change 4's metrics, or drop them.","children":[]},{"html":"<strong>Fault metrics that fit each system<\/strong> (about 4 h, in <code>analyse.py<\/code>). Keep failover_ms for etcd, Kafka and Paxos. For EPaxos and CometBFT, report error share, survivors&#x27; p99, longest zero-commit stretch and time back to 90% of pre-fault throughput, all from <code>throughput.csv<\/code>. Print error share beside every fault-run latency (B8).","text":"Fault metrics that fit each system (about 4 h, in analyse.py). Keep failover_ms for etcd, Kafka and Paxos. For EPaxos and CometBFT, report error share, survivors' p99, longest zero-commit stretch and time back to 90% of pre-fault throughput, all from throughput.csv. Print error share beside every fault-run latency (B8).","children":[]},{"html":"<strong>Paxos client entry<\/strong> (about 2 h). Either fail over to another endpoint in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L76-L82\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L80-L82<\/a>, or relabel the result (B2). Also cut Paxos leader_kill to 5 trials.","text":"Paxos client entry (about 2 h). Either fail over to another endpoint in PaxiDriver.java L80-L82, or relabel the result (B2). Also cut Paxos leader_kill to 5 trials.","children":[]},{"html":"<strong>Failover trial timing, F56, F57<\/strong> (about 3 h). Give leader_kill blocks the runbook&#x27;s 180 s window, or update the budget. Take <code>started<\/code> after <code>connect()<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L114-L134\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L125<\/a>). Give the fault thread&#x27;s wait loop an exit (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L168-L173\" target=\"_blank\" rel=\"noopener noreferrer\">L170-L172<\/a>).","text":"Failover trial timing, F56, F57 (about 3 h). Give leader_kill blocks the runbook's 180 s window, or update the budget. Take started after connect() (RemoteRunner.java L125). Give the fault thread's wait loop an exit (L170-L172).","children":[]},{"html":"<strong>Kafka configuration<\/strong> (about 3 h, changes goldens). Equalize or label the session timeouts. Decide flush. For KRaft at 5 and 7 nodes, set RF = N, or drop it from the scalability claim (B3).","text":"Kafka configuration (about 3 h, changes goldens). Equalize or label the session timeouts. Decide flush. For KRaft at 5 and 7 nodes, set RF = N, or drop it from the scalability claim (B3).","children":[]},{"html":"<strong>HotStuff percentiles and clock offset<\/strong> (about 3 h). Keep per-sample latencies in the analyzer; record chrony offsets in the manifest (B7).","text":"HotStuff percentiles and clock offset (about 3 h). Keep per-sample latencies in the analyzer; record chrony offsets in the manifest (B7).","children":[]},{"html":"<strong>Pin and record configuration<\/strong> (about 3 h, changes goldens). etcd timer flags, the jetcd balancer policy, and a copy of CometBFT&#x27;s <code>config.toml<\/code> in every run&#x27;s <code>logs/<\/code> (B1, B6).","text":"Pin and record configuration (about 3 h, changes goldens). etcd timer flags, the jetcd balancer policy, and a copy of CometBFT's config.toml in every run's logs/ (B1, B6).","children":[]},{"html":"<strong>Fix the docs that contradict the code<\/strong> (about 2 h). &quot;Sub-second&quot; etcd failover, &quot;fsync-backed Kafka&quot;, &quot;three-phase&quot; HotStuff, &quot;latency on a single clock&quot;, and the stale status lines listed in B0.","text":"Fix the docs that contradict the code (about 2 h). \"Sub-second\" etcd failover, \"fsync-backed Kafka\", \"three-phase\" HotStuff, \"latency on a single clock\", and the stale status lines listed in B0.","children":[]}]},{"t":"p","html":"Not code, but plan it now: the hardware-bridge etcd block on Phase C machines (B5).","text":"Not code, but plan it now: the hardware-bridge etcd block on Phase C machines (B5)."}]}]},{"h2":"Phase B · Running the benchmark: laptop to campaign","title":"Running the benchmark: laptop to campaign","parts":[{"h3":null,"blocks":[{"t":"p","html":"The repo budgets about 118 machine hours and about €47, or €61 with 30% for reruns (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md?plain=1#L60-L72\" target=\"_blank\" rel=\"noopener noreferrer\">CAMPAIGN_RUNBOOK.md L60-L72<\/a>). Steps 7 and 10 cover gaps the repo&#x27;s docs and code leave open.","text":"The repo budgets about 118 machine hours and about €47, or €61 with 30% for reruns (CAMPAIGN_RUNBOOK.md L60-L72). Steps 7 and 10 cover gaps the repo's docs and code leave open."}]},{"h3":"On the laptop (no cost)","blocks":[{"t":"ol","items":[{"html":"Rerun the full gate on a quiet machine: <code>cd harness &amp;&amp; mvn21 clean verify<\/code>, expecting 172 of 172 (NEXT-0, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L858-L863\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md L858-L863<\/a>).","text":"Rerun the full gate on a quiet machine: cd harness && mvn21 clean verify, expecting 172 of 172 (NEXT-0, PENDING_TASKS.md L858-L863).","children":[]},{"html":"Make the ranked changes, TDD, with the recipe changes (items 7 and 9) first.","text":"Make the ranked changes, TDD, with the recipe changes (items 7 and 9) first.","children":[]},{"html":"Read all seven goldens in <code>harness/src/test/resources/goldens/<\/code> and sign them off (G2, NEXT-1). Nothing billed may start before this.","text":"Read all seven goldens in harness/src/test/resources/goldens/ and sign them off (G2, NEXT-1). Nothing billed may start before this.","children":[]},{"html":"Commit your predictions (<code>pred.*<\/code> keys) in their own commit.","text":"Commit your predictions (pred.* keys) in their own commit.","children":[]}]}]},{"h3":"First contact (about €1)","blocks":[{"t":"ol","items":[{"html":"Check prices: <code>hcloud server-type list<\/code>, then fix <code>hourly_eur<\/code> in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L97-L101\" target=\"_blank\" rel=\"noopener noreferrer\">infra/main.tf L97-L101<\/a>. The cpx21 price is marked unconfirmed.","text":"Check prices: hcloud server-type list, then fix hourly_eur in infra/main.tf L97-L101. The cpx21 price is marked unconfirmed.","children":[]},{"html":"Canary. The guide&#x27;s &quot;2-VM&quot; canary cannot run as written; the ledger says so (F58). Use the Phase A shape for one hour instead: <code>terraform apply<\/code> from <code>infra/<\/code>, about €0.30.","text":"Canary. The guide's \"2-VM\" canary cannot run as written; the ledger says so (F58). Use the Phase A shape for one hour instead: terraform apply from infra/, about €0.30.","children":[]},{"html":"Set up the loadgen (not in the docs). cloud-init installs Docker, chrony and stress-ng, but no Java (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/cloud-init.yaml#L19-L27\" target=\"_blank\" rel=\"noopener noreferrer\">cloud-init.yaml L19-L27<\/a>). Install a Java 21 runtime. Copy the jar, <code>deploy/inventory.env<\/code>, and the private key the inventory names (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/main.tf#L171-L188\" target=\"_blank\" rel=\"noopener noreferrer\">main.tf L185<\/a>).","text":"Set up the loadgen (not in the docs). cloud-init installs Docker, chrony and stress-ng, but no Java (cloud-init.yaml L19-L27). Install a Java 21 runtime. Copy the jar, deploy/inventory.env, and the private key the inventory names (main.tf L185).","children":[]},{"html":"Ship the two local images to each node: <code>docker save paxi:6823d0b | ssh root@&lt;node&gt; docker load<\/code>, and the same for <code>hotstuff:dc01ac8<\/code>, also to the loadgen (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md?plain=1#L34-L38\" target=\"_blank\" rel=\"noopener noreferrer\">HOW_TO_CONTINUE.md L34-L38<\/a>).","text":"Ship the two local images to each node: docker save paxi:6823d0b | ssh root@<node> docker load, and the same for hotstuff:dc01ac8, also to the loadgen (HOW_TO_CONTINUE.md L34-L38).","children":[]},{"html":"One short cell per system: <code>java -jar consensus-bench.jar remote-run --system etcd --scenario baseline --rate 300 --duration 120 --warmup 30 --inventory deploy/inventory.env -v<\/code>. Then one leader_kill cell. Run the first-contact checks in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PER_ALGORITHM_TEST_GUIDE.md?plain=1#L281-L301\" target=\"_blank\" rel=\"noopener noreferrer\">PER_ALGORITHM_TEST_GUIDE.md §8<\/a>.","text":"One short cell per system: java -jar consensus-bench.jar remote-run --system etcd --scenario baseline --rate 300 --duration 120 --warmup 30 --inventory deploy/inventory.env -v. Then one leader_kill cell. Run the first-contact checks in PER_ALGORITHM_TEST_GUIDE.md §8.","children":[]},{"html":"Pilot and G3 (about 10 h, about €3): fix the convergence threshold, and compare the harness with native tools within 15%. Main has no code for the G3 comparison on the cluster (not found); plan to do it by hand.","text":"Pilot and G3 (about 10 h, about €3): fix the convergence threshold, and compare the harness with native tools within 15%. Main has no code for the G3 comparison on the cluster (not found); plan to do it by hand.","children":[]}]}]},{"h3":"One system block (repeat per system)","blocks":[{"t":"ol","items":[{"html":"Preview the order: add <code>--dry-run<\/code> to any command below.","text":"Preview the order: add --dry-run to any command below.","children":[]},{"html":"Saturation: <code>campaign-run --system etcd --size 3 --scenarios baseline --rates 0 --reps 5 --inventory deploy/inventory.env --out results<\/code>. After change 1, repeat with larger windows until throughput stops rising. HotStuff has no saturation mode: <code>remote-run<\/code> refuses rate 0 for it (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L284-L288\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L284-L288<\/a>), so give it a rate sweep only.","text":"Saturation: campaign-run --system etcd --size 3 --scenarios baseline --rates 0 --reps 5 --inventory deploy/inventory.env --out results. After change 1, repeat with larger windows until throughput stops rising. HotStuff has no saturation mode: remote-run refuses rate 0 for it (RemoteRunner.java L284-L288), so give it a rate sweep only.","children":[]},{"html":"Rate sweep: <code>--rates &lt;25%&gt;,&lt;50%&gt;,&lt;75%&gt;<\/code> of the measured saturation.","text":"Rate sweep: --rates <25%>,<50%>,<75%> of the measured saturation.","children":[]},{"html":"Faults: <code>--scenarios packet_loss,network_partition,slow_node,double_kill --rates &lt;50%&gt;<\/code>. The repo does not name a rate for fault cells; pick one and state it.","text":"Faults: --scenarios packet_loss,network_partition,slow_node,double_kill --rates <50%>. The repo does not name a rate for fault cells; pick one and state it.","children":[]},{"html":"Failover: <code>--scenarios leader_kill --rates &lt;50%&gt; --reps 30<\/code> (5 for Paxos).","text":"Failover: --scenarios leader_kill --rates <50%> --reps 30 (5 for Paxos).","children":[]},{"html":"Paxi only: <code>--conflicts 0,0.02,0.10<\/code>.","text":"Paxi only: --conflicts 0,0.02,0.10.","children":[]},{"html":"Failed cells land in <code>results/campaign-log.jsonl<\/code>. Rerun the same command; complete cells are skipped.","text":"Failed cells land in results/campaign-log.jsonl. Rerun the same command; complete cells are skipped.","children":[]}]}]},{"h3":"End of each phase","blocks":[{"t":"ol","items":[{"html":"<code>scripts/collect_block.sh &lt;loadgen_ip&gt; &lt;obs_ip&gt; &lt;dest&gt;<\/code> pulls results and a Prometheus snapshot into one dated folder.","text":"scripts/collect_block.sh <loadgen_ip> <obs_ip> <dest> pulls results and a Prometheus snapshot into one dated folder.","children":[]},{"html":"Count manifests against cells run, then <code>terraform destroy<\/code> and check that <code>hcloud server list<\/code> is empty. A forgotten Phase A cluster costs about €7 a day.","text":"Count manifests against cells run, then terraform destroy and check that hcloud server list is empty. A forgotten Phase A cluster costs about €7 a day.","children":[]}]},{"t":"table","head":["Phase","Shape","€/h","Hours","Cost"],"rows":[["A: etcd, KRaft, Kafka+ZK, Paxos, EPaxos at size 3","3 × ccx13 + loadgen + obs","0.292","~71","~€21"],["B: etcd, KRaft at sizes 5, 7","7 × ccx13 + support","0.567","~15","~€9"],["C: CometBFT, HotStuff at size 4","4 × ccx23 + support","0.636","~22","~€14"],["G3 and pilot","Phase A shape","0.292","~10","~€3"]]},{"t":"p","html":"The hours come from the runbook&#x27;s 8-minute failover trials. As coded, those trials take about 10 minutes (B8), so add about 1 h per system.","text":"The hours come from the runbook's 8-minute failover trials. As coded, those trials take about 10 minutes (B8), so add about 1 h per system."}]}]},{"h2":"Phase B · Analysis: from raw results to the thesis","title":"Analysis: from raw results to the thesis","parts":[{"h3":null,"blocks":[{"t":"p","html":"On main, <code>analyse.py<\/code> produces per-cell tables, but none of the eight planned figures, no pooled percentiles and no HotStuff numbers. Numbers reach the thesis only by hand, through named keys in <code>thesis/data/measurements.tex<\/code>.","text":"On main, analyse.py produces per-cell tables, but none of the eight planned figures, no pooled percentiles and no HotStuff numbers. Numbers reach the thesis only by hand, through named keys in thesis/data/measurements.tex."}]},{"h3":"What exists","blocks":[{"t":"table","head":["Step","Tool","Output","State on main"],"rows":[["Exclude","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L41-L74\" target=\"_blank\" rel=\"noopener noreferrer\">analyse.py L41-L74<\/a>","<code>excluded.csv<\/code>: status not complete, or laptop runs","Works; ignores <code>validity.json<\/code>"],["Per run","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L77-L110\" target=\"_blank\" rel=\"noopener noreferrer\">L77-L110<\/a>","<code>runs.csv<\/code>: throughput mean and CoV, point latencies, failover_ms","Works for six systems; HotStuff rows stay empty because <code>summary.txt<\/code> is never read"],["Per cell","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/analysis/analyse.py#L125-L149\" target=\"_blank\" rel=\"noopener noreferrer\">L125-L149<\/a>","<code>cells.csv<\/code>: n, throughput median and 95% bootstrap CI, p50/p99 spreads, failover list","Works"],["Pooled percentiles","<code>latency.hlog<\/code> per run","merged histograms","Not built: analyse.py has no pooling code, only a note that it would need <code>pip install hdrhistogram<\/code>"],["Tests, figures","methodology §5 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L166-L181\" target=\"_blank\" rel=\"noopener noreferrer\">L166-L181<\/a>)","Holm, Cliff&#x27;s delta, figures F1–F8","Not built"],["Into the thesis","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/thesis/data/measurements.tex#L18-L24\" target=\"_blank\" rel=\"noopener noreferrer\">measurements.tex L18-L24<\/a>","<code>\\declaremeasurement{key}{value}<\/code>, then <code>make data<\/code>","By hand; no script fills it"]]},{"t":"p","html":"One trap: for fault runs, <code>read_throughput<\/code> averages the whole window, before and after the fault. Fault cells need windows split at <code>fault_injected_at_ms<\/code>.","text":"One trap: for fault runs, read_throughput averages the whole window, before and after the fault. Fault cells need windows split at fault_injected_at_ms."}]},{"h3":"The order to build and run it","blocks":[{"t":"ol","items":[{"html":"Validate the tree (ranked change 2), then run <code>python3 analysis/analyse.py &lt;collected&gt;/results --out analysis-out<\/code>.","text":"Validate the tree (ranked change 2), then run python3 analysis/analyse.py <collected>/results --out analysis-out.","children":[]},{"html":"Read <code>excluded.csv<\/code> first. Every exclusion must have a reason you can defend.","text":"Read excluded.csv first. Every exclusion must have a reason you can defend.","children":[]},{"html":"Add pooled histograms from <code>latency.hlog<\/code>. Report per-run p99 as a spread beside them; never average percentiles.","text":"Add pooled histograms from latency.hlog. Report per-run p99 as a spread beside them; never average percentiles.","children":[]},{"html":"Draw F1 (throughput–latency curves) and F2 (saturation with CIs) first; most of the thesis rests on them.","text":"Draw F1 (throughput–latency curves) and F2 (saturation with CIs) first; most of the thesis rests on them.","children":[]},{"html":"Add the fault windows and metrics from ranked change 4, then F4 (failover ECDF) and F5 (throughput ±60 s around the fault).","text":"Add the fault windows and metrics from ranked change 4, then F4 (failover ECDF) and F5 (throughput ±60 s around the fault).","children":[]},{"html":"Write a small script from <code>cells.csv<\/code> to <code>\\declaremeasurement<\/code> lines, so no number is typed twice.","text":"Write a small script from cells.csv to \\declaremeasurement lines, so no number is typed twice.","children":[]}]}]},{"h3":"Check each result against its prediction","blocks":[{"t":"p","html":"The repo&#x27;s rule: every material deviation gets one of four labels — measurement artifact, implementation property, environment, or protocol behaviour (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L620-L623\" target=\"_blank\" rel=\"noopener noreferrer\">PROJECT_STATE.md L620-L623<\/a>). Fill in this table as results arrive.","text":"The repo's rule: every material deviation gets one of four labels — measurement artifact, implementation property, environment, or protocol behaviour (PROJECT_STATE.md L620-L623). Fill in this table as results arrive."},{"t":"table","head":["Prediction (step)","Expected","Observed","Label","Evidence"],"rows":[["etcd leader_kill failover (B1)","Mostly 0.9–1.9 s, median about 1.25 s; about 5 s if the window binds","","",""],["KRaft vs ZK failover, default timeouts (B3)","about 9 s vs about 18 s","","",""],["Paxos leader_kill (B2)","zero commits, failover null","","",""],["EPaxos p99, c from 0 to 10% (B4)","rises; Paxos flat","","",""],["CometBFT p50 below saturation (B6)","1.0–1.5 s","","",""],["CometBFT block interval after replica 0 kill (B6)","about 1.75 s","","",""],["HotStuff vs CometBFT p50 (B7)","HotStuff lower","","",""],["Any run with throughput × mean latency ≥ 0.9 W (B8)","none, after change 1","","",""]]},{"t":"p","html":"A claim enters the conclusions only if it clears the methodology&#x27;s four gates: estimated with a CI, explained by mechanism, consistent in direction with the papers, and stated with its caveat (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/DATA_ANALYSIS_METHODOLOGY.md?plain=1#L183-L200\" target=\"_blank\" rel=\"noopener noreferrer\">DATA_ANALYSIS_METHODOLOGY.md L183-L200<\/a>). Anything less is an observation.","text":"A claim enters the conclusions only if it clears the methodology's four gates: estimated with a CI, explained by mechanism, consistent in direction with the papers, and stated with its caveat (DATA_ANALYSIS_METHODOLOGY.md L183-L200). Anything less is an observation."}]}]},{"h2":"Phase B sources","title":"Phase B sources","parts":[{"h3":null,"blocks":[{"t":"p","html":"Everything below was read on 18 Nov 2026, at commit 121cf05 on main, and rechecked on 20 Nov 2026 against the same commit. Theory comes from the <a href=\"https://claude.ai/artifact/7DzYYjaEGHj5o2s6GErU5J\" target=\"_blank\" rel=\"noopener noreferrer\">Phase A doc<\/a>.","text":"Everything below was read on 18 Nov 2026, at commit 121cf05 on main, and rechecked on 20 Nov 2026 against the same commit. Theory comes from the Phase A doc."},{"t":"p","html":"<strong>Repository docs<\/strong>","text":"Repository docs"},{"t":"ul","items":[{"html":"<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/CLAUDE.md\" target=\"_blank\" rel=\"noopener noreferrer\">CLAUDE.md<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/README.md\" target=\"_blank\" rel=\"noopener noreferrer\">README.md<\/a>","text":"CLAUDE.md, README.md","children":[]},{"html":"<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md\" target=\"_blank\" rel=\"noopener noreferrer\">PROJECT_STATE.md<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md<\/a> (seventh review and next increments), <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md\" target=\"_blank\" rel=\"noopener noreferrer\">HOW_TO_CONTINUE.md<\/a>","text":"PROJECT_STATE.md, PENDING_TASKS.md (seventh review and next increments), HOW_TO_CONTINUE.md","children":[]},{"html":"<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/CAMPAIGN_RUNBOOK.md\" target=\"_blank\" rel=\"noopener noreferrer\">CAMPAIGN_RUNBOOK.md<\/a>, <a h
