<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consensus Protocols — Interactive Study Site (Phase B)</title>
<meta name="description" content="Phase B of the consensus-protocols thesis study guide as an interactive site: nine code-reading steps on main, ranked changes, campaign checklist, analysis and a code index.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root {
  /* Layout idea: the study path is a replicated log. Steps are log entries 0–8, grouped by protocol family;
     reading column ~68ch; simulations sit in full-width "bench" cards. Mobile first, bottom tab bar. */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #e9edf1;
  --ink: #15202b;
  --ink-2: #536170;
  --line: #d5dce3;
  --accent: #1d5bbf;
  --accent-ink: #ffffff;
  --accent-soft: #dfe9f9;

  --fam-found: #5c6b7a;
  --fam-crash: #2463c9;
  --fam-lless: #0d8577;
  --fam-byz: #b8561c;
  --fam-meas: #6a55b0;
  --fam-plan: #44515e;

  --ok: #23804a;
  --warn: #a86b00;
  --bad: #c0392b;
  --msg-a: #2463c9;
  --msg-b: #0d8577;
  --msg-c: #b8561c;
  --msg-d: #6a55b0;

  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --step--1: 0.84rem;
  --step-0: 1rem;
  --step-1: 1.18rem;
  --step-2: 1.42rem;
  --step-3: 1.8rem;
  --step-4: 2.3rem;

  --radius: 10px;
  --tap: 44px;
  --side: 16px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317;
    --surface: #151c22;
    --surface-2: #1d262e;
    --ink: #e4e9ee;
    --ink-2: #9aa7b3;
    --line: #2b3640;
    --accent: #78a6f2;
    --accent-ink: #0b1420;
    --accent-soft: #1b2b44;
    --fam-found: #9aa8b6;
    --fam-crash: #78a6f2;
    --fam-lless: #3cc0ae;
    --fam-byz: #ef9152;
    --fam-meas: #a897ee;
    --fam-plan: #a3b0bc;
    --ok: #4cc27b;
    --warn: #e3a838;
    --bad: #f0705f;
    --msg-a: #78a6f2;
    --msg-b: #3cc0ae;
    --msg-c: #ef9152;
    --msg-d: #a897ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317;
  --surface: #151c22;
  --surface-2: #1d262e;
  --ink: #e4e9ee;
  --ink-2: #9aa7b3;
  --line: #2b3640;
  --accent: #78a6f2;
  --accent-ink: #0b1420;
  --accent-soft: #1b2b44;
  --fam-found: #9aa8b6;
  --fam-crash: #78a6f2;
  --fam-lless: #3cc0ae;
  --fam-byz: #ef9152;
  --fam-meas: #a897ee;
  --fam-plan: #a3b0bc;
  --ok: #4cc27b;
  --warn: #e3a838;
  --bad: #f0705f;
  --msg-a: #78a6f2;
  --msg-b: #3cc0ae;
  --msg-c: #ef9152;
  --msg-d: #a897ee;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.55;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: var(--step-3); line-height: 1.15; }
h2 { font-size: var(--step-2); line-height: 1.2; }
h3 { font-size: var(--step-1); line-height: 1.3; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--surface-2); padding: 0.05em 0.3em; border-radius: 4px; }
strong { font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- app frame ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 8px var(--side); min-height: 52px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.progress-pill {
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--surface);
  text-decoration: none;
}

.sidebar { display: none; }
main { padding: 20px var(--side) 120px; min-width: 0; }
.view { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.view > * { min-width: 0; }
.section > * { min-width: 0; }
.view.wide { max-width: 1100px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar a {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px 8px; min-height: 58px;
  color: var(--ink-2); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.01em;
}
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }

@media (min-width: 1000px) {
  .app { grid-template-columns: 270px 1fr; }
  .topbar { grid-column: 1 / -1; }
  .sidebar {
    display: block; position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px); overflow-y: auto;
    border-right: 1px solid var(--line); padding: 18px 14px 40px; background: var(--bg);
  }
  .tabbar { display: none; }
  main { padding: 32px 40px 80px; }
  h1 { font-size: var(--step-4); }
}
.side-group { display: grid; gap: 2px; margin-bottom: 18px; }
.side-label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); padding: 0 10px 6px; }
.side-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 0.93rem;
}
.side-link:hover { background: var(--surface-2); }
.side-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.side-link .idx { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); width: 1.2em; text-align: right; }

/* status dot used everywhere */
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fam, var(--ink-2)); flex: none; background: transparent; }
.dot[data-s="doing"] { background: linear-gradient(90deg, var(--fam, var(--ink-2)) 50%, transparent 50%); }
.dot[data-s="done"] { background: var(--fam, var(--ink-2)); }

.fam-found { --fam: var(--fam-found); }
.fam-crash { --fam: var(--fam-crash); }
.fam-lless { --fam: var(--fam-lless); }
.fam-byz { --fam: var(--fam-byz); }
.fam-meas { --fam: var(--fam-meas); }
.fam-plan { --fam: var(--fam-plan); }

/* ---------- common blocks ---------- */
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-2); }
.lede { font-size: var(--step-1); line-height: 1.5; max-width: 68ch; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.muted { color: var(--ink-2); }
.small { font-size: var(--step--1); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; scroll-margin-top: 110px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: 0.88rem; white-space: nowrap; cursor: pointer;
}
.chip[aria-pressed="true"], .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 8px 14px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 0.92rem; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .ico { width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { min-height: var(--tap); padding: 6px 12px; border: 0; background: transparent; cursor: pointer; font-size: 0.9rem; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 0.82rem; color: var(--ink-2); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.callout { border-left: 3px solid var(--fam, var(--accent)); background: var(--surface); padding: 12px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.formula { font-family: var(--font-mono); font-size: 0.95rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; white-space: nowrap; }

/* ---------- overview ---------- */
.hero { display: grid; gap: 14px; padding-top: 4px; }
.hero h1 { max-width: 26ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--ink-2); }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }

/* the log map */
.logmap { display: grid; gap: 14px; }
.logfam { display: grid; gap: 6px; }
.logfam-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fam); }
.logfam-head::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--fam) 40%, transparent); }
.logentries { display: grid; gap: 6px; }
.logentry {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; min-height: 56px;
  padding: 8px 12px 8px 0; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); text-decoration: none; position: relative; overflow: hidden;
}
.logentry .li { align-self: stretch; display: grid; place-items: center; font-family: var(--font-mono); font-size: 1.1rem; color: var(--fam); border-right: 1px solid var(--line); }
.logentry[data-s="done"] .li { background: var(--fam); color: var(--surface); border-right-color: var(--fam); }
.logentry[data-s="doing"] .li { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fam) 28%, transparent) 0 6px, transparent 6px 12px); }
.logentry .lt { display: grid; gap: 1px; min-width: 0; }
.logentry .lt b { font-weight: 600; font-size: 0.96rem; }
.logentry .lt span { font-size: 0.8rem; color: var(--ink-2); }
.logentry .lh { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
.logentry:hover { border-color: var(--fam); }
.flowarrow { font-family: var(--font-mono); color: var(--ink-2); font-size: 0.8rem; padding-left: 14px; }
@media (min-width: 760px) {
  .logmap { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .logmap .flowarrow { display: none; }
  .logfam-head { min-height: 3.6em; align-items: flex-end; padding-bottom: 2px; }
  .logfam-head::after { display: none; }
  .logentry { grid-template-columns: 34px 1fr; grid-template-rows: auto auto; row-gap: 2px; min-height: 84px; padding: 8px 8px 8px 0; align-items: start; }
  .logentry .li { grid-row: 1 / span 2; font-size: 1rem; }
  .logentry .lt b { font-size: 0.9rem; line-height: 1.25; }
  .logentry .lh { grid-column: 2; }
}

.loop { display: grid; gap: 8px; counter-reset: loop; }
.loop-item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.loop-item .n { font-family: var(--font-mono); color: var(--ink-2); font-size: 0.85rem; padding-top: 2px; }
.loop-flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 0.85rem; }
.loop-flow span.k { padding: 4px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.loop-flow span.a { color: var(--ink-2); }

.bar-cell { display: flex; align-items: center; gap: 8px; }
.hbar { height: 8px; border-radius: 4px; background: var(--fam); opacity: 0.8; }

/* ---------- steps ---------- */
.steps-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.steps-strip a {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-family: var(--font-mono); font-size: 0.85rem;
}
.steps-strip a[aria-current="page"] { border-color: var(--fam); box-shadow: inset 0 -2px 0 var(--fam); }
.step-head { display: grid; gap: 10px; }
.status-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.outcomes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.outcomes ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 4px; }
.jump { position: sticky; top: 52px; z-index: 5; background: var(--bg); padding: 8px 0; margin: -8px 0; }
@media (min-width: 1000px) { .jump { top: 53px; } }

.ideas { display: grid; gap: 8px; counter-reset: idea; }
details.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.idea > summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 46px; position: relative; display: grid; gap: 3px; min-height: var(--tap); }
details.idea > summary::-webkit-details-marker { display: none; }
details.idea > summary::before { counter-increment: idea; content: counter(idea); position: absolute; left: 14px; top: 12px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--fam); }
details.idea > summary b { font-weight: 600; }
details.idea > summary .more { font-size: 0.8rem; color: var(--accent); }
details.idea[open] > summary .more::after { content: " less"; }
details.idea:not([open]) > summary .more::after { content: " more"; }
details.idea .rest { padding: 0 14px 14px 46px; }
details.idea .rest-empty { display: none; }

.linklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.linklist > li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.linklist > li .ico { width: 18px; height: 18px; color: var(--ink-2); margin-top: 2px; }
.linklist ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 6px; }
.linklist .after { grid-column: 2; }

.checks { display: grid; gap: 8px; counter-reset: q; }
details.check { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.check > summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 46px; position: relative; display: grid; gap: 6px; min-height: var(--tap); }
details.check > summary::-webkit-details-marker { display: none; }
details.check > summary::before { counter-increment: q; content: "Q" counter(q); position: absolute; left: 12px; top: 13px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); }
details.check > summary .reveal { font-size: 0.82rem; color: var(--accent); font-weight: 600; }
details.check[open] > summary .reveal::before { content: "Hide answer"; }
details.check:not([open]) > summary .reveal::before { content: "Show answer"; }
details.check .ans { margin: 0 14px 14px 46px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }

.write-box { border: 1px dashed var(--fam); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; background: color-mix(in srgb, var(--fam) 6%, var(--surface)); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-height: 64px; }
.pager a span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-2); }
.pager a.next { text-align: right; }

/* steps list view */
.steplist { display: grid; gap: 10px; }
.steprow { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--fam); border-radius: var(--radius); }
.steprow a.title { color: var(--ink); text-decoration: none; display: grid; gap: 2px; }
.steprow a.title b { font-size: 1.02rem; }
@media (min-width: 700px) { .steprow { grid-template-columns: 1fr auto; align-items: center; } }

/* ---------- timeline ---------- */
.tl-wrap { position: relative; }
.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tl-track { position: relative; height: 272px; }
.tl-axis { position: absolute; left: 0; right: 0; top: 128px; height: 2px; background: var(--line); }
.tl-item { position: absolute; top: 0; width: 132px; height: 272px; scroll-snap-align: center; }
.tl-item button {
  position: absolute; left: 8px; width: 116px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: grid; gap: 2px; color: var(--ink); min-height: 74px;
}
.tl-item.up button { bottom: 160px; }
.tl-item.down button { top: 146px; }
.tl-item button .y { font-family: var(--font-mono); font-size: 0.78rem; color: var(--fam); font-weight: 600; }
.tl-item button .l { font-size: 0.84rem; line-height: 1.25; }
.tl-item button[aria-pressed="true"] { border-color: var(--fam); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fam) 35%, transparent); }
.tl-item .tick { position: absolute; left: 65px; width: 1px; background: color-mix(in srgb, var(--fam) 50%, transparent); }
.tl-item.up .tick { top: 112px; height: 10px; }
.tl-item.down .tick { top: 136px; height: 10px; }
.tl-item .pin { position: absolute; left: 59px; top: 122px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--fam); }
.tl-decade { position: absolute; top: 158px; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-2); transform: translateX(-50%); }
.tl-detail { display: grid; gap: 10px; border-left: 3px solid var(--fam); }

/* ---------- compare ---------- */
.cmp-table th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; color: var(--ink-2); font-weight: 600; }
.cmp-table th button:focus-visible { outline: 2px solid var(--accent); }
.cmp-table th[aria-sort="ascending"] button::after { content: "▲"; font-size: 0.7em; }
.cmp-table th[aria-sort="descending"] button::after { content: "▼"; font-size: 0.7em; }
.cmp-table tbody tr { cursor: pointer; }
.cmp-table tbody tr:hover td { background: var(--surface-2); }
.cmp-table td:first-child, .cmp-table th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--line); min-width: 150px; }
.cmp-table th:first-child { background: var(--surface-2); }
.cmp-table td:first-child { border-left: 4px solid var(--fam); font-weight: 600; }
.cmp-table td { min-width: 130px; }
.cmp-table td.hidecell { color: transparent; background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); position: relative; }
.cmp-table td.hidecell::after { content: "tap"; color: var(--ink-2); font-family: var(--font-mono); font-size: 0.72rem; position: absolute; left: 12px; top: 10px; }

/* ---------- references ---------- */
.searchbox { display: flex; gap: 8px; align-items: center; }
.searchbox input { flex: 1; min-height: var(--tap); border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 8px 12px; font-size: 1rem; }
.refgroup { display: grid; gap: 8px; }
.refitem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }
.refitem .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.refitem .meta a.chip { min-height: 30px; padding: 3px 10px; font-size: 0.78rem; }
mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 3px; }

/* ---------- footer ---------- */
.foot { max-width: 820px; margin: 40px auto 0; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 0.84rem; color: var(--ink-2); }
.foot p { overflow-wrap: anywhere; }

@media (prefers-reduced-motion: reduce) {
  * { scroll-behavior: auto !important; transition: none !important; animation: none !important; }
}

/* external simulator cards */
.ext-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.ext-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.ext-card { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--fam); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; align-content: start; }
.ext-card h3 { font-size: 1.02rem; }
.ext-card .by { font-size: 0.82rem; color: var(--ink-2); }
.ext-card .lim { font-size: 0.86rem; color: var(--ink-2); }
.ext-card .lim b, .ext-card .try b { color: var(--ink); }
.ext-card .btn { justify-self: start; }
.ext-none { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }
.ext-none .btn { justify-self: start; }
.badge { display: inline-block; font-family: var(--font-mono); font-size: 0.74rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); }

@media (max-width: 699px) { .chips.wrap-m { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; } }

/* ---------- Phase B additions ---------- */
.tabbar { grid-template-columns: repeat(6, 1fr); }
.tabbar a { font-size: 0.7rem; }
.banner { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 0.9rem; padding: 8px 12px; border-radius: 8px;
  background: color-mix(in srgb, var(--warn) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line)); }
.banner .mono { font-size: 0.82rem; padding: 1px 6px; border-radius: 5px; background: var(--surface); border: 1px solid var(--line); }
.pair { font-size: 0.92rem; color: var(--ink-2); }

/* state marks in tables */
.st { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 0; flex: none; }
.st-ok { background: var(--ok); }
.st-warn { background: var(--warn); }
.st-bad { background: var(--bad); }
.st-now { background: var(--accent); }

/* plan */
.plan { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.plan-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.plan-row.now { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.plan-lbl { display: grid; gap: 2px; min-width: 0; }
.plan-lbl b { font-weight: 600; font-size: 0.94rem; }
.plan-h { align-self: start; color: var(--ink-2); white-space: nowrap; }
.plan-track { grid-column: 1 / -1; position: relative; height: 8px; border-radius: 4px; background: var(--surface-2); }
.plan-track i { position: absolute; top: 0; bottom: 0; border-radius: 4px; background: var(--fam-plan); opacity: 0.55; }
.plan-row.now .plan-track i { background: var(--accent); opacity: 1; }
.plan-track s { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--accent); border-radius: 1px; }
.plan-now { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; margin: 0; }
@media (min-width: 760px) {
  .plan-row { grid-template-columns: 260px minmax(0, 1fr) 54px; align-items: center; }
  .plan-track { grid-column: auto; }
  .plan-h { align-self: center; text-align: right; }
}

.decision { display: grid; gap: 8px; }
.cards2 { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
.linkcard { display: grid; gap: 4px; text-decoration: none; color: var(--ink); }
.linkcard:hover { border-color: var(--accent); }

/* checklists */
.cl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cl > li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 6px; align-items: start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.cl > li.on { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.cl > li.on .cl-t { color: var(--ink-2); }
.cl input[type="checkbox"], .change > input, .pred-chk input, .matrix input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--ok); cursor: pointer; }
.cl label { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; cursor: pointer; }
.cl-n { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); padding-top: 2px; min-width: 1.2em; }
.cl-t { overflow-wrap: anywhere; }
.cl-t ul, .cl-t ol { margin: 6px 0 0; padding-left: 1.1em; }
.pred-chk { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; cursor: pointer; }
.write-box .prose ol, .write-box .prose ul { margin: 0; padding-left: 1.2em; }

/* changes */
.changes { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.change { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.change.decision { border-style: dashed; border-color: var(--fam-plan); }
.change.on { border-color: color-mix(in srgb, var(--ok) 55%, var(--line)); background: color-mix(in srgb, var(--ok) 6%, var(--surface)); }
.ch-body { display: grid; gap: 6px; min-width: 0; }
.ch-title { display: flex; gap: 10px; align-items: baseline; cursor: pointer; }
.ch-n { font-size: 0.82rem; color: var(--ink-2); white-space: nowrap; }
.ch-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ch-text { margin: 0; font-size: 0.93rem; overflow-wrap: anywhere; }
.change.on .ch-text { color: var(--ink-2); }
.chip.mini { min-height: 28px; padding: 2px 9px; font-size: 0.78rem; font-family: var(--font-mono); }
.badge.b-val { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--surface)); }
.badge.b-gold { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn) 8%, var(--surface)); }
.badge.b-bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }

/* run */
.stages { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; counter-reset: none; }
@media (min-width: 760px) { .stages { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stage { all: unset; box-sizing: border-box; width: 100%; display: grid; gap: 2px; padding: 10px 12px; min-height: 64px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.stage:hover, .stage:focus-visible { border-color: var(--accent); }
.stage:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.stage b { font-size: 0.9rem; font-weight: 600; }
.sys-chips .chip { min-height: 40px; }
.sys-card { display: grid; gap: 10px; border-top: 3px solid var(--fam); }
.sys-card .callout { margin: 0; }
.matrix td.c, .matrix th.c { text-align: center; width: 84px; }
.matrix td { vertical-align: middle; }
tr.sum td { font-weight: 600; border-top: 2px solid var(--line); }
.warnbox { --fam: var(--warn); }

/* done */
.conseq { display: grid; gap: 10px; }
.conseq .callout p { margin: 4px 0 0; }

/* analysis */
.preds { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.pred-card { display: grid; gap: 8px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); align-content: start; }
.pred-card p { margin: 0; }
.fld { display: grid; gap: 3px; font-size: 0.8rem; color: var(--ink-2); }
.fld input, .fld select { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); padding: 6px 10px; font-size: 0.95rem; width: 100%; box-sizing: border-box; }
.mdbox { width: 100%; box-sizing: border-box; font-family: var(--font-mono); font-size: 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 10px; white-space: pre; overflow-x: auto; }

/* code index */
.codeidx { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.codeidx .refitem b { overflow-wrap: anywhere; }
.codeidx .refitem .muted { overflow-wrap: anywhere; }
.lnk { display: inline-flex; align-items: center; min-height: 30px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 0.78rem; text-decoration: none; background: var(--surface-2); }
.lnk:hover { border-color: var(--accent); }
.codeblock { font-family: var(--font-mono); font-size: 0.85rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; overflow-x: auto; }
.prose-wide { gap: 14px; }

@media (max-width: 599px) { .pp-c { display: none; } .brand-mark { font-size: 0.78rem; } }
.write-box > *, .write-box .prose > * { min-width: 0; }
.pred-chk span, .pred-chk code, .write-box code { overflow-wrap: anywhere; }
.topbar .brand { min-width: 0; overflow: hidden; }
@media (max-width: 999px) { .app { grid-template-columns: minmax(0, 1fr); } }

/* tables stack into cards on phones: each row is a card, each cell carries its column name */
@media (max-width: 699px) {

}

e>core/<\/code>","Open-loop engine, HdrHistogram recorder, failover event log, scenario and system enums","8"],["<code>driver/<\/code>","One <code>write()<\/code> per system: etcd (jetcd), Kafka, CometBFT, Paxi; HotStuff log analyzer","1–7"],["<code>topology/<\/code>","Cluster start/stop over SSH, fault injection (kill, tc, iptables, stress-ng)","1, 3, 8"],["<code>campaign/<\/code>","One cell on real VMs (<code>RemoteRunner<\/code>), one block of cells (<code>MatrixRunner<\/code>)","8"],["<code>results/<\/code>","CSVs, <code>latency.hlog<\/code>, <code>manifest.json<\/code> per run","8"],["<code>validity/<\/code>","Six validity gates as a library","8"]]},{"t":"p","html":"Outside the harness: <code>infra/<\/code> (Terraform, cloud-init), <code>observability/<\/code> (Prometheus, Grafana), <code>analysis/analyse.py<\/code>, and <code>thesis/<\/code> (LaTeX, plus the register of pending measurements).","text":"Outside the harness: infra/ (Terraform, cloud-init), observability/ (Prometheus, Grafana), analysis/analyse.py, and thesis/ (LaTeX, plus the register of pending measurements)."}]},{"h3":"Build and test","blocks":[{"t":"ol","items":[{"html":"Build the two local images once: <code>docker build -t paxi:6823d0b infra/paxi<\/code> and <code>docker build -t hotstuff:dc01ac8 infra/hotstuff<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/CLAUDE.md?plain=1#L29-L35\" target=\"_blank\" rel=\"noopener noreferrer\">CLAUDE.md<\/a>).","text":"Build the two local images once: docker build -t paxi:6823d0b infra/paxi and docker build -t hotstuff:dc01ac8 infra/hotstuff (CLAUDE.md).","children":[]},{"html":"Run <code>cd harness &amp;&amp; mvn21 clean verify<\/code>. Expect <code>Tests run: 172, Failures: 0<\/code> (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/LOCAL_TESTING.md?plain=1#L25-L35\" target=\"_blank\" rel=\"noopener noreferrer\">LOCAL_TESTING.md<\/a>). Most tests need the Docker daemon.","text":"Run cd harness && mvn21 clean verify. Expect Tests run: 172, Failures: 0 (LOCAL_TESTING.md). Most tests need the Docker daemon.","children":[]},{"html":"Run <code>python3 analysis/analyse.py --selftest<\/code>. It passed on 18 Nov and again on 20 Nov.","text":"Run python3 analysis/analyse.py --selftest. It passed on 18 Nov and again on 20 Nov.","children":[]},{"html":"Try the one-command loop: <code>java -jar target/consensus-bench-0.1.0-SNAPSHOT.jar local-run --size 3 --rate 100 --duration 6 --warmup 2 -v<\/code>. It serves etcd only (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L185-L224\" target=\"_blank\" rel=\"noopener noreferrer\">Main.java<\/a>).","text":"Try the one-command loop: java -jar target/consensus-bench-0.1.0-SNAPSHOT.jar local-run --size 3 --rate 100 --duration 6 --warmup 2 -v. It serves etcd only (Main.java).","children":[]}]},{"t":"p","html":"I did not run the Maven build or any Docker test for this guide.","text":"I did not run the Maven build or any Docker test for this guide."}]},{"h3":"Built, wired, or neither","blocks":[{"t":"table","head":["Piece","State on main","Evidence"],"rows":[["Engine, drivers, SSH provider for 7 systems, fault injector","Built, laptop-tested","PROJECT_STATE §3"],["<code>remote-run<\/code> (one cell), <code>campaign-run<\/code> (one block)","Built, never run on a VM","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/Main.java#L84-L155\" target=\"_blank\" rel=\"noopener noreferrer\">Main.java<\/a>"],["<code>ValidityChecker<\/code>","Built, but no code path calls it","grep finds no caller outside <code>validity/<\/code>"],["<code>PrometheusExporter<\/code> (metrics/*.csv per run)","Not found on main","named only in comments"],["Harness self-metrics (window occupancy)","Not found","gate SKIPs (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/validity/ValidityChecker.java#L101-L108\" target=\"_blank\" rel=\"noopener noreferrer\">ValidityChecker.java<\/a>)"],["docker-events audit","Not found","gate SKIPs (same file, L113-L115)"],["HotStuff fault scenarios","Refused by code","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L278-L283\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java<\/a>"],["Terraform","Validated and planned, never applied","PROJECT_STATE §3"]]},{"t":"p","html":"An older, slower reading guide to this code exists: &quot;Understanding Consensus Bench&quot; (September 2026, written against <code>ninth-review-handoff<\/code>), at <a href=\"https://claude.ai/artifact/BCwqnxWxyowuYGHfZdUc8g\" target=\"_blank\" rel=\"noopener noreferrer\">this link<\/a> if it is still available. Its paths and line numbers can differ from main, and nothing in Phase B depends on it.","text":"An older, slower reading guide to this code exists: \"Understanding Consensus Bench\" (September 2026, written against ninth-review-handoff), at this link if it is still available. Its paths and line numbers can differ from main, and nothing in Phase B depends on it."}]},{"h3":"Docs that disagree with the code","blocks":[{"t":"ol","items":[{"html":"<code>EXECUTION_AND_COST_MODEL.md<\/code> still calls the SSH provider &quot;designed, not yet built&quot; (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/EXECUTION_AND_COST_MODEL.md?plain=1#L37-L42\" target=\"_blank\" rel=\"noopener noreferrer\">L40<\/a>). It is built.","text":"EXECUTION_AND_COST_MODEL.md still calls the SSH provider \"designed, not yet built\" (L40). It is built.","children":[]},{"html":"<code>CLAUDE.md<\/code> says the repo lives under <code>~/Downloads<\/code> (L3). The ledger already lists this as F64.","text":"CLAUDE.md says the repo lives under ~/Downloads (L3). The ledger already lists this as F64.","children":[]},{"html":"<code>HOW_TO_CONTINUE.md<\/code> is dated 21 Jul and says 170 tests (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/HOW_TO_CONTINUE.md?plain=1#L3-L4\" target=\"_blank\" rel=\"noopener noreferrer\">L3-L4<\/a>). Main has 172.","text":"HOW_TO_CONTINUE.md is dated 21 Jul and says 170 tests (L3-L4). Main has 172.","children":[]}]}]}]},{"h2":"Phase B · Step B1 — Raft in etcd (about 2 h)","step":"B1","title":"Raft in etcd","hours":"about 2 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"etcd runs v3.4.30 with every Raft timer at its default, and the repo&#x27;s own failover prediction is wrong for those defaults. Phase A Step 1 says failover costs one randomized election timeout; here that is 1–2 s, not &quot;sub-second&quot;.","text":"etcd runs v3.4.30 with every Raft timer at its default, and the repo's own failover prediction is wrong for those defaults. Phase A Step 1 says failover costs one randomized election timeout; here that is 1–2 s, not \"sub-second\"."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Version","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L41-L43\" target=\"_blank\" rel=\"noopener noreferrer\">LocalDockerProvider.java L41-L43<\/a>","etcd v3.4.30, pinned by digest"],["Election timeout, heartbeat, PreVote","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L163-L177\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L163-L177<\/a>","No timer flags. Defaults: heartbeat 100 ms, election 1000 ms (<a href=\"https://etcd.io/docs/v3.4/op-guide/configuration\" target=\"_blank\" rel=\"noopener noreferrer\">etcd v3.4 docs<\/a>); <code>--pre-vote<\/code> defaults to false (<code>etcd --help<\/code> in the pinned v3.4.30 image, and <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdmain/help.go#L120-L121\" target=\"_blank\" rel=\"noopener noreferrer\">help.go L120-L121<\/a>)"],["Persistence, fsync","same lines","No <code>--data-dir<\/code>: the WAL sits in the container&#x27;s own filesystem and dies with it. fsync stays on (no unsafe flag is set)"],["Commit, &quot;done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L73-L82\" target=\"_blank\" rel=\"noopener noreferrer\">EtcdDriver.java L73-L82<\/a>","jetcd <code>put()<\/code> future, 5 s timeout"],["Who is leader","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L84-L100\" target=\"_blank\" rel=\"noopener noreferrer\">EtcdDriver.java L84-L100<\/a>","Asks each member; the one whose own id equals the leader id it reports"],["Leader kill","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L51-L56\" target=\"_blank\" rel=\"noopener noreferrer\">SshFaultInjector.java L51-L56<\/a>","<code>docker kill<\/code> = SIGKILL of the detected leader"],["Partitioned leader","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/SshFaultInjector.java#L69-L83\" target=\"_blank\" rel=\"noopener noreferrer\">SshFaultInjector.java L69-L83<\/a>","iptables DROP between leader and peers; the loadgen can still reach the old leader"],["Cluster sizes 3, 5, 7","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L117-L120\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L117-L120<\/a>","Any size up to the provisioned nodes. etcd is the one system whose quorum really grows"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Randomized timeout. etcd v3.4.30 draws each follower&#x27;s timeout as T + rand(T), in 100 ms ticks (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L1586-L1588\" target=\"_blank\" rel=\"noopener noreferrer\">raft.go L1586-L1588<\/a>). With T = 1000 ms that is 1.0–1.9 s. After a leader crash, the first of the two surviving followers to time out campaigns, so the gap is the shorter of two draws, not one draw.","text":"Randomized timeout. etcd v3.4.30 draws each follower's timeout as T + rand(T), in 100 ms ticks (raft.go L1586-L1588). With T = 1000 ms that is 1.0–1.9 s. After a leader crash, the first of the two surviving followers to time out campaigns, so the gap is the shorter of two draws, not one draw.","children":[]},{"html":"CheckQuorum. On, in code, with no flag: <code>CheckQuorum: true<\/code> in <a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/etcdserver/raft.go#L553\" target=\"_blank\" rel=\"noopener noreferrer\">etcdserver/raft.go L553<\/a> at v3.4.30.","text":"CheckQuorum. On, in code, with no flag: CheckQuorum: true in etcdserver/raft.go L553 at v3.4.30.","children":[]},{"html":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader&#x27;s NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L843-L847\" target=\"_blank\" rel=\"noopener noreferrer\">raft.go L843-L847<\/a>), but its reply to the leader&#x27;s next heartbeat carries the higher term (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L874-L897\" target=\"_blank\" rel=\"noopener noreferrer\">L874-L897<\/a>) and the leader steps down (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L870\" target=\"_blank\" rel=\"noopener noreferrer\">L870<\/a>). That is an extra election inside the measured window; the code&#x27;s own comment there says it &quot;can be prevented with Pre-Vote phase&quot;. With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L130-L133\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L130-L133<\/a>), so for those it cannot.","text":"PreVote is not only about healed partitions. Under packet_loss (30% on the leader's NIC for the rest of the run), a follower can miss heartbeats long enough to time out. With PreVote off it raises its term; peers in lease ignore its vote (raft.go L843-L847), but its reply to the leader's next heartbeat carries the higher term (L874-L897) and the leader steps down (L870). That is an extra election inside the measured window; the code's own comment there says it \"can be prevented with Pre-Vote phase\". With PreVote on, the follower asks first and its term does not change. So the flag can change packet_loss results; this is read from the code, not yet observed. Partitions never heal during a run (RemoteRunner.java L130-L133), so for those it cannot.","children":[]},{"html":"jetcd&#x27;s endpoint policy. Checked in the jetcd-core 0.8.5 jar: with no policy set, it uses gRPC <code>round_robin<\/code>. So during a partition about a third of the requests still go to the isolated old leader, which cannot commit them.","text":"jetcd's endpoint policy. Checked in the jetcd-core 0.8.5 jar: with no policy set, it uses gRPC round_robin. So during a partition about a third of the requests still go to the isolated old leader, which cannot commit them.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Pin the timers in the start command: <code>--heartbeat-interval 100 --election-timeout 1000 --pre-vote=false<\/code> (or true, to match etcd 3.5+). Same values, but now the thesis can cite a line instead of a default.","text":"Pin the timers in the start command: --heartbeat-interval 100 --election-timeout 1000 --pre-vote=false (or true, to match etcd 3.5+). Same values, but now the thesis can cite a line instead of a default.","children":[]},{"html":"Set jetcd&#x27;s <code>loadBalancerPolicy<\/code> explicitly in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/EtcdDriver.java#L62-L64\" target=\"_blank\" rel=\"noopener noreferrer\">EtcdDriver.java L62-L64<\/a>, and state it. The default is <code>round_robin<\/code>; setting it explicitly gives the thesis a line to cite.","text":"Set jetcd's loadBalancerPolicy explicitly in EtcdDriver.java L62-L64, and state it. The default is round_robin; setting it explicitly gives the thesis a line to cite.","children":[]},{"html":"Correct the prediction in <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L50-L53\" target=\"_blank\" rel=\"noopener noreferrer\">OBSERVABILITY_AND_EXPECTATIONS.md L52<\/a> from &quot;sub-second&quot; to 1–2 s. The same claim repeats at L167 and in PENDING_TASKS F26-DECISION.","text":"Correct the prediction in OBSERVABILITY_AND_EXPECTATIONS.md L52 from \"sub-second\" to 1–2 s. The same claim repeats at L167 and in PENDING_TASKS F26-DECISION.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"leader_kill, if the window is not the limit: failover_ms mostly between about 900 and 1,900 ms, plus any client reconnect time. It is the shorter of two random timeouts, so most values sit near the low end: median about 1.25 s, mean about 1.4 s. About one trial in ten takes 2–2.9 s, because CheckQuorum&#x27;s lease can make the first campaign fail (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L843-L847\" target=\"_blank\" rel=\"noopener noreferrer\">raft.go L843-L847<\/a>). These numbers come from a simulation of the v3.4.30 timer rules, not from a run. At the campaign rate the window is probably the limit: until the election ends, the followers forward each write to the dead leader (<a href=\"https://github.com/etcd-io/etcd/blob/v3.4.30/raft/raft.go#L1325-L1326\" target=\"_blank\" rel=\"noopener noreferrer\">raft.go L1325-L1326<\/a>), and those writes hang until the 5 s client timeout. Once they fill W = 200 (from about 240 ops/s at the median election time), the engine stops issuing (B8) and failover_ms is about 5 s, a harness number. Check this on the first leader_kill cell, and raise the window (ranked change 1).","text":"leader_kill, if the window is not the limit: failover_ms mostly between about 900 and 1,900 ms, plus any client reconnect time. It is the shorter of two random timeouts, so most values sit near the low end: median about 1.25 s, mean about 1.4 s. About one trial in ten takes 2–2.9 s, because CheckQuorum's lease can make the first campaign fail (raft.go L843-L847). These numbers come from a simulation of the v3.4.30 timer rules, not from a run. At the campaign rate the window is probably the limit: until the election ends, the followers forward each write to the dead leader (raft.go L1325-L1326), and those writes hang until the 5 s client timeout. Once they fill W = 200 (from about 240 ops/s at the median election time), the engine stops issuing (B8) and failover_ms is about 5 s, a harness number. Check this on the first leader_kill cell, and raise the window (ranked change 1).","children":[]},{"html":"Follower kill: not a campaign scenario (leader_kill always hits the leader), so there is nothing to predict here.","text":"Follower kill: not a campaign scenario (leader_kill always hits the leader), so there is nothing to predict here.","children":[]},{"html":"Size 3 → 5 → 7: throughput falls and p50 rises a little; each commit needs 2, 3 and then 4 fsynced acks. If the window is not the limit, failover_ms gets a little shorter, because more followers race to time out: means of about 1.26 s at 5 nodes and 1.22 s at 7 in the same simulation, with the same one-in-ten tail.","text":"Size 3 → 5 → 7: throughput falls and p50 rises a little; each commit needs 2, 3 and then 4 fsynced acks. If the window is not the limit, failover_ms gets a little shorter, because more followers race to time out: means of about 1.26 s at 5 nodes and 1.22 s at 7 in the same simulation, with the same one-in-ten tail.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"The Raft section gets one table row: &quot;etcd v3.4.30, election timeout 1000 ms (randomized to 1.0–1.9 s), heartbeat 100 ms, PreVote off, WAL fsync on&quot;. The failover ECDF (figure F4) should show values mostly between about 0.9 and 1.9 s, with a tail to about 3 s. If most values sit near 5 s, the window set them, not Raft (B8).","text":"The Raft section gets one table row: \"etcd v3.4.30, election timeout 1000 ms (randomized to 1.0–1.9 s), heartbeat 100 ms, PreVote off, WAL fsync on\". The failover ECDF (figure F4) should show values mostly between about 0.9 and 1.9 s, with a tail to about 3 s. If most values sit near 5 s, the window set them, not Raft (B8)."}]}]},{"h2":"Phase B · Step B2 — Multi-Paxos in Paxi (about 1.5 h)","step":"B2","title":"Multi-Paxos in Paxi","hours":"about 1.5 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"Paxos leader_kill, as wired, kills the client&#x27;s only entry point. So it cannot measure Paxi&#x27;s missing failure detector, which is what the repo says it measures. Phase A Step 2&#x27;s &quot;new leader runs Phase 1&quot; never gets a chance to happen.","text":"Paxos leader_kill, as wired, kills the client's only entry point. So it cannot measure Paxi's missing failure detector, which is what the repo says it measures. Phase A Step 2's \"new leader runs Phase 1\" never gets a chance to happen."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Version","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/infra/paxi/Dockerfile#L15-L19\" target=\"_blank\" rel=\"noopener noreferrer\">infra/paxi/Dockerfile L15-L19<\/a>","ailidani/paxi built from commit 6823d0b"],["Start, config","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L204-L231\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L204-L231<\/a>","<code>-id 1.i -algorithm paxos<\/code>, generated <code>config.json<\/code>, no other flags"],["Who becomes leader","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L809-L821\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L809-L821<\/a>","Election is lazy. The readiness probe writes to node 1, so node 1 runs Phase 1 and leads"],["Client entry","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L80-L82\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L80-L82<\/a>","Every Paxos write goes to endpoint 0, which is node 1, the leader"],["&quot;Done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L29-L34\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L29-L34<\/a>","HTTP 200, sent after execution: checked in <a href=\"https://github.com/ailidani/paxi/blob/6823d0b/paxos/paxos.go#L343-L367\" target=\"_blank\" rel=\"noopener noreferrer\">paxos/paxos.go L343-L367<\/a> at 6823d0b"],["Who is leader","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L157-L174\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L157-L174<\/a>","One extra probe write; the <code>Ballot<\/code> reply header names the leader"],["Durability","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L645-L646\" target=\"_blank\" rel=\"noopener noreferrer\">PROJECT_STATE.md L645-L646<\/a>","In-memory store, no fsync"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Trace leader_kill by hand. The detected leader is node 1 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L205\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L198-L205<\/a>), and the driver only talks to node 1. After the kill, every write gets &quot;connection refused&quot; at once.","text":"Trace leader_kill by hand. The detected leader is node 1 (RemoteRunner.java L198-L205), and the driver only talks to node 1. After the kill, every write gets \"connection refused\" at once.","children":[]},{"html":"The ledger&#x27;s story is different. F26 says follower-forwarded writes time out at 5 s because Paxi has no failure detector (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PENDING_TASKS.md?plain=1#L682-L683\" target=\"_blank\" rel=\"noopener noreferrer\">PENDING_TASKS.md L682-L683<\/a>). That needs writes entering at a follower, which never happens here.","text":"The ledger's story is different. F26 says follower-forwarded writes time out at 5 s because Paxi has no failure detector (PENDING_TASKS.md L682-L683). That needs writes entering at a follower, which never happens here.","children":[]},{"html":"Error-rate edge. Fast failures at the full rate for the last 240 s of a 480 s run give an error rate near 0.5. The writer marks a run failed only above 0.5 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/results/CsvResultsWriter.java#L131-L132\" target=\"_blank\" rel=\"noopener noreferrer\">CsvResultsWriter.java L131-L132<\/a>). So these cells will flip between complete and failed.","text":"Error-rate edge. Fast failures at the full rate for the last 240 s of a 480 s run give an error rate near 0.5. The writer marks a run failed only above 0.5 (CsvResultsWriter.java L131-L132). So these cells will flip between complete and failed.","children":[]},{"html":"Partition isolates node 1 from its peers but not from the client. Writes then hang to the 5 s bound. That is the honest wedge.","text":"Partition isolates node 1 from its peers but not from the client. Writes then hang to the 5 s bound. That is the honest wedge.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Choose what Paxos leader_kill measures, and wire it to match. Option A: on a connection error, the driver moves to the next endpoint. Then a follower forwards to the dead leader, and you measure F26&#x27;s wedge. Option B: keep it, and call the result &quot;client lost its only server&quot;, not a protocol property.","text":"Choose what Paxos leader_kill measures, and wire it to match. Option A: on a connection error, the driver moves to the next endpoint. Then a follower forwards to the dead leader, and you measure F26's wedge. Option B: keep it, and call the result \"client lost its only server\", not a protocol property.","children":[]},{"html":"Cut the trials. Thirty wedges from one deterministic cause cost about 5 h and add nothing. Five are enough to show it.","text":"Cut the trials. Thirty wedges from one deterministic cause cost about 5 h and add nothing. Five are enough to show it.","children":[]},{"html":"Write down the durability gap now: Paxi acknowledges from memory, etcd after fsync.","text":"Write down the durability gap now: Paxi acknowledges from memory, etcd after fsync.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"Baseline: Paxos p50 below etcd&#x27;s, because there is no fsync on the commit path. Throughput is capped by the leader&#x27;s 2 vCPUs.","text":"Baseline: Paxos p50 below etcd's, because there is no fsync on the commit path. Throughput is capped by the leader's 2 vCPUs.","children":[]},{"html":"leader_kill, as wired: zero commits after the kill, failover_ms null, error rate near 50%.","text":"leader_kill, as wired: zero commits after the kill, failover_ms null, error rate near 50%.","children":[]},{"html":"Partition: same zero, but each failure takes 5 s.","text":"Partition: same zero, but each failure takes 5 s.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"One row: &quot;Paxi 6823d0b, Multi-Paxos, in-memory, reply after execution, no failure detector; the client pins the leader&quot;. The wedge is an implementation property, as methodology §7 already says. Name the client policy beside it.","text":"One row: \"Paxi 6823d0b, Multi-Paxos, in-memory, reply after execution, no failure detector; the client pins the leader\". The wedge is an implementation property, as methodology §7 already says. Name the client policy beside it."}]}]},{"h2":"Phase B · Step B3 — ZooKeeper, KRaft and the Kafka write path (about 2.5 h)","step":"B3","title":"ZooKeeper, KRaft and the Kafka write path","hours":"about 2.5 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The code measures what Phase A Step 3 predicts: an ISR write path, with consensus only behind failover. Two things need fixing first. The repo calls Kafka fsync-backed, which it is not. And the KRaft scalability cells do not grow the quorum that writes wait for.","text":"The code measures what Phase A Step 3 predicts: an ISR write path, with consensus only behind failover. Two things need fixing first. The repo calls Kafka fsync-backed, which it is not. And the KRaft scalability cells do not grow the quorum that writes wait for."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Versions","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/LocalDockerProvider.java#L45-L59\" target=\"_blank\" rel=\"noopener noreferrer\">LocalDockerProvider.java L45-L59<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/pom.xml#L33-L34\" target=\"_blank\" rel=\"noopener noreferrer\">pom.xml L33-L34<\/a>","apache/kafka 3.9.1 for both modes; zookeeper 3.9; kafka-clients 3.9.1"],["KRaft quorum","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L281-L322\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L281-L322<\/a>","Every node is broker plus controller, and every node is a voter"],["ZooKeeper mode","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L355-L411\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L355-L411<\/a>","ZK beside each broker; a minimal <code>server.properties<\/code>; the same image as KRaft"],["The write path","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L61\" target=\"_blank\" rel=\"noopener noreferrer\">KafkaDriver.java L61<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L95-L97\" target=\"_blank\" rel=\"noopener noreferrer\">L95-L97<\/a>","6 partitions, RF = min(3, N), <code>min.insync.replicas=2<\/code> when RF is 3"],["&quot;Done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L109-L117\" target=\"_blank\" rel=\"noopener noreferrer\">KafkaDriver.java L109-L117<\/a>","<code>acks=all<\/code>: every current ISR member has the record. Delivery timeout 5 s"],["Flush","not set anywhere","Broker defaults: no fsync per write (<code>log.flush.interval.messages<\/code> is Long.MAX_VALUE); the record is in page cache on 2–3 machines"],["Which leader","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/KafkaDriver.java#L133-L145\" target=\"_blank\" rel=\"noopener noreferrer\">KafkaDriver.java L133-L145<\/a>","The leader of partition 0 only. The code&#x27;s own note says so (L51-L54)"],["Failure detection","not set anywhere","Defaults: KRaft <code>broker.session.timeout.ms<\/code> 9,000; ZK <code>zookeeper.session.timeout.ms<\/code> 18,000 (checked in the config values that the pinned apache/kafka 3.9.1 image logs at start, 20 Nov)"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Durability. <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/PROJECT_STATE.md?plain=1#L645-L646\" target=\"_blank\" rel=\"noopener noreferrer\">PROJECT_STATE.md L645-L646<\/a> says &quot;fsync-backed Kafka/etcd&quot;. No <code>log.flush.*<\/code> setting exists in either recipe. etcd fsyncs; Kafka does not.","text":"Durability. PROJECT_STATE.md L645-L646 says \"fsync-backed Kafka/etcd\". No log.flush.* setting exists in either recipe. etcd fsyncs; Kafka does not.","children":[]},{"html":"Which leader dies. leader_kill kills the broker that leads partition 0. The active controller may sit on another node, so controller failover happens in about one run in three.","text":"Which leader dies. leader_kill kills the broker that leads partition 0. The active controller may sit on another node, so controller failover happens in about one run in three.","children":[]},{"html":"Why every partition stalls. With RF 3 on 3 brokers, the dead broker is in every partition&#x27;s ISR. <code>acks=all<\/code> waits on it until the controller drops it, after the session timeout. So all six partitions stall, not just the two it leads.","text":"Why every partition stalls. With RF 3 on 3 brokers, the dead broker is in every partition's ISR. acks=all waits on it until the controller drops it, after the session timeout. So all six partitions stall, not just the two it leads.","children":[]},{"html":"Scalability. At 5 and 7 nodes, RF stays 3 (KafkaDriver L95) and internal topics too (RemoteSshProvider L288-L289). Only the metadata quorum grows; each write still waits for 2 of 3 replicas.","text":"Scalability. At 5 and 7 nodes, RF stays 3 (KafkaDriver L95) and internal topics too (RemoteSshProvider L288-L289). Only the metadata quorum grows; each write still waits for 2 of 3 replicas.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Fix the durability sentence in PROJECT_STATE §7. Decide: leave Kafka at defaults and say so, or set <code>flush.messages=1<\/code> on the topic to match etcd. Defaults are the honest &quot;as shipped&quot; choice.","text":"Fix the durability sentence in PROJECT_STATE §7. Decide: leave Kafka at defaults and say so, or set flush.messages=1 on the topic to match etcd. Defaults are the honest \"as shipped\" choice.","children":[]},{"html":"Equalize failure detection for F6, or label it. Default KRaft vs ZK compares 9 s vs 18 s timeouts, which is configuration, not Raft vs ZAB. Setting <code>zookeeper.session.timeout.ms=9000<\/code> isolates the machinery.","text":"Equalize failure detection for F6, or label it. Default KRaft vs ZK compares 9 s vs 18 s timeouts, which is configuration, not Raft vs ZAB. Setting zookeeper.session.timeout.ms=9000 isolates the machinery.","children":[]},{"html":"KRaft at sizes 5 and 7: set RF = N and <code>min.insync.replicas<\/code> = majority, or drop KRaft from the scalability claim. As wired, it cannot test &quot;quorum grows&quot;.","text":"KRaft at sizes 5 and 7: set RF = N and min.insync.replicas = majority, or drop KRaft from the scalability claim. As wired, it cannot test \"quorum grows\".","children":[]},{"html":"Log the active controller (<code>kafka-metadata-quorum.sh describe --status<\/code>) at injection time, so each trial says whether the controller died too.","text":"Log the active controller (kafka-metadata-quorum.sh describe --status) at injection time, so each trial says whether the controller died too.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"Baseline: KRaft and ZK within noise of each other; same binaries, same data path.","text":"Baseline: KRaft and ZK within noise of each other; same binaries, same data path.","children":[]},{"html":"leader_kill: failover_ms near the session timeout — about 9 s for KRaft, about 18 s for ZK at defaults. Writes issued in the gap expire at 5 s and count as errors.","text":"leader_kill: failover_ms near the session timeout — about 9 s for KRaft, about 18 s for ZK at defaults. Writes issued in the gap expire at 5 s and count as errors.","children":[]},{"html":"If you equalize the timeouts, the two failover distributions should overlap.","text":"If you equalize the timeouts, the two failover distributions should overlap.","children":[]}]}]},{"h3":"Thesis output","blocks":[{"t":"p","html":"The Kafka section states three facts in one table: the data path is ISR replication; the consensus layer only detects failure and picks a leader; durability is page cache plus replication, not fsync. Figure F6 must name the session timeouts in its caption.","text":"The Kafka section states three facts in one table: the data path is ISR replication; the consensus layer only detects failure and picks a leader; durability is page cache plus replication, not fsync. Figure F6 must name the session timeouts in its caption."}]}]},{"h2":"Phase B · Step B4 — EPaxos in Paxi (about 2 h)","step":"B4","title":"EPaxos in Paxi","hours":"about 2 h","parts":[{"h3":null,"blocks":[{"t":"p","html":"The conflict knob sets the share of writes to one hot key. It does not set EPaxos&#x27;s real conflict rate, which also grows with the number of writes in flight. And leader_kill on a leaderless protocol produces a failover number that means nothing.","text":"The conflict knob sets the share of writes to one hot key. It does not set EPaxos's real conflict rate, which also grows with the number of writes in flight. And leader_kill on a leaderless protocol produces a failover number that means nothing."}]},{"h3":"Where it lives","blocks":[{"t":"table","head":["Phase A idea","Code on main","What the code does"],"rows":[["Same binary as Paxos","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/topology/RemoteSshProvider.java#L204-L221\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteSshProvider.java L206<\/a>","<code>-algorithm epaxos<\/code>, same config"],["One leader per command","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L80-L82\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L80-L82<\/a>","Round-robin over all 3 replicas, so each replica leads a third of the writes"],["Key distribution","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L224-L230\" target=\"_blank\" rel=\"noopener noreferrer\">WorkloadEngine.java L224-L230<\/a>","Share c goes to key 0; the rest is uniform over keys 1–999"],["Payload","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/WorkloadEngine.java#L96\" target=\"_blank\" rel=\"noopener noreferrer\">WorkloadEngine.java L96<\/a>, <a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/MatrixRunner.java#L63-L69\" target=\"_blank\" rel=\"noopener noreferrer\">MatrixRunner.java L63-L69<\/a>","1,024 zero bytes; window 200"],["&quot;Done&quot;","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/driver/PaxiDriver.java#L29-L34\" target=\"_blank\" rel=\"noopener noreferrer\">PaxiDriver.java L29-L34<\/a>","HTTP 200 after execution: <code>-ReplyWhenCommit<\/code> defaults to false and the recipe does not set it (<a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L12\" target=\"_blank\" rel=\"noopener noreferrer\">epaxos/replica.go L12<\/a>)"],["leader_kill target","<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/campaign/RemoteRunner.java#L198-L201\" target=\"_blank\" rel=\"noopener noreferrer\">RemoteRunner.java L198-L201<\/a>","Replica 0, always"]]}]},{"h3":"What to check","blocks":[{"t":"ol","items":[{"html":"Conflicts at c = 0. Two writes interfere when they touch the same key while both are in flight. With 200 writes in flight over 999 keys, a write shares its key with another in-flight write about 18% of the time (1 − e^(−199/999)). So c = 0 is conflict-free only at low load. In Paxi the fast path also needs every dependency to be committed already (<a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L208-L221\" target=\"_blank\" rel=\"noopener noreferrer\">epaxos/replica.go L208-L221<\/a>), so an overlapping write takes the slow path even when the replicas agree.","text":"Conflicts at c = 0. Two writes interfere when they touch the same key while both are in flight. With 200 writes in flight over 999 keys, a write shares its key with another in-flight write about 18% of the time (1 − e^(−199/999)). So c = 0 is conflict-free only at low load. In Paxi the fast path also needs every dependency to be committed already (epaxos/replica.go L208-L221), so an overlapping write takes the slow path even when the replicas agree.","children":[]},{"html":"Commit vs execute. Checked at Paxi 6823d0b: EPaxos replies after execution (table above). Execution walks each replica&#x27;s log in slot order and never reads the dependencies (<a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L356-L384\" target=\"_blank\" rel=\"noopener noreferrer\">epaxos/replica.go L356-L384<\/a>). So latency includes waiting for earlier slots in the same replica&#x27;s log, not for dependencies.","text":"Commit vs execute. Checked at Paxi 6823d0b: EPaxos replies after execution (table above). Execution walks each replica's log in slot order and never reads the dependencies (epaxos/replica.go L356-L384). So latency includes waiting for earlier slots in the same replica's log, not for dependencies.","children":[]},{"html":"Recovery. Checked: Paxi&#x27;s EPaxos has none. It registers handlers only for requests, PreAccept, Accept and Commit, with no Prepare and no timer (<a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L49-L54\" target=\"_blank\" rel=\"noopener noreferrer\">epaxos/replica.go L49-L54<\/a>). A dead replica&#x27;s unfinished commands never finish. Because execution ignores dependencies, they do not hold up the other replicas&#x27; commands. But they keep replica 0&#x27;s commit counter below them for good, so later writes to the keys replica 0 was writing when it died take the slow path every time (<a href=\"https://github.com/ailidani/paxi/blob/6823d0b/epaxos/replica.go#L213-L214\" target=\"_blank\" rel=\"noopener noreferrer\">L213-L214<\/a>), including key 0 when c &gt; 0.","text":"Recovery. Checked: Paxi's EPaxos has none. It registers handlers only for requests, PreAccept, Accept and Commit, with no Prepare and no timer (epaxos/replica.go L49-L54). A dead replica's unfinished commands never finish. Because execution ignores dependencies, they do not hold up the other replicas' commands. But they keep replica 0's commit counter below them for good, so later writes to the keys replica 0 was writing when it died take the slow path every time (L213-L214), including key 0 when c > 0.","children":[]},{"html":"The failover number. After replica 0 dies, replicas 1 and 2 keep committing, so &quot;first commit after the kill&quot; arrives within milliseconds (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/harness/src/main/java/gr/thesis/bench/core/EventLog.java#L101-L112\" target=\"_blank\" rel=\"noopener noreferrer\">EventLog.java L101-L112<\/a>). Meanwhile a third of all writes fail fast at the dead endpoint.","text":"The failover number. After replica 0 dies, replicas 1 and 2 keep committing, so \"first commit after the kill\" arrives within milliseconds (EventLog.java L101-L112). Meanwhile a third of all writes fail fast at the dead endpoint.","children":[]}]}]},{"h3":"What to change","blocks":[{"t":"ol","items":[{"html":"Report the realized overlap with each run. Little&#x27;s law gives the mean in-flight count L = throughput × mean latency; the overlap share is about c + (1 − c)(1 − e^(−L/999)). analyse.py can compute this from files it already reads.","text":"Report the realized overlap with each run. Little's law gives the mean in-flight count L = throughput × mean latency; the overlap share is about c + (1 − c)(1 − e^(−L/999)). analyse.py can compute this from files it already reads.","children":[]},{"html":"Run the conflict sweep at one fixed sub-saturation rate as well as at saturation, so concurrency is held still while c varies.","text":"Run the conflict sweep at one fixed sub-saturation rate as well as at saturation, so concurrency is held still while c varies.","children":[]},{"html":"Rename EPaxos leader_kill to replica_kill in the thesis. Report error share and the survivors&#x27; p99, not failover_ms.","text":"Rename EPaxos leader_kill to replica_kill in the thesis. Report error share and the survivors' p99, not failover_ms.","children":[]},{"html":"Write the two implementation facts above (no recovery, execution without dependency order) into the prediction and the thesis, as implementation properties.","text":"Write the two implementation facts above (no recovery, execution without dependency order) into the prediction and the thesis, as implementation properties.","children":[]}]}]},{"h3":"Prediction to write down","blocks":[{"t":"ol","items":[{"html":"c = 0, low rate: EPaxos p50 ≈ Paxos p50. At n = 3 the fast quorum is 2, the same size as a majority.","text":"c = 0, low rate: EPaxos p50 ≈ Paxos p50. At n = 3 the fast quorum is 2, the same size as a majority.","children":[]},{"html":"c = 0, saturation: EPaxos throughput above Paxos, because three leaders share the CPU work. Expect a smaller gain than the 2013 paper; Tollman et al. (2021) found the same. This differs from the repo&#x27;s own registration, which expects the same throughput class at c = 0 (<a href=\"https://github.com/pdampanis/consensus-bench-framework/blob/121cf05/docs/OBSERVABILITY_AND_EXPECTATIONS.md?plain=1#L112-L115\" target=\"_blank\" rel=\"noopener noreferrer\">OBSERVABILITY_AND_EXPECTATIONS.md L113<\/a>); commit one of the two, with the reason.","text":"c = 0, saturation: EPaxos throughput above Paxos, because three leaders share the CPU work. Expect a smaller gain than the 2013 paper; Tollman et al. (2021) found the same. This differs from the repo's own registration, which expects the same throughput class at c = 0 (OBSERVABILITY_AND_EXPECTATIONS.md L113); commit one of the two, with the reason.","children":[]},{"html":"c = 2% → 10%: EPaxos p99 rises (slow path: one extra round trip); Paxos barely moves.","text":"c = 2% → 10%: EPaxos p99 rises (slow path: one extra round trip); Paxos barely moves.","children":[]},{"html":"replica_kill: about 33% errors after the kill. No growing stall on key 0: there is no recovery, but execution does not wait on dependencies either. Expect those keys, key 0 among them when c &gt; 0, to stay on the slow
