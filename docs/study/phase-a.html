ture notes (PDF)","step":0,"section":"Read (about 2.5 h)","item":"Kleppmann's lecture notes (PDF), pp. 12–23 (models of distributed systems) and pp. 51–60 (quorums, replication using broadcast, introduction to consensus). They follow the videos one to one."},{"href":"https://decentralizedthoughts.github.io/2019-06-01-2019-5-31-models","text":"Synchrony, Asynchrony and Partial synchrony","step":0,"section":"Read (about 2.5 h)","item":"Decentralized Thoughts, Synchrony, Asynchrony and Partial synchrony (short), then the one-page Consensus cheat sheet: which bounds hold in which model."},{"href":"https://decentralizedthoughts.github.io/2021-10-29-consensus-cheat-sheet","text":"Consensus cheat sheet","step":0,"section":"Read (about 2.5 h)","item":"Decentralized Thoughts, Synchrony, Asynchrony and Partial synchrony (short), then the one-page Consensus cheat sheet: which bounds hold in which model."},{"href":"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB","text":"playlist","step":1,"section":"Watch (about 1.5 h)","item":"Kleppmann, lecture 6.2 Raft in the playlist, as a quick refresher with pseudocode."},{"href":"http://nil.csail.mit.edu/6.824/2020/video/7.html","text":"Lecture 7: Fault Tolerance: Raft (2)","step":1,"section":"Watch (about 1.5 h)","item":"MIT 6.824 (2020), Robert Morris, Lecture 7: Fault Tolerance: Raft (2). It covers the subtle cases: log repair, Figure 8, persistence and snapshots. Optional: Lecture 6: Raft (1) if you want the basics again from a different teacher."},{"href":"http://nil.csail.mit.edu/6.824/2020/video/6.html","text":"Lecture 6: Raft (1)","step":1,"section":"Watch (about 1.5 h)","item":"MIT 6.824 (2020), Robert Morris, Lecture 7: Fault Tolerance: Raft (2). It covers the subtle cases: log repair, Figure 8, persistence and snapshots. Optional: Lecture 6: Raft (1) if you want the basics again from a different teacher."},{"href":"http://thesecretlivesofdata.com/raft/","text":"The Secret Lives of Data: Raft","step":1,"section":"Play with it (about 30 min)","item":"The Secret Lives of Data: Raft: a guided animation you advance yourself. Gentle; start here if any part of Raft feels shaky."},{"href":"https://raft.github.io/","text":"RaftScope","step":1,"section":"Play with it (about 30 min)","item":"RaftScope, on the official Raft site: five live servers. You can pause it, change its speed, stop, restart or time out a server, and send client requests. Try this: stop the leader and watch the election; then stop two of five servers and watch progress stop. It cannot simulate network partitions."},{"href":"https://yoichiozaki.github.io/en/blog/consensus-algorithms","text":"this page","step":1,"section":"Play with it (about 30 min)","item":"For partitions, step through the \"Network Partition\" scenario of the Raft simulator on this page (a personal blog; fixed scenarios, one step at a time)."},{"href":"https://pdos.csail.mit.edu/6.824/papers/raft-extended.pdf","text":"In Search of an Understandable Consensus Algorithm (Extended Version)","step":1,"section":"Read (about 2 h)","item":"Ongaro and Ousterhout, In Search of an Understandable Consensus Algorithm (Extended Version). Read §5.4 Safety closely, including Figure 8. Keep Figure 2 beside you as the reference card. Then §8 Client interaction and §9.3, which measures how election timeouts affect election time. Skip §6 (membership changes) and §7 (log compaction) for now."},{"href":"https://decentralizedthoughts.github.io/2020-12-12-raft-liveness-full-omission/","text":"Raft does not Guarantee Liveness in the face of Network Faults","step":1,"section":"Read (about 2 h)","item":"Howard and Abraham, Raft does not Guarantee Liveness in the face of Network Faults (Decentralized Thoughts, 2020). Short, and directly about your partition scenario: why plain Raft, and even Raft with PreVote, can fail to keep a stable leader, and how CheckQuorum fixes it."},{"href":"https://github.com/ongardie/dissertation","text":"Consensus: Bridging Theory and Practice","step":1,"section":"Read (about 2 h)","item":"Optional: Ongaro's PhD dissertation, Consensus: Bridging Theory and Practice (Stanford, 2014). Chapter 6 for linearizable reads, and the Pre-Vote discussion in Chapter 9."},{"href":"https://www.youtube.com/watch?v=JEpsBg0AO6o","text":"Paxos lecture (Raft user study)","step":2,"section":"Watch (about 1 h)","item":"John Ousterhout, Paxos lecture (Raft user study). Basic Paxos, then Multi-Paxos, made for the user study that compared Raft and Paxos. Ousterhout also taught that study's Raft lecture (in References), so the two line up."},{"href":"https://muratdem.github.io/BeatPaxos/","text":"Beat Paxos","step":2,"section":"Play with it (about 20 min)","item":"Murat Demirbas, Beat Paxos (2026): single-decree Paxos on 3 nodes. Double-click a node to kill or recover it; click and hold to slow its replies. Try to get two different values chosen. You can't, and that is the lesson: Paxos stays safe, only progress suffers. It has no pause button."},{"href":"https://yoichiozaki.github.io/en/blog/consensus-algorithms","text":"this page","step":2,"section":"Play with it (about 20 min)","item":"The Paxos simulator on this page steps through prepare, promise and accept. Its \"Proposer Conflict\" scenario shows the livelock from point 6."},{"href":"https://sandeepkv93.github.io/distributed-systems-visualizer/consensus-variants/","text":"Consensus Variants visualizer","step":2,"section":"Play with it (about 20 min)","item":"For Multi-Paxos, the Consensus Variants visualizer has a \"Multi-Paxos Leader\" scenario, with speed control and reset but no pause or failures. It is a personal project, so check what it shows against the papers."},{"href":"https://arxiv.org/abs/2004.05074","text":"Paxos vs Raft: Have we reached consensus on distributed consensus?","step":2,"section":"Read (about 2.5 h)","item":"Heidi Howard and Richard Mortier, Paxos vs Raft: Have we reached consensus on distributed consensus? (PaPoC 2020). Read this first: it describes Paxos in Raft's vocabulary and lists the differences. It will be a key citation in your comparison chapter."},{"href":"http://css.csail.mit.edu/6.824/2014/papers/paxos-simple.pdf","text":"Paxos Made Simple","step":2,"section":"Read (about 2.5 h)","item":"Leslie Lamport, Paxos Made Simple (2001). Sections 1–2 (single-decree Paxos) closely. Section 3 (implementing a state machine) is Multi-Paxos; skim it."},{"href":"https://decentralizedthoughts.github.io/2022-11-04-paxos-via-recoverable-broadcast","text":"Paxos from Recoverable Broadcast","step":2,"section":"Read (about 2.5 h)","item":"Optional, but it pays off in Step 5: Decentralized Thoughts, Paxos from Recoverable Broadcast. It splits Paxos into building blocks that the same blog later reuses for PBFT and HotStuff."},{"href":"https://developer.confluent.io/courses/architecture/","text":"course","step":3,"section":"Watch (about 1 h)","item":"Jun Rao (Confluent), Apache Kafka Internal Architecture course: the modules Data Plane: Replication Protocol (12 min) and The Apache Kafka Control Plane: ZooKeeper vs. KRaft. Taught by one of Kafka's creators."},{"href":"https://developer.confluent.io/courses/architecture/data-replication","text":"Data Plane: Replication Protocol","step":3,"section":"Watch (about 1 h)","item":"Jun Rao (Confluent), Apache Kafka Internal Architecture course: the modules Data Plane: Replication Protocol (12 min) and The Apache Kafka Control Plane: ZooKeeper vs. KRaft. Taught by one of Kafka's creators."},{"href":"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB","text":"Lecture 8: Zookeeper","step":3,"section":"Watch (about 1 h)","item":"Optional: MIT 6.824 (2020), Lecture 8: Zookeeper (in the course playlist). Good on ZooKeeper's consistency model: linearizable writes, but reads that may be stale."},{"href":"https://cwiki.apache.org/confluence/display/KAFKA/KIP-595%3A+A+Raft+Protocol+for+the+Metadata+Quorum","text":"KIP-595: A Raft Protocol for the Metadata Quorum","step":3,"section":"Read (about 1 h)","item":"KIP-595: A Raft Protocol for the Metadata Quorum. Read the motivation and the list of gaps between Kafka's replication protocol and Raft. This is your primary source for KRaft."},{"href":"https://docs.confluent.io/kafka/design/replication.html","text":"Kafka Replication and Committed Messages","step":3,"section":"Read (about 1 h)","item":"Confluent documentation, Kafka Replication and Committed Messages: ISR versus majority voting, in a few paragraphs."},{"href":"https://blog.acolyer.org/2015/03/09/zab-high-performance-broadcast-for-primary-backup-systems/","text":"summary of the Zab paper","step":3,"section":"Read (about 1 h)","item":"Adrian Colyer's summary of the Zab paper. Cite the original: Junqueira, Reed and Serafini, \"Zab: High-performance broadcast for primary-backup systems\" (DSN 2011)."},{"href":"https://arxiv.org/abs/1309.5671","text":"Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab","step":3,"section":"Read (about 1 h)","item":"Optional, valuable for your comparison chapter: van Renesse, Schiper and Schneider, Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab (IEEE TDSC, 2015). It shows exactly where these protocols differ, including active versus passive replication."},{"href":"https://www.usenix.org/conference/nsdi21/presentation/tollman","text":"EPaxos Revisited","step":4,"section":"Watch (about 25 min)","item":"Sarah Tollman, EPaxos Revisited (NSDI 2021). The talk video is on the USENIX page. It re-explains EPaxos briefly, then shows how the measurement method changed the conclusions. Note how it does this: it is a model for your own methodology chapter."},{"href":"https://sandeepkv93.github.io/distributed-systems-visualizer/consensus-variants/","text":"Consensus Variants visualizer","step":4,"section":"Play with it (about 10 min)","item":"The Consensus Variants visualizer has an \"EPaxos Fast Path\" scenario, with speed and reset controls. It shows only the fast path: no conflicts, slow path or failures. I found nothing better for EPaxos, so use the paper's figures for the slow path and execution."},{"href":"https://www.cs.princeton.edu/courses/archive/spr25/cos418/papers/epaxos.pdf","text":"There Is More Consensus in Egalitarian Parliaments","step":4,"section":"Read (about 3 h)","item":"Moraru, Andersen and Kaminsky, There Is More Consensus in Egalitarian Parliaments (SOSP 2013). Read the introduction, the protocol description (commit, execution and recovery) and look at the evaluation's setup. Skip the proofs."},{"href":"https://www.usenix.org/conference/nsdi21/presentation/tollman","text":"same USENIX page","step":4,"section":"Read (about 3 h)","item":"Tollman, Park and Ousterhout, EPaxos Revisited (NSDI 2021), from the same USENIX page. Read the sections on the original benchmarking method and its flaws. You will cite them in your methodology chapter."},{"href":"https://muratbuffalo.blogspot.com/2019/07/dissecting-performance-bottlenecks-of.html","text":"summary of the Paxi paper","step":4,"section":"Read (about 3 h)","item":"Optional: Murat Demirbas's summary of the Paxi paper, which covers EPaxos and conflicts. The paper itself comes back in Step 8."},{"href":"https://timroughgarden.org/f21/l6.pdf","text":"lecture notes (PDF)","step":5,"section":"Watch (about 1.25 h)","item":"Tim Roughgarden, Foundations of Blockchains (Columbia, 2021), lectures 6.1 The Partially Synchronous Model (41 min) and 6.2 Proof of the 33% Impossibility Result (16 min). Find them on YouTube by those exact titles. The matching lecture notes (PDF) are a clean, citable write-up."},{"href":"https://web.eecs.umich.edu/~manosk/assets/slides/f21/eecs591-lecture13-slides.pdf","text":"lecture slides (University of Michigan)","step":5,"section":"Watch (about 1.25 h)","item":"For PBFT itself, page through Manos Kapritsos's lecture slides (University of Michigan). They animate the message flow step by step."},{"href":"https://dsys2-iiith.vlabs.ac.in/exp/byzantine-failures-scenario/simulation/index.html","text":"Byzantine Failures Simulation","step":5,"section":"Play with it (about 20 min)","item":"IIIT Hyderabad Virtual Labs, Byzantine Failures Simulation, which simulates PBFT. Choose 4–12 nodes and how many are Byzantine (it keeps f < n/3). Run it step by step or automatically, at 0.5× to 3× speed; step mode is how you pause. Try 4 nodes with 1 Byzantine, and count the prepare and commit messages."},{"href":"https://yoichiozaki.github.io/en/blog/consensus-algorithms","text":"this page","step":5,"section":"Play with it (about 20 min)","item":"The PBFT simulator on this page has a \"Too Many Byzantine Nodes\" scenario that shows the 3f+1 bound failing."},{"href":"https://pmg.csail.mit.edu/papers/osdi99.pdf","text":"Practical Byzantine Fault Tolerance","step":5,"section":"Read (about 3 h)","item":"Castro and Liskov, Practical Byzantine Fault Tolerance (OSDI 1999). Read §2–§4: system model, service properties, the algorithm (normal case, garbage collection, view change). Skim §5 (optimizations). Skip the implementation sections."},{"href":"https://decentralizedthoughts.github.io/2025-02-14-PBFT","text":"PBFT","step":5,"section":"Read (about 3 h)","item":"Decentralized Thoughts, PBFT (2025). A modern presentation built on certificates. It sets up Steps 6 and 7."},{"href":"https://dominoweb.draco.res.ibm.com/reports/rz3754.pdf","text":"Yet Another Visit to Paxos","step":5,"section":"Read (about 3 h)","item":"Optional, the bridge: Christian Cachin, Yet Another Visit to Paxos (IBM Research report, 2009, 20 pages), or the Byzantine consensus sections of Chapter 5 of the Cachin, Guerraoui and Rodrigues book, which present the same idea."},{"href":"https://timroughgarden.github.io/fob21/slides/F21L7.pdf","text":"Slides (PDF)","step":6,"section":"Watch (about 1 h)","item":"Tim Roughgarden, Foundations of Blockchains, lectures 7.1 Tendermint (High-Level Ideas) (19 min) and 7.2 The Tendermint Protocol (40 min); find them on YouTube by those titles. Slides (PDF). Optional: 7.3 Proof of Consistency and 7.4 Proof of Liveness."},{"href":"https://github.com/kevlubkcm/tenderflow","text":"tenderflow","step":6,"section":"Play with it","item":"I found no hosted interactive Tendermint simulator. tenderflow is a Tendermint visualizer that you would have to build locally; I have not tried it. Roughgarden's lecture 7.2 slides (above) step through rounds and locks, and are the better use of your time."},{"href":"https://arxiv.org/abs/1807.04938","text":"The latest gossip on BFT consensus","step":6,"section":"Read (about 1.5 h)","item":"Buchman, Kwon and Milosevic, The latest gossip on BFT consensus (2018). This is the current Tendermint algorithm. Its pseudocode fits on one page; read it slowly, alongside the text that explains it."},{"href":"https://docs.cosmos.network/cometbft/next/spec/consensus/Byzantine-Consensus-Algorithm","text":"Byzantine Consensus Algorithm","step":6,"section":"Read (about 1.5 h)","item":"CometBFT specification, Byzantine Consensus Algorithm: the same algorithm as implemented, with the exact step and timeout rules."},{"href":"https://decentralizedthoughts.github.io/2019-06-23-what-is-the-difference-between","text":"What is the difference between PBFT, Tendermint, SBFT and HotStuff?","step":6,"section":"Read (about 1.5 h)","item":"Decentralized Thoughts, What is the difference between PBFT, Tendermint, SBFT and HotStuff? (2019). Short, with a comparison table of latency, communication and responsiveness. Add its columns to your own table."},{"href":"https://arxiv.org/abs/1707.01873","text":"Blockchain Consensus Protocols in the Wild","step":6,"section":"Read (about 1.5 h)","item":"Optional: Ethan Buchman's MSc thesis, Tendermint: Byzantine Fault Tolerance in the Age of Blockchains (University of Guelph, 2016), for background. Note that Cachin and Vukolić, Blockchain Consensus Protocols in the Wild (2017), found a liveness problem in that earlier version; the 2018 paper is the corrected algorithm."},{"href":"https://muratbuffalo.blogspot.com/2019/12/hotstuff-bft-consensus-in-lens-of.html","text":"post on HotStuff","step":7,"section":"Watch (about 1 h)","item":"Murat Demirbas's post on HotStuff embeds a lecture by Ittai Abraham, one of HotStuff's authors, on the hidden-lock problem and the protocol. Watch the lecture, then read the post."},{"href":"https://github.com/edgedlt/hotstuff2","text":"HotStuff-2 demo","step":7,"section":"Play with it (optional, on your laptop)","item":"HotStuff-2 demo: run go run demo/main.go and open localhost:8080. It shows nodes and messages live, lets you crash nodes and create partitions, and runs 4–16 nodes. It runs HotStuff-2, not the 2019 protocol."},{"href":"https://github.com/csienslab/BFT-Simulator","text":"BFT Simulator","step":7,"section":"Play with it (optional, on your laptop)","item":"BFT Simulator (National Taiwan University, DSN 2022): runs PBFT, HotStuff and LibraBFT, including under a network-partitioning attacker, and plots the traces. Not interactive, but good for seeing leader changes under attack."},{"href":"https://arxiv.org/abs/1803.05069","text":"HotStuff: BFT Consensus in the Lens of Blockchain","step":7,"section":"Read (about 2.5 h)","item":"Yin, Malkhi, Reiter, Golan Gueta and Abraham, HotStuff: BFT Consensus in the Lens of Blockchain (PODC 2019). Read the introduction and its comparison table, Basic HotStuff and Chained HotStuff. Then the section that casts DLS, PBFT, Tendermint and Casper in the same framework: it is ready-made structure for your BFT chapter."},{"href":"https://decentralizedthoughts.github.io/2023-04-01-hotstuff-2","text":"What is the difference between PBFT, Tendermint, HotStuff, and HotStuff-2?","step":7,"section":"Read (about 2.5 h)","item":"Decentralized Thoughts, What is the difference between PBFT, Tendermint, HotStuff, and HotStuff-2? (2023). It ties Steps 5–7 together around one question: how a new leader learns the locks."},{"href":"https://arxiv.org/abs/2106.10362","text":"Jolteon and Ditto","step":7,"section":"Read (about 2.5 h)","item":"Optional: Gelashvili et al., Jolteon and Ditto (2021), for the 2-chain variant your implementation likely uses. Malkhi and Yin, Lessons from HotStuff (2023), for the family's evolution since."},{"href":"https://arxiv.org/abs/2305.13556","text":"Lessons from HotStuff","step":7,"section":"Read (about 2.5 h)","item":"Optional: Gelashvili et al., Jolteon and Ditto (2021), for the 2-chain variant your implementation likely uses. Malkhi and Yin, Lessons from HotStuff (2023), for the family's evolution since."},{"href":"https://videog.infoq.com/downloads/pdfdownloads/presentations/QConSF2015-GilTene-HowNOTtomeasureLatency.pdf","text":"Slides from QCon San Francisco 2015 (PDF)","step":8,"section":"Watch (about 45 min)","item":"Gil Tene, How NOT to Measure Latency. Not optional: he named coordinated omission. Several recordings exist; search YouTube for the title (the Strange Loop recording runs about 43 minutes). Slides from QCon San Francisco 2015 (PDF)."},{"href":"https://cse.buffalo.edu/~demirbas/publications/dissecting.pdf","text":"Dissecting the Performance of Strongly-Consistent Replication Protocols","step":8,"section":"Read (about 2 h)","item":"Ailijiang, Charapko and Demirbas, Dissecting the Performance of Strongly-Consistent Replication Protocols (SIGMOD 2019). It introduces Paxi, the framework behind your Paxos and EPaxos. Read the analytical model and the LAN results. It is the closest prior work to your thesis: anchor your related-work chapter on it."},{"href":"http://usenix.org/events/nsdi06/tech/full_papers/schroeder/schroeder.pdf","text":"Open Versus Closed: A Cautionary Tale","step":8,"section":"Read (about 2 h)","item":"Schroeder, Wierman and Harchol-Balter, Open Versus Closed: A Cautionary Tale (NSDI 2006). Introduction and the eight principles."},{"href":"https://arxiv.org/abs/2103.00777","text":"Dissecting the Performance of Chained-BFT","step":8,"section":"Read (about 2 h)","item":"Optional, the BFT counterpart of Paxi: Gai et al., Dissecting the Performance of Chained-BFT (ICDCS 2021). It compares HotStuff, 2-chain HotStuff and Streamlet in one framework, with a queueing model."},{"href":"https://decentralizedthoughts.github.io/2019-06-23-what-is-the-difference-between","text":"Decentralized Thoughts (2019)","step":null,"section":"Comparison table","item":"The latency figures leave out the client's own round trip, disk flushes, batching and any block interval; add them when you predict real numbers. The PBFT and Tendermint figures follow Decentralized Thoughts (2019); the HotStuff figures follow the comparison table in the Jolteon paper. Kafka's data plane is deliberately missing: its write path uses ISR replication, not a consensus protocol (Step 3)."},{"href":"https://arxiv.org/abs/2106.10362","text":"Jolteon paper","step":null,"section":"Comparison table","item":"The latency figures leave out the client's own round trip, disk flushes, batching and any block interval; add them when you predict real numbers. The PBFT and Tendermint figures follow Decentralized Thoughts (2019); the HotStuff figures follow the comparison table in the Jolteon paper. Kafka's data plane is deliberately missing: its write path uses ISR replication, not a consensus protocol (Step 3)."},{"href":"https://claude.ai/artifact/HJErTpWQTYFerqRftDow4K","text":"Consensus Protocols — Thesis Study Guide, Phase B","step":null,"section":"Phase B","item":"Phase B ties each step above to the benchmark code on branch main, and lists what to change, run and analyse before February: Consensus Protocols — Thesis Study Guide, Phase B."},{"href":"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB","text":"videos","step":null,"section":"References: Lectures and courses","item":"Martin Kleppmann, Distributed Systems (Cambridge): videos, lecture notes"},{"href":"https://www.cl.cam.ac.uk/teaching/2122/ConcDisSys/dist-sys-notes.pdf","text":"lecture notes","step":null,"section":"References: Lectures and courses","item":"Martin Kleppmann, Distributed Systems (Cambridge): videos, lecture notes"},{"href":"http://nil.csail.mit.edu/6.824/2020/video/6.html","text":"Raft (1)","step":null,"section":"References: Lectures and courses","item":"MIT 6.824 (2020), Robert Morris: Raft (1), Raft (2), YouTube playlist"},{"href":"http://nil.csail.mit.edu/6.824/2020/video/7.html","text":"Raft (2)","step":null,"section":"References: Lectures and courses","item":"MIT 6.824 (2020), Robert Morris: Raft (1), Raft (2), YouTube playlist"},{"href":"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB","text":"YouTube playlist","step":null,"section":"References: Lectures and courses","item":"MIT 6.824 (2020), Robert Morris: Raft (1), Raft (2), YouTube playlist"},{"href":"https://www.youtube.com/watch?v=YbZ3zDzDnrw","text":"Raft lecture","step":null,"section":"References: Lectures and courses","item":"John Ousterhout, Raft lecture and Paxos lecture (Raft user study)"},{"href":"https://www.youtube.com/watch?v=JEpsBg0AO6o","text":"Paxos lecture","step":null,"section":"References: Lectures and courses","item":"John Ousterhout, Raft lecture and Paxos lecture (Raft user study)"},{"href":"https://timroughgarden.org/f21/l6.pdf","text":"Lecture 6 notes","step":null,"section":"References: Lectures and courses","item":"Tim Roughgarden, Foundations of Blockchains (Columbia, 2021): Lecture 6 notes, Lecture 7 slides; videos on YouTube by title"},{"href":"https://timroughgarden.github.io/fob21/slides/F21L7.pdf","text":"Lecture 7 slides","step":null,"section":"References: Lectures and courses","item":"Tim Roughgarden, Foundations of Blockchains (Columbia, 2021): Lecture 6 notes, Lecture 7 slides; videos on YouTube by title"},{"href":"https://developer.confluent.io/courses/architecture/","text":"Apache Kafka Internal Architecture","step":null,"section":"References: Lectures and courses","item":"Jun Rao, Apache Kafka Internal Architecture (Confluent)"},{"href":"https://www.usenix.org/conference/nsdi21/presentation/tollman","text":"EPaxos Revisited talk","step":null,"section":"References: Lectures and courses","item":"Sarah Tollman, EPaxos Revisited talk (NSDI 2021)"},{"href":"https://videog.infoq.com/downloads/pdfdownloads/presentations/QConSF2015-GilTene-HowNOTtomeasureLatency.pdf","text":"slides","step":null,"section":"References: Lectures and courses","item":"Gil Tene, How NOT to Measure Latency: slides; video on YouTube by title"},{"href":"https://web.eecs.umich.edu/~manosk/assets/slides/f21/eecs591-lecture13-slides.pdf","text":"PBFT lecture slides","step":null,"section":"References: Lectures and courses","item":"Manos Kapritsos, PBFT lecture slides (University of Michigan)"},{"href":"http://css.csail.mit.edu/6.824/2014/papers/paxos-simple.pdf","text":"Paxos Made Simple","step":null,"section":"References: Papers","item":"Lamport, Paxos Made Simple, 2001"},{"href":"https://pdos.csail.mit.edu/6.824/papers/raft-extended.pdf","text":"In Search of an Understandable Consensus Algorithm (Extended Version)","step":null,"section":"References: Papers","item":"Ongaro, Ousterhout, In Search of an Understandable Consensus Algorithm (Extended Version), USENIX ATC 2014"},{"href":"https://github.com/ongardie/dissertation","text":"Consensus: Bridging Theory and Practice","step":null,"section":"References: Papers","item":"Ongaro, Consensus: Bridging Theory and Practice, PhD dissertation, Stanford, 2014"},{"href":"https://arxiv.org/abs/2004.05074","text":"Paxos vs Raft: Have we reached consensus on distributed consensus?","step":null,"section":"References: Papers","item":"Howard, Mortier, Paxos vs Raft: Have we reached consensus on distributed consensus?, PaPoC 2020"},{"href":"https://blog.acolyer.org/2015/03/09/zab-high-performance-broadcast-for-primary-backup-systems/","text":"summary","step":null,"section":"References: Papers","item":"Junqueira, Reed, Serafini, \"Zab: High-performance broadcast for primary-backup systems\", DSN 2011 (summary)"},{"href":"https://arxiv.org/abs/1309.5671","text":"Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab","step":null,"section":"References: Papers","item":"van Renesse, Schiper, Schneider, Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab, IEEE TDSC, 2015"},{"href":"https://cwiki.apache.org/confluence/display/KAFKA/KIP-595%3A+A+Raft+Protocol+for+the+Metadata+Quorum","text":"KIP-595: A Raft Protocol for the Metadata Quorum","step":null,"section":"References: Papers","item":"KIP-595: A Raft Protocol for the Metadata Quorum, Apache Kafka"},{"href":"https://www.cs.princeton.edu/courses/archive/spr25/cos418/papers/epaxos.pdf","text":"There Is More Consensus in Egalitarian Parliaments","step":null,"section":"References: Papers","item":"Moraru, Andersen, Kaminsky, There Is More Consensus in Egalitarian Parliaments, SOSP 2013"},{"href":"https://www.usenix.org/conference/nsdi21/presentation/tollman","text":"EPaxos Revisited","step":null,"section":"References: Papers","item":"Tollman, Park, Ousterhout, EPaxos Revisited, NSDI 2021"},{"href":"https://pmg.csail.mit.edu/papers/osdi99.pdf","text":"Practical Byzantine Fault Tolerance","step":null,"section":"References: Papers","item":"Castro, Liskov, Practical Byzantine Fault Tolerance, OSDI 1999"},{"href":"https://dominoweb.draco.res.ibm.com/reports/rz3754.pdf","text":"Yet Another Visit to Paxos","step":null,"section":"References: Papers","item":"Cachin, Yet Another Visit to Paxos, IBM Research report RZ3754, 2009"},{"href":"https://arxiv.org/abs/1807.04938","text":"The latest gossip on BFT consensus","step":null,"section":"References: Papers","item":"Buchman, Kwon, Milosevic, The latest gossip on BFT consensus, 2018"},{"href":"https://arxiv.org/abs/1707.01873","text":"Blockchain Consensus Protocols in the Wild","step":null,"section":"References: Papers","item":"Cachin, Vukolić, Blockchain Consensus Protocols in the Wild, 2017"},{"href":"https://arxiv.org/abs/1803.05069","text":"HotStuff: BFT Consensus in the Lens of Blockchain","step":null,"section":"References: Papers","item":"Yin, Malkhi, Reiter, Golan Gueta, Abraham, HotStuff: BFT Consensus in the Lens of Blockchain, PODC 2019"},{"href":"https://arxiv.org/abs/2106.10362","text":"Jolteon and Ditto","step":null,"section":"References: Papers","item":"Gelashvili et al., Jolteon and Ditto, 2021"},{"href":"https://arxiv.org/abs/2305.13556","text":"Lessons from HotStuff","step":null,"section":"References: Papers","item":"Malkhi, Yin, Lessons from HotStuff, 2023"},{"href":"https://cse.buffalo.edu/~demirbas/publications/dissecting.pdf","text":"Dissecting the Performance of Strongly-Consistent Replication Protocols","step":null,"section":"References: Papers","item":"Ailijiang, Charapko, Demirbas, Dissecting the Performance of Strongly-Consistent Replication Protocols, SIGMOD 2019"},{"href":"https://arxiv.org/abs/2103.00777","text":"Dissecting the Performance of Chained-BFT","step":null,"section":"References: Papers","item":"Gai et al., Dissecting the Performance of Chained-BFT, ICDCS 2021"},{"href":"http://usenix.org/events/nsdi06/tech/full_papers/schroeder/schroeder.pdf","text":"Open Versus Closed: A Cautionary Tale","step":null,"section":"References: Papers","item":"Schroeder, Wierman, Harchol-Balter, Open Versus Closed: A Cautionary Tale, NSDI 2006"},{"href":"https://decentralizedthoughts.github.io/2019-06-01-2019-5-31-models","text":"Synchrony, Asynchrony and Partial synchrony","step":null,"section":"References: Posts and documentation","item":"Decentralized Thoughts: Synchrony, Asynchrony and Partial synchrony, Consensus cheat sheet, Raft liveness under network faults, Paxos from Recoverable Broadcast, PBFT, PBFT, Tendermint, SBFT and HotStuff, PBFT, Tendermint, HotStuff and HotStuff-2"},{"href":"https://decentralizedthoughts.github.io/2021-10-29-consensus-cheat-sheet","text":"Consensus cheat sheet","step":null,"section":"References: Posts and documentation","item":"Decentralized Thoughts: Synchr     if (!track) return;
    track.style.width = (items.length * W + 40) + 'px';
    var html = '<div class="tl-axis"></div>';
    var lastDec = null;
    items.forEach(function (t, k) {
      var x = 20 + k * W;
      var dec = Math.floor(t.d / 10) * 10;
      if (dec !== lastDec) { html += '<div class="tl-decade" style="left:' + (x + 66) + 'px;top:248px">' + dec + 's</div>'; lastDec = dec; }
      html += '<div class="tl-item fam-' + t.fam + ' ' + (k % 2 ? 'down' : 'up') + '" style="left:' + x + 'px" data-dec="' + dec + '">' +
        '<span class="tick"></span><span class="pin"></span>' +
        '<button type="button" data-act="tl-sel" data-i="' + t.i + '" aria-pressed="' + (tlState.sel === t.i) + '"><span class="y">' + esc(t.y) + '</span><span class="l">' + esc(t.label) + '</span></button></div>';
    });
    track.innerHTML = html;
    if (!items.some(function (t) { return t.i === tlState.sel; }) && items.length) tlState.sel = items[0].i;
    drawTlDetail();
  }
  function drawTlDetail() {
    var t = TIMELINE[tlState.sel], d = document.getElementById('tl-detail');
    if (!t || !d) return;
    d.className = 'card tl-detail fam-' + t.fam;
    d.innerHTML = '<p class="eyebrow">' + esc(t.y) + ' · ' + FAMILIES[t.fam].label + '</p><h2>' + esc(t.label) + '</h2><p>' + esc(t.note) + '</p>' +
      '<div class="chips">' + (t.step != null ? '<a class="btn primary" href="#step-' + t.step + '">Open Step ' + t.step + ': ' + esc(shortTitle(t.step)) + '</a>' : '<a class="btn" href="#overview">See the time budget</a>') +
      (t.url ? '<a class="btn" href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + ICONS.ext + 'Source</a>' : '') + '</div>';
    document.querySelectorAll('#tl-track button[data-i]').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.getAttribute('data-i') === tlState.sel)); });
  }

  /* ---------- comparison table ---------- */
  var cmpState = { fam: 'all', sort: null, dir: 1, quiz: false, revealed: {} };
  var cmpTable = (C.compare.blocks.filter(function (b) { return b.t === 'table'; })[0]);
  var cmpParas = C.compare.blocks.filter(function (b) { return b.t === 'p'; });
  function cmpMeta(row) {
    var name = row[0].replace(/<[^>]+>/g, '');
    for (var i = 0; i < COMPARE_META.length; i++) if (name.indexOf(COMPARE_META[i].match) === 0) return COMPARE_META[i];
    return null;
  }
  function viewCompare() {
    var h = '<div class="view wide"><div class="step-head"><p class="eyebrow">Phase A summary</p><h1>The comparison table</h1>' +
      '<div class="prose"><p>' + (cmpParas[0] ? cmpParas[0].html : '') + '</p></div></div>';
    h += '<div class="chips" role="group" aria-label="Filter by family">' +
      [['all', 'All families'], ['crash', 'Crash, one leader'], ['lless', 'Crash, no leader'], ['byz', 'Byzantine']].map(function (f) {
        return '<button type="button" class="chip' + (f[0] !== 'all' ? ' fam-' + f[0] : '') + '" data-act="cmp-fam" data-v="' + f[0] + '" aria-pressed="' + (cmpState.fam === f[0]) + '">' +
          (f[0] !== 'all' ? '<span class="dot" data-s="done"></span>' : '') + f[1] + '</button>';
      }).join('') + '</div>';
    h += '<div class="row chips"><label class="ctl small" for="cmp-quiz" style="display:inline-flex;gap:8px;align-items:center;min-height:44px">' +
      '<input type="checkbox" id="cmp-quiz" data-act="cmp-quiz"' + (cmpState.quiz ? ' checked' : '') + ' style="width:20px;height:20px"> Quiz mode: hide the cells, tap one to reveal it</label></div>';
    h += '<div class="table-wrap"><table class="cmp-table" id="cmp-table"></table></div>';
    h += '<p class="small muted">' + (cmpState.quiz ? 'In quiz mode, open a step from the protocol name.' : 'Tap a row to open its step. Tap a column heading to sort.') + '</p>';
    h += '<div class="prose small muted">' + cmpParas.slice(1).map(function (p) { return '<p>' + p.html + '</p>'; }).join('') + '</div></div>';
    return h;
  }
  var SORTABLE = { 0: 'year', 2: 'nodes', 4: 'lat', 5: 'msgs' };
  function drawCompare() {
    var t = document.getElementById('cmp-table');
    if (!t || !cmpTable) return;
    var rows = cmpTable.rows.map(function (r, i) { return { r: r, m: cmpMeta(r), i: i }; })
      .filter(function (x) { return cmpState.fam === 'all' || (x.m && x.m.fam === cmpState.fam); });
    if (cmpState.sort != null) {
      var key = SORTABLE[cmpState.sort];
      rows.sort(function (a, b) {
        var va = key ? a.m[key] : a.r[cmpState.sort], vb = key ? b.m[key] : b.r[cmpState.sort];
        if (va < vb) return -cmpState.dir; if (va > vb) return cmpState.dir; return a.i - b.i;
      });
    }
    var head = '<thead><tr>' + cmpTable.head.map(function (hd, ci) {
      var sort = cmpState.sort === ci ? (cmpState.dir > 0 ? 'ascending' : 'descending') : 'none';
      return '<th scope="col" aria-sort="' + sort + '"><button type="button" data-act="cmp-sort" data-c="' + ci + '">' + hd + '</button></th>';
    }).join('') + '</tr></thead>';
    var body = '<tbody>' + rows.map(function (x) {
      var m = x.m || { step: 0, fam: 'found' };
      return '<tr class="fam-' + m.fam + '" data-step="' + m.step + '" tabindex="0" aria-label="' + esc(x.r[0].replace(/<[^>]+>/g, '')) + ', open step ' + m.step + '">' +
        x.r.map(function (c, ci) {
          if (ci === 0) return '<td><a href="#step-' + m.step + '">' + c + '</a><div class="small muted">Step ' + m.step + '</div></td>';
          var hidden = cmpState.quiz && !cmpState.revealed[x.i + ':' + ci];
          return '<td' + (hidden ? ' class="hidecell" data-act="cmp-reveal" data-k="' + x.i + ':' + ci + '"' : '') + '>' + c + '</td>';
        }).join('') + '</tr>';
    }).join('') + '</tbody>';
    t.innerHTML = head + body;
  }

  /* ---------- references ---------- */
  var refState = { q: '', type: 'all' };
  var GROUP_TYPE = { 'Lectures and courses': 'video', 'Book': 'paper', 'Papers': 'paper', 'Posts and documentation': 'post', 'Interactive simulators': 'sim' };
  var TYPE_LABEL = { all: 'All', video: 'Videos and lectures', paper: 'Papers and book', post: 'Posts and docs', sim: 'Simulators' };
  function hrefsIn(html) { var out = [], re = /href="([^"]+)"/g, m; while ((m = re.exec(html))) out.push(m[1].replace(/&amp;/g, '&')); return out; }
  var refModel = (function () {
    var stepsByHref = {};
    C.links.forEach(function (l) {
      if (l.step == null) return;
      (stepsByHref[l.href] = stepsByHref[l.href] || {})[l.step] = true;
    });
    var seen = {};
    var groups = C.refs.groups.map(function (g) {
      return {
        name: g.name, type: GROUP_TYPE[g.name] || 'post', items: g.items.map(function (it) {
          var hs = hrefsIn(it.html), st = {};
          hs.forEach(function (x) { seen[x] = true; Object.keys(stepsByHref[x] || {}).forEach(function (k) { st[k] = true; }); });
          return { html: it.html, text: it.text, steps: Object.keys(st).map(Number).sort(), nolink: !hs.length };
        })
      };
    });
    /* links that appear in the steps but not in the doc's References section */
    var extra = {};
    C.links.forEach(function (l) {
      if (seen[l.href] || l.step == null) return;
      var e = extra[l.href] = extra[l.href] || { href: l.href, text: l.text, steps: {}, section: l.section };
      e.steps[l.step] = true;
    });
    var ex = Object.keys(extra).map(function (k) {
      var e = extra[k];
      var type = /^Watch/.test(e.section) ? 'video' : /^Play/.test(e.section) ? 'sim' : 'paper';
      return { html: '<a href="' + esc(e.href) + '" target="_blank" rel="noopener noreferrer">' + esc(e.text) + '</a> <span class="muted small">(' + esc(e.section) + ')</span>', text: e.text + ' ' + e.section, steps: Object.keys(e.steps).map(Number), type: type };
    });
    if (ex.length) groups.push({ name: 'Also linked inside the steps', type: 'mixed', items: ex });
    return groups;
  })();
  function viewRefs() {
    var h = '<div class="view"><div class="step-head"><p class="eyebrow">References</p><h1>Every source in the guide</h1>' +
      '<p class="muted small">' + (C.refs.intro || '') + '</p></div>' +
      '<div class="searchbox"><label class="sr-only" for="ref-q">Search references</label><input id="ref-q" type="search" placeholder="Search titles, authors, venues…" value="' + esc(refState.q) + '" autocomplete="off"></div>' +
      '<div class="chips" role="group" aria-label="Filter by type">' + Object.keys(TYPE_LABEL).map(function (k) {
        return '<button type="button" class="chip" data-act="ref-type" data-v="' + k + '" aria-pressed="' + (refState.type === k) + '">' + TYPE_LABEL[k] + '</button>';
      }).join('') + '</div><p class="small muted" id="ref-count" aria-live="polite"></p><div id="ref-list" class="section"></div></div>';
    return h;
  }
  function drawRefs() {
    var list = document.getElementById('ref-list');
    if (!list) return;
    var q = refState.q.trim().toLowerCase(), count = 0;
    var html = refModel.map(function (g) {
      var items = g.items.filter(function (it) {
        var type = it.type || g.type;
        if (refState.type !== 'all' && type !== refState.type) return false;
        if (!q) return true;
        var hay = (it.text + ' ' + g.name + ' ' + it.steps.map(function (s) { return 'step ' + s + ' ' + shortTitle(s); }).join(' ')).toLowerCase();
        return q.split(/\s+/).every(function (w) { return hay.indexOf(w) >= 0; });
      });
      count += items.length;
      if (!items.length) return '';
      return '<div class="refgroup"><h2>' + esc(g.name) + '</h2>' + items.map(function (it) {
        return '<div class="refitem"><div>' + it.html + '</div><div class="meta">' +
          (it.nolink ? '<span class="badge">No link in the guide</span>' : '') +
          it.steps.map(function (s) { return '<a class="chip fam-' + famOf(s) + '" href="#step-' + s + '"><span class="dot" data-s="done"></span>Step ' + s + '</a>'; }).join('') +
          '</div></div>';
      }).join('') + '</div>';
    }).join('');
    list.innerHTML = html || '<p class="muted">No reference matches. Try fewer words.</p>';
    document.getElementById('ref-count').textContent = count + (count === 1 ? ' reference' : ' references');
  }

  /* ---------- footer ---------- */
  function footer() {
    return '<footer class="foot"><p>Built from the Phase A study guide doc, <a href="' + SITE.docUrl + '" target="_blank" rel="noopener noreferrer">' + esc(SITE.docTitle) + '</a> ' +
      '(<span class="mono">' + SITE.docUrl + '</span>). As of ' + SITE.asOf + '.</p>' +
      '<p>Phase B, from theory to the code: <a href="' + SITE.phaseBUrl + '" target="_blank" rel="noopener noreferrer">Consensus Protocols — Thesis Study Guide, Phase B</a> (<span class="mono">' + SITE.phaseBUrl + '</span>) · ' +
      '<a href="' + SITE.phaseBSiteUrl + '" target="_blank" rel="noopener noreferrer">Phase B interactive site</a>.</p></footer>';
  }

  /* ---------- router ---------- */
  var main = document.getElementById('main');
  function render() {
    var r = currentRoute(), h;
    if (r === 'overview') h = viewOverview();
    else if (r === 'steps') h = viewSteps();
    else if (r === 'timeline') h = viewTimeline();
    else if (r === 'compare') h = viewCompare();
    else if (r === 'references') h = viewRefs();
    else h = viewStep(+r.split('-')[1]);
    main.innerHTML = h + footer();
    markCurrent();
    if (r === 'timeline') drawTimeline();
    if (r === 'compare') drawCompare();
    if (r === 'references') drawRefs();
    if (r.indexOf('step-') === 0) {
      var cur = document.querySelector('.steps-strip [aria-current="page"]');
      if (cur) { var sp = cur.parentNode; sp.scrollLeft = Math.max(0, cur.offsetLeft - sp.offsetLeft - 8); }
    }
    window.scrollTo(0, 0);
  }

  /* ---------- event delegation ---------- */
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]');
    if (!b) {
      var tr = ev.target.closest('#cmp-table tbody tr');
      if (tr && !cmpState.quiz && !ev.target.closest('a')) location.hash = 'step-' + tr.getAttribute('data-step');
      return;
    }
    var act = b.getAttribute('data-act');
    if (act === 'status') {
      var n = +b.getAttribute('data-n'), v = b.getAttribute('data-v');
      setStatus(n, v);
      document.querySelectorAll('[data-act="status"][data-n="' + n + '"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x.getAttribute('data-v') === v)); });
    } else if (act === 'reset-progress') {
      if (b.getAttribute('data-confirm') === '1') { progress = {}; Store.set(PKEY, progress); refreshChrome(); render(); }
      else { b.setAttribute('data-confirm', '1'); b.textContent = 'Tap again to clear all progress'; }
    } else if (act === 'jump') {
      var t = document.getElementById(b.getAttribute('data-target'));
      if (t) t.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    } else if (act === 'toggle-ideas') {
      var ds = document.querySelectorAll('details.idea'), open = b.textContent.indexOf('Expand') === 0;
      ds.forEach(function (d) { d.open = open; });
      b.textContent = open ? 'Collapse all' : 'Expand all';
    } else if (act === 'toggle-answers') {
      var cs = document.querySelectorAll('details.check'), op = b.textContent.indexOf('Show') === 0;
      cs.forEach(function (d) { d.open = op; });
      b.textContent = op ? 'Hide all answers' : 'Show all answers';
    } else if (act === 'tl-fam') {
      tlState.fam = b.getAttribute('data-v');
      document.querySelectorAll('[data-act="tl-fam"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      drawTimeline();
    } else if (act === 'tl-sel') {
      tlState.sel = +b.getAttribute('data-i'); drawTlDetail();
    } else if (act === 'tl-jump') {
      var dec = b.getAttribute('data-v'), sc = document.getElementById('tl-scroll');
      var it = document.querySelector('#tl-track .tl-item[data-dec="' + dec + '"]');
      if (sc && it) sc.scrollTo({ left: Math.max(0, it.offsetLeft - 20), behavior: 'smooth' });
      else if (sc) { var all = document.querySelectorAll('#tl-track .tl-item'), tgt = null; all.forEach(function (x) { if (!tgt && +x.getAttribute('data-dec') >= +dec) tgt = x; }); if (tgt) sc.scrollTo({ left: tgt.offsetLeft - 20, behavior: 'smooth' }); }
    } else if (act === 'cmp-fam') {
      cmpState.fam = b.getAttribute('data-v');
      document.querySelectorAll('[data-act="cmp-fam"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      drawCompare();
    } else if (act === 'cmp-sort') {
      var c = +b.getAttribute('data-c');
      if (cmpState.sort === c) cmpState.dir = -cmpState.dir; else { cmpState.sort = c; cmpState.dir = 1; }
      drawCompare();
    } else if (act === 'cmp-reveal') {
      cmpState.revealed[b.getAttribute('data-k')] = true; drawCompare();
    } else if (act === 'ref-type') {
      refState.type = b.getAttribute('data-v');
      document.querySelectorAll('[data-act="ref-type"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      drawRefs();
    }
  });
  document.addEventListener('change', function (ev) {
    if (ev.target && ev.target.id === 'cmp-quiz') { cmpState.quiz = ev.target.checked; cmpState.revealed = {}; render(); }
  });
  document.addEventListener('input', function (ev) {
    if (ev.target && ev.target.id === 'ref-q') { refState.q = ev.target.value; drawRefs(); }
  });
  document.addEventListener('keydown', function (ev) {
    var tr = ev.target.closest && ev.target.closest('#cmp-table tbody tr');
    if (tr && (ev.key === 'Enter' || ev.key === ' ') && ev.target === tr && !cmpState.quiz) { ev.preventDefault(); location.hash = 'step-' + tr.getAttribute('data-step'); }
  });
  window.addEventListener('hashchange', render);

  buildTabbar();
  refreshChrome();
  render();
})();

</script>
</body>
</html>
