<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consensus Protocols — Interactive Study Site (Phase A)</title>
<meta name="description" content="Phase A of the consensus-protocols thesis study guide as an interactive site: nine steps, external simulators, timeline, comparison table and references.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
:root {
  /* Layout idea: the study path is a replicated log. Steps are log entries 0–8, grouped by protocol family;
     reading column ~68ch; simulations sit in full-width "bench" cards. Mobile first, bottom tab bar. */
  --bg: #f3f5f7;
  --surface: #ffffff;
  --surface-2: #e9edf1;
  --ink: #15202b;
  --ink-2: #536170;
  --line: #d5dce3;
  --accent: #1d5bbf;
  --accent-ink: #ffffff;
  --accent-soft: #dfe9f9;

  --fam-found: #5c6b7a;
  --fam-crash: #2463c9;
  --fam-lless: #0d8577;
  --fam-byz: #b8561c;
  --fam-meas: #6a55b0;
  --fam-plan: #44515e;

  --ok: #23804a;
  --warn: #a86b00;
  --bad: #c0392b;
  --msg-a: #2463c9;
  --msg-b: #0d8577;
  --msg-c: #b8561c;
  --msg-d: #6a55b0;

  --font-display: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --step--1: 0.84rem;
  --step-0: 1rem;
  --step-1: 1.18rem;
  --step-2: 1.42rem;
  --step-3: 1.8rem;
  --step-4: 2.3rem;

  --radius: 10px;
  --tap: 44px;
  --side: 16px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1317;
    --surface: #151c22;
    --surface-2: #1d262e;
    --ink: #e4e9ee;
    --ink-2: #9aa7b3;
    --line: #2b3640;
    --accent: #78a6f2;
    --accent-ink: #0b1420;
    --accent-soft: #1b2b44;
    --fam-found: #9aa8b6;
    --fam-crash: #78a6f2;
    --fam-lless: #3cc0ae;
    --fam-byz: #ef9152;
    --fam-meas: #a897ee;
    --fam-plan: #a3b0bc;
    --ok: #4cc27b;
    --warn: #e3a838;
    --bad: #f0705f;
    --msg-a: #78a6f2;
    --msg-b: #3cc0ae;
    --msg-c: #ef9152;
    --msg-d: #a897ee;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1317;
  --surface: #151c22;
  --surface-2: #1d262e;
  --ink: #e4e9ee;
  --ink-2: #9aa7b3;
  --line: #2b3640;
  --accent: #78a6f2;
  --accent-ink: #0b1420;
  --accent-soft: #1b2b44;
  --fam-found: #9aa8b6;
  --fam-crash: #78a6f2;
  --fam-lless: #3cc0ae;
  --fam-byz: #ef9152;
  --fam-meas: #a897ee;
  --fam-plan: #a3b0bc;
  --ok: #4cc27b;
  --warn: #e3a838;
  --bad: #f0705f;
  --msg-a: #78a6f2;
  --msg-b: #3cc0ae;
  --msg-c: #ef9152;
  --msg-d: #a897ee;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: var(--step-0);
  line-height: 1.55;
  text-rendering: optimizeLegibility;
}
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
h1 { font-size: var(--step-3); line-height: 1.15; }
h2 { font-size: var(--step-2); line-height: 1.2; }
h3 { font-size: var(--step-1); line-height: 1.3; font-weight: 600; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--surface-2); padding: 0.05em 0.3em; border-radius: 4px; }
strong { font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- app frame ---------- */
.app { min-height: 100%; display: grid; grid-template-columns: 1fr; }
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 8px var(--side); min-height: 52px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); white-space: nowrap; }
.brand-name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.progress-pill {
  font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--surface);
  text-decoration: none;
}

.sidebar { display: none; }
main { padding: 20px var(--side) 120px; min-width: 0; }
.view { max-width: 820px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.view > * { min-width: 0; }
.section > * { min-width: 0; }
.view.wide { max-width: 1100px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar a {
  display: grid; justify-items: center; gap: 2px; padding: 8px 2px 8px; min-height: 58px;
  color: var(--ink-2); text-decoration: none; font-size: 0.72rem; letter-spacing: 0.01em;
}
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }

@media (min-width: 1000px) {
  .app { grid-template-columns: 270px 1fr; }
  .topbar { grid-column: 1 / -1; }
  .sidebar {
    display: block; position: sticky; top: 53px; align-self: start; height: calc(100vh - 53px); overflow-y: auto;
    border-right: 1px solid var(--line); padding: 18px 14px 40px; background: var(--bg);
  }
  .tabbar { display: none; }
  main { padding: 32px 40px 80px; }
  h1 { font-size: var(--step-4); }
}
.side-group { display: grid; gap: 2px; margin-bottom: 18px; }
.side-label { font-family: var(--font-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); padding: 0 10px 6px; }
.side-link {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-size: 0.93rem;
}
.side-link:hover { background: var(--surface-2); }
.side-link[aria-current="page"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.side-link .idx { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); width: 1.2em; text-align: right; }

/* status dot used everywhere */
.dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--fam, var(--ink-2)); flex: none; background: transparent; }
.dot[data-s="doing"] { background: linear-gradient(90deg, var(--fam, var(--ink-2)) 50%, transparent 50%); }
.dot[data-s="done"] { background: var(--fam, var(--ink-2)); }

.fam-found { --fam: var(--fam-found); }
.fam-crash { --fam: var(--fam-crash); }
.fam-lless { --fam: var(--fam-lless); }
.fam-byz { --fam: var(--fam-byz); }
.fam-meas { --fam: var(--fam-meas); }
.fam-plan { --fam: var(--fam-plan); }

/* ---------- common blocks ---------- */
.eyebrow { font-family: var(--font-mono); font-size: 0.78rem; letter-spacing: 0.04em; color: var(--ink-2); }
.lede { font-size: var(--step-1); line-height: 1.5; max-width: 68ch; }
.prose { display: grid; gap: 12px; max-width: 68ch; }
.muted { color: var(--ink-2); }
.small { font-size: var(--step--1); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.section { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; scroll-margin-top: 110px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-size: 0.88rem; white-space: nowrap; cursor: pointer;
}
.chip[aria-pressed="true"], .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: var(--tap); padding: 8px 14px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; font-size: 0.92rem; text-decoration: none;
}
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn .ico { width: 16px; height: 16px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); }
.seg button { min-height: var(--tap); padding: 6px 12px; border: 0; background: transparent; cursor: pointer; font-size: 0.9rem; color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 600; }

.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 0.82rem; color: var(--ink-2); background: var(--surface-2); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.callout { border-left: 3px solid var(--fam, var(--accent)); background: var(--surface); padding: 12px 14px; border-radius: 0 var(--radius) var(--radius) 0; }
.formula { font-family: var(--font-mono); font-size: 0.95rem; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; white-space: nowrap; }

/* ---------- overview ---------- */
.hero { display: grid; gap: 14px; padding-top: 4px; }
.hero h1 { max-width: 26ch; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.82rem; color: var(--ink-2); }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; display: flex; }
.meter i { display: block; height: 100%; }

/* the log map */
.logmap { display: grid; gap: 14px; }
.logfam { display: grid; gap: 6px; }
.logfam-head { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fam); }
.logfam-head::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--fam) 40%, transparent); }
.logentries { display: grid; gap: 6px; }
.logentry {
  display: grid; grid-template-columns: 44px 1fr auto; align-items: center; gap: 12px; min-height: 56px;
  padding: 8px 12px 8px 0; border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface);
  color: var(--ink); text-decoration: none; position: relative; overflow: hidden;
}
.logentry .li { align-self: stretch; display: grid; place-items: center; font-family: var(--font-mono); font-size: 1.1rem; color: var(--fam); border-right: 1px solid var(--line); }
.logentry[data-s="done"] .li { background: var(--fam); color: var(--surface); border-right-color: var(--fam); }
.logentry[data-s="doing"] .li { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--fam) 28%, transparent) 0 6px, transparent 6px 12px); }
.logentry .lt { display: grid; gap: 1px; min-width: 0; }
.logentry .lt b { font-weight: 600; font-size: 0.96rem; }
.logentry .lt span { font-size: 0.8rem; color: var(--ink-2); }
.logentry .lh { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); white-space: nowrap; }
.logentry:hover { border-color: var(--fam); }
.flowarrow { font-family: var(--font-mono); color: var(--ink-2); font-size: 0.8rem; padding-left: 14px; }
@media (min-width: 760px) {
  .logmap { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; align-items: start; }
  .logmap .flowarrow { display: none; }
  .logfam-head { min-height: 3.6em; align-items: flex-end; padding-bottom: 2px; }
  .logfam-head::after { display: none; }
  .logentry { grid-template-columns: 34px 1fr; grid-template-rows: auto auto; row-gap: 2px; min-height: 84px; padding: 8px 8px 8px 0; align-items: start; }
  .logentry .li { grid-row: 1 / span 2; font-size: 1rem; }
  .logentry .lt b { font-size: 0.9rem; line-height: 1.25; }
  .logentry .lh { grid-column: 2; }
}

.loop { display: grid; gap: 8px; counter-reset: loop; }
.loop-item { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.loop-item .n { font-family: var(--font-mono); color: var(--ink-2); font-size: 0.85rem; padding-top: 2px; }
.loop-flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-family: var(--font-mono); font-size: 0.85rem; }
.loop-flow span.k { padding: 4px 10px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); }
.loop-flow span.a { color: var(--ink-2); }

.bar-cell { display: flex; align-items: center; gap: 8px; }
.hbar { height: 8px; border-radius: 4px; background: var(--fam); opacity: 0.8; }

/* ---------- steps ---------- */
.steps-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.steps-strip a {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 4px 10px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-family: var(--font-mono); font-size: 0.85rem;
}
.steps-strip a[aria-current="page"] { border-color: var(--fam); box-shadow: inset 0 -2px 0 var(--fam); }
.step-head { display: grid; gap: 10px; }
.status-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.outcomes { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.outcomes ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 4px; }
.jump { position: sticky; top: 52px; z-index: 5; background: var(--bg); padding: 8px 0; margin: -8px 0; }
@media (min-width: 1000px) { .jump { top: 53px; } }

.ideas { display: grid; gap: 8px; counter-reset: idea; }
details.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.idea > summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 46px; position: relative; display: grid; gap: 3px; min-height: var(--tap); }
details.idea > summary::-webkit-details-marker { display: none; }
details.idea > summary::before { counter-increment: idea; content: counter(idea); position: absolute; left: 14px; top: 12px; font-family: var(--font-mono); font-size: 0.85rem; color: var(--fam); }
details.idea > summary b { font-weight: 600; }
details.idea > summary .more { font-size: 0.8rem; color: var(--accent); }
details.idea[open] > summary .more::after { content: " less"; }
details.idea:not([open]) > summary .more::after { content: " more"; }
details.idea .rest { padding: 0 14px 14px 46px; }
details.idea .rest-empty { display: none; }

.linklist { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.linklist > li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.linklist > li .ico { width: 18px; height: 18px; color: var(--ink-2); margin-top: 2px; }
.linklist ul { margin: 8px 0 0; padding-left: 1.1em; display: grid; gap: 6px; }
.linklist .after { grid-column: 2; }

.checks { display: grid; gap: 8px; counter-reset: q; }
details.check { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
details.check > summary { list-style: none; cursor: pointer; padding: 12px 14px 12px 46px; position: relative; display: grid; gap: 6px; min-height: var(--tap); }
details.check > summary::-webkit-details-marker { display: none; }
details.check > summary::before { counter-increment: q; content: "Q" counter(q); position: absolute; left: 12px; top: 13px; font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink-2); }
details.check > summary .reveal { font-size: 0.82rem; color: var(--accent); font-weight: 600; }
details.check[open] > summary .reveal::before { content: "Hide answer"; }
details.check:not([open]) > summary .reveal::before { content: "Show answer"; }
details.check .ans { margin: 0 14px 14px 46px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); }

.write-box { border: 1px dashed var(--fam); border-radius: var(--radius); padding: 14px 16px; display: grid; gap: 8px; background: color-mix(in srgb, var(--fam) 6%, var(--surface)); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pager a { display: grid; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); text-decoration: none; color: var(--ink); min-height: 64px; }
.pager a span { font-family: var(--font-mono); font-size: 0.75rem; color: var(--ink-2); }
.pager a.next { text-align: right; }

/* steps list view */
.steplist { display: grid; gap: 10px; }
.steprow { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--fam); border-radius: var(--radius); }
.steprow a.title { color: var(--ink); text-decoration: none; display: grid; gap: 2px; }
.steprow a.title b { font-size: 1.02rem; }
@media (min-width: 700px) { .steprow { grid-template-columns: 1fr auto; align-items: center; } }

/* ---------- timeline ---------- */
.tl-wrap { position: relative; }
.tl-scroll { overflow-x: auto; overscroll-behavior-x: contain; scroll-snap-type: x proximity; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.tl-track { position: relative; height: 272px; }
.tl-axis { position: absolute; left: 0; right: 0; top: 128px; height: 2px; background: var(--line); }
.tl-item { position: absolute; top: 0; width: 132px; height: 272px; scroll-snap-align: center; }
.tl-item button {
  position: absolute; left: 8px; width: 116px; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; display: grid; gap: 2px; color: var(--ink); min-height: 74px;
}
.tl-item.up button { bottom: 160px; }
.tl-item.down button { top: 146px; }
.tl-item button .y { font-family: var(--font-mono); font-size: 0.78rem; color: var(--fam); font-weight: 600; }
.tl-item button .l { font-size: 0.84rem; line-height: 1.25; }
.tl-item button[aria-pressed="true"] { border-color: var(--fam); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fam) 35%, transparent); }
.tl-item .tick { position: absolute; left: 65px; width: 1px; background: color-mix(in srgb, var(--fam) 50%, transparent); }
.tl-item.up .tick { top: 112px; height: 10px; }
.tl-item.down .tick { top: 136px; height: 10px; }
.tl-item .pin { position: absolute; left: 59px; top: 122px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 3px solid var(--fam); }

.cmp-table th[aria-sort="ascending"] button::after { content: "▲"; font-size: 0.7em; }
.cmp-table th[aria-sort="descending"] button::after { content: "▼"; font-size: 0.7em; }
.cmp-table tbody tr { cursor: pointer; }
.cmp-table tbody tr:hover td { background: var(--surface-2); }
.cmp-table td:first-child, .cmp-table th:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; box-shadow: 1px 0 0 var(--line); min-width: 150px; }
.cmp-table th:first-child { background: var(--surface-2); }
.cmp-table td:first-child { border-left: 4px solid var(--fam); font-weight: 600; }
.cmp-table td { min-width: 130px; }
.cmp-table td.hidecell { color: transparent; background: repeating-linear-gradient(135deg, var(--surface-2) 0 6px, transparent 6px 12px); position: relative; }

/* ---------- references ---------- */
.searchbox { display: flex; gap: 8px; align-items: center; }

.refitem { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 6px; }

.refitem .meta a.chip { min-height: 30px; padding: 3px 10px; font-size: 0.78rem; }
mark { background: color-mix(in srgb, var(--warn) 30%, transparent); color: inherit; border-radius: 3px; }

/* ---------- footer ---------- */
.foot { max-width: 820px; margin: 40px auto 0; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 0.84rem; color: var(--ink-2); }

.ext-none { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); padding: 12px 14px; display: grid; gap: 10px; }

.badge { display: inline-block; font-family: var(--font-mono); font-size: 0.74rem; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); }

<script>
window.__CONTENT__ = {"steps":[{"n":0,"title":"The problem and the model","hours":"about 6 h","h2":"Phase A · Step 0 — The problem and the model (about 6 h)","intro":["Every protocol in your thesis solves the same problem under different assumptions. Learn the assumptions first, and each protocol then reads as one answer to them."],"outcomes":["What consensus guarantees, and which of those guarantees are safety and which are liveness.","Why real systems agree on a log, not on a single value.","How crash, crash-recovery and Byzantine faults differ.","Why every protocol you study has a timeout.","Why crash tolerance needs n = 2f+1 nodes and Byzantine tolerance needs n = 3f+1."],"ideas":[{"title":"Consensus","first":"Each node proposes a value and all correct nodes must decide one.","rest":"Four properties define it. <em>Agreement<\/em>: no two correct nodes decide differently. <em>Validity<\/em>: the decided value was proposed by someone. <em>Integrity<\/em>: a node decides at most once. <em>Termination<\/em>: every correct node eventually decides. The first three are <strong>safety<\/strong> (nothing bad ever happens). Termination is <strong>liveness<\/strong> (something good eventually happens).","full":"Each node proposes a value and all correct nodes must decide one. Four properties define it. <em>Agreement<\/em>: no two correct nodes decide differently. <em>Validity<\/em>: the decided value was proposed by someone. <em>Integrity<\/em>: a node decides at most once. <em>Termination<\/em>: every correct node eventually decides. The first three are <strong>safety<\/strong> (nothing bad ever happens). Termination is <strong>liveness<\/strong> (something good eventually happens)."},{"title":"State machine replication (SMR)","first":"Real systems run consensus again and again, once per slot of a log.","rest":"Replicas that apply the same commands in the same order to the same deterministic program end in the same state. etcd, Kafka&#x27;s controller, CometBFT and the rest are all SMR systems. Agreeing on one ordered log is called <em>total-order broadcast<\/em>, and it is equivalent to consensus.","full":"Real systems run consensus again and again, once per slot of a log. Replicas that apply the same commands in the same order to the same deterministic program end in the same state. etcd, Kafka&#x27;s controller, CometBFT and the rest are all SMR systems. Agreeing on one ordered log is called <em>total-order broadcast<\/em>, and it is equivalent to consensus."},{"title":"Failure models","first":"A <em>crash<\/em> fault stops a node for good.","rest":"In <em>crash-recovery<\/em> it can come back, but it remembers only what it saved to disk. That is why Raft saves its term, vote and log before replying. A <em>Byzantine<\/em> fault can do anything: lie, tell different nodes different things, or collude.","full":"A <em>crash<\/em> fault stops a node for good. In <em>crash-recovery<\/em> it can come back, but it remembers only what it saved to disk. That is why Raft saves its term, vote and log before replying. A <em>Byzantine<\/em> fault can do anything: lie, tell different nodes different things, or collude."},{"title":"Timing models","first":"<em>Synchronous<\/em>: every message arrives within a known bound Δ. <em>Asynchronous<\/em>: there is no bound at all. <em>Partially synchronous<\/em>: the network can misbehave for a while.","rest":"After an unknown moment, called GST (Global Stabilization Time), messages arrive within Δ.","full":"<em>Synchronous<\/em>: every message arrives within a known bound Δ. <em>Asynchronous<\/em>: there is no bound at all. <em>Partially synchronous<\/em>: the network can misbehave for a while. After an unknown moment, called GST (Global Stabilization Time), messages arrive within Δ."},{"title":"FLP impossibility (1985)","first":"In a purely asynchronous network, no deterministic protocol can guarantee termination if even one node may crash.","rest":"The root cause is that you cannot tell a crashed node from a slow one.","full":"In a purely asynchronous network, no deterministic protocol can guarantee termination if even one node may crash. The root cause is that you cannot tell a crashed node from a slow one."},{"title":"The way out","first":"Every protocol here is <em>always safe<\/em>, and <em>live once the network behaves<\/em> (partial synchrony).","rest":"Timeouts are how a protocol notices that progress has stopped: Raft&#x27;s election timeout, PBFT&#x27;s view-change timer, Tendermint&#x27;s round timeouts. This matters for your benchmark: <strong>failover time is mostly a timeout you configured<\/strong>, not a property of the algorithm alone.","full":"Every protocol here is <em>always safe<\/em>, and <em>live once the network behaves<\/em> (partial synchrony). Timeouts are how a protocol notices that progress has stopped: Raft&#x27;s election timeout, PBFT&#x27;s view-change timer, Tendermint&#x27;s round timeouts. This matters for your benchmark: <strong>failover time is mostly a timeout you configured<\/strong>, not a property of the algorithm alone."},{"title":"Quorums","first":"A decision needs a quorum of votes, and any two quorums must overlap.","rest":"With crash faults, a majority out of n = 2f+1 is enough: two majorities always share a node, and that node remembers the earlier decision. With Byzantine faults, the overlap must contain an <em>honest<\/em> node, so it needs at least f+1 nodes. For quorums of size q out of n nodes:","full":"A decision needs a quorum of votes, and any two quorums must overlap. With crash faults, a majority out of n = 2f+1 is enough: two majorities always share a node, and that node remembers the earlier decision. With Byzantine faults, the overlap must contain an <em>honest<\/em> node, so it needs at least f+1 nodes. For quorums of size q out of n nodes:"}],"ideasExtra":[{"t":"code","lang":"latex","text":"|Q_1 \\cap Q_2| \\;\\ge\\; 2q - n \\;\\ge\\; f + 1 \\qquad\\text{and}\\qquad q \\;\\le\\; n - f"},{"t":"p","html":"The second condition keeps a quorum reachable while f nodes are silent. The smallest cluster where both hold is n = 3f+1, with q = 2f+1; larger clusters work too. Dwork, Lynch and Stockmeyer (1988) proved that Byzantine consensus under partial synchrony is impossible with fewer than 3f+1 nodes.","text":"The second condition keeps a quorum reachable while f nodes are silent. The smallest cluster where both hold is n = 3f+1, with q = 2f+1; larger clusters work too. Dwork, Lynch and Stockmeyer (1988) proved that Byzantine consensus under partial synchrony is impossible with fewer than 3f+1 nodes."},{"t":"table","head":["Fault model","Nodes needed to survive f faults","Quorum size","Smallest useful cluster"],"rows":[["Crash","2f + 1","f + 1 (a majority)","3 nodes, survives 1 fault"],["Byzantine","3f + 1","2f + 1","4 nodes, survives 1 fault"]]}],"watch":{"h":"Watch (about 2 h)","items":[{"t":"ul","items":[{"html":"Martin Kleppmann, <em>Distributed Systems<\/em> (University of Cambridge), <a href=\"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube playlist<\/a>. Watch lectures <strong>2.1–2.4<\/strong> (system models), <strong>5.2<\/strong> (quorums), <strong>5.3<\/strong> (replication using broadcast) and <strong>6.1<\/strong> (introduction to consensus).","text":"Martin Kleppmann, Distributed Systems (University of Cambridge), YouTube playlist. Watch lectures 2.1–2.4 (system models), 5.2 (quorums), 5.3 (replication using broadcast) and 6.1 (introduction to consensus).","children":[]}]}]},"play":{"h":"Play with it (about 15 min)","items":[{"t":"ul","items":[{"html":"The <a href=\"https://growingswe.com/blog/consensus\" target=\"_blank\" rel=\"noopener noreferrer\">Byzantine Generals stepper<\/a> (a personal blog). Set 3 generals with one traitor and step through: no agreement. Then 4 generals with the same traitor: agreement. That is n = 3f+1, seen directly. The same page also steps through two-phase commit and Paxos.","text":"The Byzantine Generals stepper (a personal blog). Set 3 generals with one traitor and step through: no agreement. Then 4 generals with the same traitor: agreement. That is n = 3f+1, seen directly. The same page also steps through two-phase commit and Paxos.","children":[]}]}]},"read":{"h":"Read (about 2.5 h)","items":[{"t":"ul","items":[{"html":"Kleppmann&#x27;s <a href=\"https://www.cl.cam.ac.uk/teaching/2122/ConcDisSys/dist-sys-notes.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">lecture notes (PDF)<\/a>, <strong>pp. 12–23<\/strong> (models of distributed systems) and <strong>pp. 51–60<\/strong> (quorums, replication using broadcast, introduction to consensus). They follow the videos one to one.","text":"Kleppmann's lecture notes (PDF), pp. 12–23 (models of distributed systems) and pp. 51–60 (quorums, replication using broadcast, introduction to consensus). They follow the videos one to one.","children":[]},{"html":"Cachin, Guerraoui and Rodrigues, <strong>Chapter 2<\/strong>: the sections on abstracting processes (failure models), timing assumptions and quorums. Then the start of <strong>Chapter 5<\/strong>: the specifications of regular and uniform consensus. Take your formal definitions from here. I could not verify page numbers for the 2nd edition, so find these sections by title in your PDF&#x27;s bookmarks.","text":"Cachin, Guerraoui and Rodrigues, Chapter 2: the sections on abstracting processes (failure models), timing assumptions and quorums. Then the start of Chapter 5: the specifications of regular and uniform consensus. Take your formal definitions from here. I could not verify page numbers for the 2nd edition, so find these sections by title in your PDF's bookmarks.","children":[]},{"html":"Decentralized Thoughts, <a href=\"https://decentralizedthoughts.github.io/2019-06-01-2019-5-31-models\" target=\"_blank\" rel=\"noopener noreferrer\">Synchrony, Asynchrony and Partial synchrony<\/a> (short), then the one-page <a href=\"https://decentralizedthoughts.github.io/2021-10-29-consensus-cheat-sheet\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus cheat sheet<\/a>: which bounds hold in which model.","text":"Decentralized Thoughts, Synchrony, Asynchrony and Partial synchrony (short), then the one-page Consensus cheat sheet: which bounds hold in which model.","children":[]}]},{"t":"p","html":"<em>Optional, to cite rather than read in full now:<\/em> Fischer, Lynch, Paterson, &quot;Impossibility of distributed consensus with one faulty process&quot; (J. ACM, 1985). Dwork, Lynch, Stockmeyer, &quot;Consensus in the presence of partial synchrony&quot; (J. ACM, 1988). Schneider, &quot;Implementing fault-tolerant services using the state machine approach: a tutorial&quot; (ACM Computing Surveys, 1990).","text":"Optional, to cite rather than read in full now: Fischer, Lynch, Paterson, \"Impossibility of distributed consensus with one faulty process\" (J. ACM, 1985). Dwork, Lynch, Stockmeyer, \"Consensus in the presence of partial synchrony\" (J. ACM, 1988). Schneider, \"Implementing fault-tolerant services using the state machine approach: a tutorial\" (ACM Computing Surveys, 1990)."}]},"checks":["A protocol never decides anything. Which property does it break, and is it still safe?","Why does a Raft node save its term and vote to disk before answering a vote request? Which failure model forces this?","FLP says consensus is impossible. Why do etcd and CometBFT work in practice?","With 5 nodes and crash faults, how many may fail? With 7 nodes and Byzantine faults?","Why are 3 nodes not enough to survive one Byzantine fault?","In your benchmark a leader is killed. Which part of the measured failover time is set by configuration rather than by the algorithm?"],"write":{"h":"Write for the thesis (1.5–2 pages)","html":"Section <em>System model and definitions<\/em>: the four consensus properties, SMR and total-order broadcast, the three failure models, the three timing models with FLP, and the quorum table above. Cite Cachin et al. for the definitions, and FLP, DLS and Schneider for the results."}},{"n":1,"title":"Raft, one level deeper","hours":"about 5 h","h2":"Phase A · Step 1 — Raft, one level deeper (about 5 h)","intro":["You know how Raft works. This step is about why it is safe, what a write costs, and how it behaves when a leader fails or is cut off. Those three are what your benchmark measures."],"outcomes":["The two rules that make Raft safe: the election restriction and the current-term commit rule.","Where the time goes in one Raft write.","What happens, step by step, when the leader crashes, and when it is partitioned from its followers."],"ideas":[{"title":"Terms are a logical clock","first":"Each term has at most one leader, because a candidate needs a majority of votes and each node votes once per term.","rest":"A node that sees a higher term steps down at once.","full":"Each term has at most one leader, because a candidate needs a majority of votes and each node votes once per term. A node that sees a higher term steps down at once."},{"title":"Log matching","first":"Each AppendEntries carries the index and term of the entry just before the new ones.","rest":"A follower accepts only if it has that entry. So if two logs agree on one entry, they agree on everything before it.","full":"Each AppendEntries carries the index and term of the entry just before the new ones. A follower accepts only if it has that entry. So if two logs agree on one entry, they agree on everything before it."},{"title":"Election restriction","first":"A node votes only for a candidate whose log is at least as up to date as its own (higher last term, or same last term and at least as long).","rest":"Any committed entry sits on a majority, and any winning candidate needs votes from a majority. The two majorities overlap, so the new leader already holds every committed entry. This is the quorum overlap from Step 0, applied.","full":"A node votes only for a candidate whose log is at least as up to date as its own (higher last term, or same last term and at least as long). Any committed entry sits on a majority, and any winning candidate needs votes from a majority. The two majorities overlap, so the new leader already holds every committed entry. This is the quorum overlap from Step 0, applied."},{"title":"The current-term commit rule","first":"A leader marks an entry committed by counting replicas only if the entry is from its own term.","rest":"Older entries become committed indirectly, when a newer entry after them commits. Figure 8 of the paper shows how counting old entries would let a committed entry be overwritten. This is the subtlest rule in Raft.","full":"A leader marks an entry committed by counting replicas only if the entry is from its own term. Older entries become committed indirectly, when a newer entry after them commits. Figure 8 of the paper shows how counting old entries would let a committed entry be overwritten. This is the subtlest rule in Raft."},{"title":"Persistence","first":"Term, vote and log must be on disk before a node answers.","rest":"So every write waits for disk flushes (fsync) on the leader and on a majority of followers. In etcd, disk latency is often a larger part of write latency than the network.","full":"Term, vote and log must be on disk before a node answers. So every write waits for disk flushes (fsync) on the leader and on a majority of followers. In etcd, disk latency is often a larger part of write latency than the network."},{"title":"The cost of a write","first":"Client to leader, leader to all followers in parallel, the fastest majority acknowledges, the leader commits, applies and replies.","rest":"That is one leader–follower round trip plus the client round trip, plus the disk flushes. The leader sends every entry to every follower, so the leader&#x27;s network and CPU usually cap throughput. Batching and pipelining raise that cap.","full":"Client to leader, leader to all followers in parallel, the fastest majority acknowledges, the leader commits, applies and replies. That is one leader–follower round trip plus the client round trip, plus the disk flushes. The leader sends every entry to every follower, so the leader&#x27;s network and CPU usually cap throughput. Batching and pipelining raise that cap."},{"title":"Leader crash","first":"Followers stop hearing heartbeats.","rest":"After an election timeout, one becomes a candidate, asks for votes, wins a majority, and the new leader starts serving. Raft randomizes the timeout so that usually only one follower times out first; the paper uses 150–300 ms. etcd&#x27;s defaults are a 100 ms heartbeat and a 1000 ms election timeout, so expect failover of a second or more at defaults.","full":"Followers stop hearing heartbeats. After an election timeout, one becomes a candidate, asks for votes, wins a majority, and the new leader starts serving. Raft randomizes the timeout so that usually only one follower times out first; the paper uses 150–300 ms. etcd&#x27;s defaults are a 100 ms heartbeat and a 1000 ms election timeout, so expect failover of a second or more at defaults."},{"title":"Leader partitioned from its followers","first":"The old leader keeps running and still believes it leads.","rest":"It cannot reach a majority, so nothing it receives commits, and its clients see timeouts. The other side elects a new leader in a higher term. When the partition heals, the old leader sees the higher term and steps down. Two extensions matter here. <em>CheckQuorum<\/em>: a leader steps down if it has not heard from a majority within an election timeout. <em>PreVote<\/em>: a node checks it could win before it raises its term, so a returning node cannot disrupt a healthy leader. etcd&#x27;s Raft library implements both.","full":"The old leader keeps running and still believes it leads. It cannot reach a majority, so nothing it receives commits, and its clients see timeouts. The other side elects a new leader in a higher term. When the partition heals, the old leader sees the higher term and steps down. Two extensions matter here. <em>CheckQuorum<\/em>: a leader steps down if it has not heard from a majority within an election timeout. <em>PreVote<\/em>: a node checks it could win before it raises its term, so a returning node cannot disrupt a healthy leader. etcd&#x27;s Raft library implements both."},{"title":"Reads","first":"Reading from the leader&#x27;s local state is not enough for linearizability, because a deposed leader may not know it yet.","rest":"The leader must first confirm it still leads (a heartbeat round, called ReadIndex) or rely on a time lease.","full":"Reading from the leader&#x27;s local state is not enough for linearizability, because a deposed leader may not know it yet. The leader must first confirm it still leads (a heartbeat round, called ReadIndex) or rely on a time lease."}],"ideasExtra":[],"watch":{"h":"Watch (about 1.5 h)","items":[{"t":"ul","items":[{"html":"Kleppmann, lecture <strong>6.2 Raft<\/strong> in the <a href=\"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB\" target=\"_blank\" rel=\"noopener noreferrer\">playlist<\/a>, as a quick refresher with pseudocode.","text":"Kleppmann, lecture 6.2 Raft in the playlist, as a quick refresher with pseudocode.","children":[]},{"html":"MIT 6.824 (2020), Robert Morris, <a href=\"http://nil.csail.mit.edu/6.824/2020/video/7.html\" target=\"_blank\" rel=\"noopener noreferrer\">Lecture 7: Fault Tolerance: Raft (2)<\/a>. It covers the subtle cases: log repair, Figure 8, persistence and snapshots. <em>Optional:<\/em> <a href=\"http://nil.csail.mit.edu/6.824/2020/video/6.html\" target=\"_blank\" rel=\"noopener noreferrer\">Lecture 6: Raft (1)<\/a> if you want the basics again from a different teacher.","text":"MIT 6.824 (2020), Robert Morris, Lecture 7: Fault Tolerance: Raft (2). It covers the subtle cases: log repair, Figure 8, persistence and snapshots. Optional: Lecture 6: Raft (1) if you want the basics again from a different teacher.","children":[]}]}]},"play":{"h":"Play with it (about 30 min)","items":[{"t":"ul","items":[{"html":"<a href=\"http://thesecretlivesofdata.com/raft/\" target=\"_blank\" rel=\"noopener noreferrer\">The Secret Lives of Data: Raft<\/a>: a guided animation you advance yourself. Gentle; start here if any part of Raft feels shaky.","text":"The Secret Lives of Data: Raft: a guided animation you advance yourself. Gentle; start here if any part of Raft feels shaky.","children":[]},{"html":"<a href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">RaftScope<\/a>, on the official Raft site: five live servers. You can pause it, change its speed, stop, restart or time out a server, and send client requests. Try this: stop the leader and watch the election; then stop two of five servers and watch progress stop. It cannot simulate network partitions.","text":"RaftScope, on the official Raft site: five live servers. You can pause it, change its speed, stop, restart or time out a server, and send client requests. Try this: stop the leader and watch the election; then stop two of five servers and watch progress stop. It cannot simulate network partitions.","children":[]},{"html":"For partitions, step through the &quot;Network Partition&quot; scenario of the Raft simulator on <a href=\"https://yoichiozaki.github.io/en/blog/consensus-algorithms\" target=\"_blank\" rel=\"noopener noreferrer\">this page<\/a> (a personal blog; fixed scenarios, one step at a time).","text":"For partitions, step through the \"Network Partition\" scenario of the Raft simulator on this page (a personal blog; fixed scenarios, one step at a time).","children":[]}]}]},"read":{"h":"Read (about 2 h)","items":[{"t":"ul","items":[{"html":"Ongaro and Ousterhout, <a href=\"https://pdos.csail.mit.edu/6.824/papers/raft-extended.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">In Search of an Understandable Consensus Algorithm (Extended Version)<\/a>. Read <strong>§5.4 Safety<\/strong> closely, including Figure 8. Keep <strong>Figure 2<\/strong> beside you as the reference card. Then <strong>§8 Client interaction<\/strong> and <strong>§9.3<\/strong>, which measures how election timeouts affect election time. Skip §6 (membership changes) and §7 (log compaction) for now.","text":"Ongaro and Ousterhout, In Search of an Understandable Consensus Algorithm (Extended Version). Read §5.4 Safety closely, including Figure 8. Keep Figure 2 beside you as the reference card. Then §8 Client interaction and §9.3, which measures how election timeouts affect election time. Skip §6 (membership changes) and §7 (log compaction) for now.","children":[]},{"html":"Howard and Abraham, <a href=\"https://decentralizedthoughts.github.io/2020-12-12-raft-liveness-full-omission/\" target=\"_blank\" rel=\"noopener noreferrer\">Raft does not Guarantee Liveness in the face of Network Faults<\/a> (Decentralized Thoughts, 2020). Short, and directly about your partition scenario: why plain Raft, and even Raft with PreVote, can fail to keep a stable leader, and how CheckQuorum fixes it.","text":"Howard and Abraham, Raft does not Guarantee Liveness in the face of Network Faults (Decentralized Thoughts, 2020). Short, and directly about your partition scenario: why plain Raft, and even Raft with PreVote, can fail to keep a stable leader, and how CheckQuorum fixes it.","children":[]},{"html":"<em>Optional:<\/em> Ongaro&#x27;s PhD dissertation, <a href=\"https://github.com/ongardie/dissertation\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus: Bridging Theory and Practice<\/a> (Stanford, 2014). Chapter 6 for linearizable reads, and the Pre-Vote discussion in Chapter 9.","text":"Optional: Ongaro's PhD dissertation, Consensus: Bridging Theory and Practice (Stanford, 2014). Chapter 6 for linearizable reads, and the Pre-Vote discussion in Chapter 9.","children":[]}]}]},"checks":["Why may a new leader not mark an entry from an earlier term as committed just because a majority has it?","What does the election restriction guarantee, and what could go wrong without it?","Name two parts of a Raft write&#x27;s latency that are not network time.","A leader is cut off from its followers but clients can still reach it. What do those clients see? What changes with CheckQuorum?","You kill the etcd leader at default settings. Give a rough lower bound for the time until writes succeed again, and say what it depends on.","Why does adding followers tend to lower Raft&#x27;s throughput rather than raise it?"],"write":{"h":"Write for the thesis (about 2 pages)","html":"Section <em>Raft<\/em>: terms and roles, leader election, log replication and the commit rule, the safety argument (election restriction plus the current-term rule), persistence, reads, and behaviour under leader crash and partition (election timeout, PreVote, CheckQuorum). Then fill the Raft row of the comparison table."}},{"n":2,"title":"Paxos and Multi-Paxos, seen through Raft","hours":"about 5 h","h2":"Phase A · Step 2 — Paxos and Multi-Paxos, seen through Raft (about 5 h)","intro":["Paxos is the ancestor of every protocol in your thesis, and Raft is one way to build Multi-Paxos. Learn Paxos as &quot;Raft with the pieces taken apart&quot;, and it stops being hard."],"outcomes":["The two phases of single-decree Paxos, and why the proposer must sometimes give up its own value.","How Multi-Paxos reaches the same steady-state cost as Raft.","Two real differences between Paxos and Raft."],"ideas":[{"title":"Roles","first":"<em>Proposers<\/em> suggest values, <em>acceptors<\/em> vote, <em>learners<\/em> find out the result.","rest":"In practice every node plays all three.","full":"<em>Proposers<\/em> suggest values, <em>acceptors<\/em> vote, <em>learners<\/em> find out the result. In practice every node plays all three."},{"title":"Ballots","first":"Every attempt carries a unique, increasing ballot number.","rest":"A ballot plays the role of a Raft term.","full":"Every attempt carries a unique, increasing ballot number. A ballot plays the role of a Raft term."},{"title":"Phase 1 (prepare / promise)","first":"A proposer picks ballot b and asks the acceptors to promise to ignore anything lower.","rest":"Each acceptor that promises also reports the value it last accepted, if any. The proposer needs promises from a majority.","full":"A proposer picks ballot b and asks the acceptors to promise to ignore anything lower. Each acceptor that promises also reports the value it last accepted, if any. The proposer needs promises from a majority."},{"title":"Phase 2 (accept / accepted)","first":"If any promise reported a value, the proposer must propose the one with the highest ballot, not its own.","rest":"Otherwise it may propose its own. The value is <em>chosen<\/em> once a majority accepts it in the same ballot.","full":"If any promise reported a value, the proposer must propose the one with the highest ballot, not its own. Otherwise it may propose its own. The value is <em>chosen<\/em> once a majority accepts it in the same ballot."},{"title":"Why that rule is safe","first":"If a value was already chosen, a majority accepted it.","rest":"Phase 1 also asks a majority. The two majorities overlap, so the proposer is told about the value and carries it forward. Same quorum overlap as Step 0, and the same job as Raft&#x27;s election restriction.","full":"If a value was already chosen, a majority accepted it. Phase 1 also asks a majority. The two majorities overlap, so the proposer is told about the value and carries it forward. Same quorum overlap as Step 0, and the same job as Raft&#x27;s election restriction."},{"title":"Liveness is not guaranteed","first":"Two proposers can keep pre-empting each other with ever higher ballots, and nothing gets chosen.","rest":"That is FLP showing up in practice. Real systems elect one stable leader with timeouts, which needs partial synchrony.","full":"Two proposers can keep pre-empting each other with ever higher ballots, and nothing gets chosen. That is FLP showing up in practice. Real systems elect one stable leader with timeouts, which needs partial synchrony."},{"title":"Multi-Paxos","first":"A stable leader runs Phase 1 once for all future log slots, then each command needs only Phase 2: one round trip to a majority.","rest":"That is exactly Raft&#x27;s steady state, so the two cost the same when nothing fails.","full":"A stable leader runs Phase 1 once for all future log slots, then each command needs only Phase 2: one round trip to a majority. That is exactly Raft&#x27;s steady state, so the two cost the same when nothing fails."},{"title":"Real differences from Raft","first":"In Paxos any node can become leader, and it fetches missing entries from the promises.","rest":"In Raft only an up-to-date node can win, so entries flow only from leader to followers. Paxos lets log slots be decided out of order (gaps are filled later); Raft keeps the log contiguous. Howard and Mortier argue that most of Raft&#x27;s clarity comes from its presentation, not from a different algorithm.","full":"In Paxos any node can become leader, and it fetches missing entries from the promises. In Raft only an up-to-date node can win, so entries flow only from leader to followers. Paxos lets log slots be decided out of order (gaps are filled later); Raft keeps the log contiguous. Howard and Mortier argue that most of Raft&#x27;s clarity comes from its presentation, not from a different algorithm."}],"ideasExtra":[],"watch":{"h":"Watch (about 1 h)","items":[{"t":"ul","items":[{"html":"John Ousterhout, <a href=\"https://www.youtube.com/watch?v=JEpsBg0AO6o\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos lecture (Raft user study)<\/a>. Basic Paxos, then Multi-Paxos, made for the user study that compared Raft and Paxos. Ousterhout also taught that study's Raft lecture (in References), so the two line up.","text":"John Ousterhout, Paxos lecture (Raft user study). Basic Paxos, then Multi-Paxos, made for the user study that compared Raft and Paxos. Ousterhout also taught that study's Raft lecture (in References), so the two line up.","children":[]}]}]},"play":{"h":"Play with it (about 20 min)","items":[{"t":"ul","items":[{"html":"Murat Demirbas, <a href=\"https://muratdem.github.io/BeatPaxos/\" target=\"_blank\" rel=\"noopener noreferrer\">Beat Paxos<\/a> (2026): single-decree Paxos on 3 nodes. Double-click a node to kill or recover it; click and hold to slow its replies. Try to get two different values chosen. You can&#x27;t, and that is the lesson: Paxos stays safe, only progress suffers. It has no pause button.","text":"Murat Demirbas, Beat Paxos (2026): single-decree Paxos on 3 nodes. Double-click a node to kill or recover it; click and hold to slow its replies. Try to get two different values chosen. You can't, and that is the lesson: Paxos stays safe, only progress suffers. It has no pause button.","children":[]},{"html":"The Paxos simulator on <a href=\"https://yoichiozaki.github.io/en/blog/consensus-algorithms\" target=\"_blank\" rel=\"noopener noreferrer\">this page<\/a> steps through prepare, promise and accept. Its &quot;Proposer Conflict&quot; scenario shows the livelock from point 6.","text":"The Paxos simulator on this page steps through prepare, promise and accept. Its \"Proposer Conflict\" scenario shows the livelock from point 6.","children":[]},{"html":"For Multi-Paxos, the <a href=\"https://sandeepkv93.github.io/distributed-systems-visualizer/consensus-variants/\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Variants visualizer<\/a> has a &quot;Multi-Paxos Leader&quot; scenario, with speed control and reset but no pause or failures. It is a personal project, so check what it shows against the papers.","text":"For Multi-Paxos, the Consensus Variants visualizer has a \"Multi-Paxos Leader\" scenario, with speed control and reset but no pause or failures. It is a personal project, so check what it shows against the papers.","children":[]}]}]},"read":{"h":"Read (about 2.5 h)","items":[{"t":"ul","items":[{"html":"Heidi Howard and Richard Mortier, <a href=\"https://arxiv.org/abs/2004.05074\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos vs Raft: Have we reached consensus on distributed consensus?<\/a> (PaPoC 2020). Read this first: it describes Paxos in Raft&#x27;s vocabulary and lists the differences. It will be a key citation in your comparison chapter.","text":"Heidi Howard and Richard Mortier, Paxos vs Raft: Have we reached consensus on distributed consensus? (PaPoC 2020). Read this first: it describes Paxos in Raft's vocabulary and lists the differences. It will be a key citation in your comparison chapter.","children":[]},{"html":"Leslie Lamport, <a href=\"http://css.csail.mit.edu/6.824/2014/papers/paxos-simple.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos Made Simple<\/a> (2001). Sections 1–2 (single-decree Paxos) closely. Section 3 (implementing a state machine) is Multi-Paxos; skim it.","text":"Leslie Lamport, Paxos Made Simple (2001). Sections 1–2 (single-decree Paxos) closely. Section 3 (implementing a state machine) is Multi-Paxos; skim it.","children":[]},{"html":"<em>Optional, but it pays off in Step 5:<\/em> Decentralized Thoughts, <a href=\"https://decentralizedthoughts.github.io/2022-11-04-paxos-via-recoverable-broadcast\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos from Recoverable Broadcast<\/a>. It splits Paxos into building blocks that the same blog later reuses for PBFT and HotStuff.","text":"Optional, but it pays off in Step 5: Decentralized Thoughts, Paxos from Recoverable Broadcast. It splits Paxos into building blocks that the same blog later reuses for PBFT and HotStuff.","children":[]}]}]},"checks":["Why must a proposer in Phase 2 use the reported value with the highest ballot?","Which Raft mechanism plays the role of Phase 1? Which plays the role of Phase 2?","Two proposers keep pre-empting each other. Is the system still safe? Is it live? What assumption fixes it?","Why does Multi-Paxos have the same steady-state latency as Raft?","Give one difference in how a new leader gets entries it is missing, in Paxos versus Raft."],"write":{"h":"Write for the thesis (about 2 pages)","html":"Section <em>Paxos and Multi-Paxos<\/em>: roles, ballots, the two phases, the safety argument, the liveness problem, Multi-Paxos, and a short comparison with Raft citing Howard and Mortier. Then fill the Multi-Paxos row of the comparison table."}},{"n":3,"title":"ZAB, ZooKeeper and KRaft: the consensus inside Kafka","hours":"about 3 h","h2":"Phase A · Step 3 — ZAB, ZooKeeper and KRaft: the consensus inside Kafka (about 3 h)","intro":["In Kafka, consensus manages the cluster&#x27;s metadata, not the messages themselves. Two of your seven systems are Kafka, so this distinction decides what your Kafka numbers mean."],"outcomes":["Which part of Kafka runs a consensus protocol, and which part does not.","How ZAB differs from Raft and Paxos.","What KRaft changes in Raft."],"ideas":[{"title":"Two planes","first":"The <em>data plane<\/em> stores messages.","rest":"Each partition has a leader broker, and follower brokers copy from it by sending fetch requests. The <em>control plane<\/em> stores metadata: which broker leads each partition, which replicas are in sync, which topics exist. In ZooKeeper mode the metadata lives in ZooKeeper. In KRaft mode it lives in a replicated log run by a quorum of controllers.","full":"The <em>data plane<\/em> stores messages. Each partition has a leader broker, and follower brokers copy from it by sending fetch requests. The <em>control plane<\/em> stores metadata: which broker leads each partition, which replicas are in sync, which topics exist. In ZooKeeper mode the metadata lives in ZooKeeper. In KRaft mode it lives in a replicated log run by a quorum of controllers."},{"title":"The data plane is not a majority quorum","first":"Kafka keeps a set of <em>in-sync replicas<\/em> (ISR), the followers that have caught up with the leader.","rest":"With <code>acks=all<\/code>, the leader acknowledges a write only after every replica in the ISR has it. <code>min.insync.replicas<\/code> sets a floor: below it, writes are refused. This lets f+1 replicas survive f failures. It is safe only because the control plane, which does use consensus, decides who is in the ISR and who leads.","full":"Kafka keeps a set of <em>in-sync replicas<\/em> (ISR), the followers that have caught up with the leader. With <code>acks=all<\/code>, the leader acknowledges a write only after every replica in the ISR has it. <code>min.insync.replicas<\/code> sets a floor: below it, writes are refused. This lets f+1 replicas survive f failures. It is safe only because the control plane, which does use consensus, decides who is in the ISR and who leads."},{"title":"What this means for your benchmark","first":"A produce with <code>acks=all<\/code> measures ISR replication, in both Kafka modes.","rest":"Consensus enters on failover. The loss of a broker is detected through a configured session or heartbeat timeout. The controller then picks a new leader from the ISR, records it in the metadata, and brokers and clients learn it. So &quot;Kafka with KRaft vs Kafka with ZooKeeper&quot; is mainly a comparison of control planes. Say this explicitly in your thesis, or a reviewer will.","full":"A produce with <code>acks=all<\/code> measures ISR replication, in both Kafka modes. Consensus enters on failover. The loss of a broker is detected through a configured session or heartbeat timeout. The controller then picks a new leader from the ISR, records it in the metadata, and brokers and clients learn it. So &quot;Kafka with KRaft vs Kafka with ZooKeeper&quot; is mainly a comparison of control planes. Say this explicitly in your thesis, or a reviewer will."},{"title":"ZAB: primary-backup, not command replication","first":"In ZooKeeper the leader executes each request and broadcasts the resulting state change.","rest":"Raft and Paxos instead replicate the commands and let every replica execute them. The first is called <em>passive<\/em> replication, the second <em>active<\/em>. ZAB must deliver one leader&#x27;s changes in order, and all of an old epoch&#x27;s changes before any of a new epoch&#x27;s. This is called <em>primary order<\/em>.","full":"In ZooKeeper the leader executes each request and broadcasts the resulting state change. Raft and Paxos instead replicate the commands and let every replica execute them. The first is called <em>passive<\/em> replication, the second <em>active<\/em>. ZAB must deliver one leader&#x27;s changes in order, and all of an old epoch&#x27;s changes before any of a new epoch&#x27;s. This is called <em>primary order<\/em>."},{"title":"ZAB's three phases","first":"Each change carries a zxid = (epoch, counter), much like Raft&#x27;s (term, index). <em>Discovery<\/em>: a prospective leader learns the latest epoch and history from a quorum. <em>Synchronization<\/em>: it brings followers up to its history before broadcasting anything new.","rest":"Raft does this repair lazily, entry by entry, through AppendEntries. <em>Broadcast<\/em>: propose, collect acknowledgements from a quorum, commit. In steady state that is one round trip to a majority, the same as Raft.","full":"Each change carries a zxid = (epoch, counter), much like Raft&#x27;s (term, index). <em>Discovery<\/em>: a prospective leader learns the latest epoch and history from a quorum. <em>Synchronization<\/em>: it brings followers up to its history before broadcasting anything new. Raft does this repair lazily, entry by entry, through AppendEntries. <em>Broadcast<\/em>: propose, collect acknowledgements from a quorum, commit. In steady state that is one round trip to a majority, the same as Raft."},{"title":"KRaft is a Raft dialect","first":"It keeps terms (called epochs), votes and the up-to-date-log rule.","rest":"The main change: followers <em>pull<\/em> entries with fetch requests, the way Kafka followers already worked, instead of the leader pushing AppendEntries. The leader advances the commit point when a majority of voters have fetched past it.","full":"It keeps terms (called epochs), votes and the up-to-date-log rule. The main change: followers <em>pull<\/em> entries with fetch requests, the way Kafka followers already worked, instead of the leader pushing AppendEntries. The leader advances the commit point when a majority of voters have fetched past it."},{"title":"Evolution, in one system","first":"Kafka 4.0 (18 March 2025) removed ZooKeeper mode entirely; KRaft is now the only option.","rest":"Your two Kafka configurations are the old and new architecture of the same product, which fits the &quot;evolution&quot; in your thesis title.","full":"Kafka 4.0 (18 March 2025) removed ZooKeeper mode entirely; KRaft is now the only option. Your two Kafka configurations are the old and new architecture of the same product, which fits the &quot;evolution&quot; in your thesis title."}],"ideasExtra":[],"watch":{"h":"Watch (about 1 h)","items":[{"t":"ul","items":[{"html":"Jun Rao (Confluent), <em>Apache Kafka Internal Architecture<\/em> <a href=\"https://developer.confluent.io/courses/architecture/\" target=\"_blank\" rel=\"noopener noreferrer\">course<\/a>: the modules <a href=\"https://developer.confluent.io/courses/architecture/data-replication\" target=\"_blank\" rel=\"noopener noreferrer\">Data Plane: Replication Protocol<\/a> (12 min) and <em>The Apache Kafka Control Plane: ZooKeeper vs. KRaft<\/em>. Taught by one of Kafka&#x27;s creators.","text":"Jun Rao (Confluent), Apache Kafka Internal Architecture course: the modules Data Plane: Replication Protocol (12 min) and The Apache Kafka Control Plane: ZooKeeper vs. KRaft. Taught by one of Kafka's creators.","children":[]},{"html":"<em>Optional:<\/em> MIT 6.824 (2020), <a href=\"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB\" target=\"_blank\" rel=\"noopener noreferrer\">Lecture 8: Zookeeper<\/a> (in the course playlist). Good on ZooKeeper&#x27;s consistency model: linearizable writes, but reads that may be stale.","text":"Optional: MIT 6.824 (2020), Lecture 8: Zookeeper (in the course playlist). Good on ZooKeeper's consistency model: linearizable writes, but reads that may be stale.","children":[]}]}]},"play":{"h":"Play with it","items":[{"t":"ul","items":[{"html":"I found no trustworthy interactive simulator for ZAB or KRaft. KRaft is a Raft dialect, so RaftScope from Step 1 is the nearest stand-in. Remember the difference while you play: KRaft followers pull entries instead of having them pushed.","text":"I found no trustworthy interactive simulator for ZAB or KRaft. KRaft is a Raft dialect, so RaftScope from Step 1 is the nearest stand-in. Remember the difference while you play: KRaft followers pull entries instead of having them pushed.","children":[]}]}]},"read":{"h":"Read (about 1 h)","items":[{"t":"ul","items":[{"html":"<a href=\"https://cwiki.apache.org/confluence/display/KAFKA/KIP-595%3A+A+Raft+Protocol+for+the+Metadata+Quorum\" target=\"_blank\" rel=\"noopener noreferrer\">KIP-595: A Raft Protocol for the Metadata Quorum<\/a>. Read the motivation and the list of gaps between Kafka&#x27;s replication protocol and Raft. This is your primary source for KRaft.","text":"KIP-595: A Raft Protocol for the Metadata Quorum. Read the motivation and the list of gaps between Kafka's replication protocol and Raft. This is your primary source for KRaft.","children":[]},{"html":"Confluent documentation, <a href=\"https://docs.confluent.io/kafka/design/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Kafka Replication and Committed Messages<\/a>: ISR versus majority voting, in a few paragraphs.","text":"Confluent documentation, Kafka Replication and Committed Messages: ISR versus majority voting, in a few paragraphs.","children":[]},{"html":"Adrian Colyer&#x27;s <a href=\"https://blog.acolyer.org/2015/03/09/zab-high-performance-broadcast-for-primary-backup-systems/\" target=\"_blank\" rel=\"noopener noreferrer\">summary of the Zab paper<\/a>. Cite the original: Junqueira, Reed and Serafini, &quot;Zab: High-performance broadcast for primary-backup systems&quot; (DSN 2011).","text":"Adrian Colyer's summary of the Zab paper. Cite the original: Junqueira, Reed and Serafini, \"Zab: High-performance broadcast for primary-backup systems\" (DSN 2011).","children":[]},{"html":"<em>Optional, valuable for your comparison chapter:<\/em> van Renesse, Schiper and Schneider, <a href=\"https://arxiv.org/abs/1309.5671\" target=\"_blank\" rel=\"noopener noreferrer\">Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab<\/a> (IEEE TDSC, 2015). It shows exactly where these protocols differ, including active versus passive replication.","text":"Optional, valuable for your comparison chapter: van Renesse, Schiper and Schneider, Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab (IEEE TDSC, 2015). It shows exactly where these protocols differ, including active versus passive replication.","children":[]}]}]},"checks":["A Kafka producer with <code>acks=all<\/code> receives an acknowledgement. Which replicas have the message? Did ZAB or KRaft run on this write?","Replication factor 3, <code>min.insync.replicas=2<\/code>. One follower falls behind and leaves the ISR. Do writes continue? What risk have you accepted?","What does ZAB&#x27;s synchronization phase do that Raft does lazily?","Which of Raft and ZAB uses active replication, and which passive?","List the steps between a partition leader&#x27;s broker dying and producers succeeding again. Which step is a configured timeout?","How does KRaft&#x27;s replication differ from Raft&#x27;s AppendEntries?"],"write":{"h":"Write for the thesis (about 1.5 pages)","html":"Section <em>Consensus in Kafka<\/em>: the two planes, ISR replication, ZAB and its phases, KRaft as a Raft dialect, and the removal of ZooKeeper in Kafka 4.0. State plainly which layer your Kafka write latency measures and which layer your failover time measures. Then fill the ZAB and KRaft rows of the comparison table."}},{"n":4,"title":"EPaxos: leaderless consensus","hours":"about 5 h","h2":"Phase A · Step 4 — EPaxos: leaderless consensus (about 5 h)","intro":["EPaxos removes the single leader: every replica can order the commands it receives, and only conflicting commands need to be ordered at all. It is the hardest crash-fault protocol in your thesis, and the one whose published claims have been most disputed."],"outcomes":["Why a leader limits throughput, and what EPaxos does instead.","The fast path and the slow path, and what decides between them.","Why &quot;committed&quot; and &quot;executed&quot; are different moments in EPaxos.","What later studies found when they re-measured EPaxos."],"ideas":[{"title":"Why remove the leader","first":"In Raft and Multi-Paxos the leader sends every entry to every follower, so its network and CPU cap throughput.","rest":"Clients far from the leader also pay an extra hop. In EPaxos, whichever replica receives a command becomes that command&#x27;s leader.","full":"In Raft and Multi-Paxos the leader sends every entry to every follower, so its network and CPU cap throughput. Clients far from the leader also pay an extra hop. In EPaxos, whichever replica receives a command becomes that command&#x27;s leader."},{"title":"Only conflicts need ordering","first":"Two commands <em>conflict<\/em> if they touch the same key and at least one of them writes.","rest":"Commands that do not conflict commute, so replicas may apply them in any order. EPaxos therefore agrees, per command, on its <em>dependencies<\/em> (the conflicting commands it must follow) and a sequence number, not on a log slot.","full":"Two commands <em>conflict<\/em> if they touch the same key and at least one of them writes. Commands that do not conflict commute, so replicas may apply them in any order. EPaxos therefore agrees, per command, on its <em>dependencies<\/em> (the conflicting commands it must follow) and a sequence number, not on a log slot."},{"title":"Fast path","first":"The command leader sends PreAccept to a <em>fast quorum<\/em>.","rest":"Each member replies with the conflicting commands it knows about. If all replies agree, the command commits after one round trip (two message delays). The fast quorum has F + ⌊(F+1)/2⌋ replicas, where F is the number of failures tolerated. With 3 or 5 replicas that is simply a majority.","full":"The command leader sends PreAccept to a <em>fast quorum<\/em>. Each member replies with the conflicting commands it knows about. If all replies agree, the command commits after one round trip (two message delays). The fast quorum has F + ⌊(F+1)/2⌋ replicas, where F is the number of failures tolerated. With 3 or 5 replicas that is simply a majority."},{"title":"Slow path","first":"If the replies disagree, because replicas saw concurrent conflicting commands differently, the leader merges the dependencies and runs one Paxos-style accept round with a majority.","rest":"That costs a second round trip (four message delays in total).","full":"If the replies disagree, because replicas saw concurrent conflicting commands differently, the leader merges the dependencies and runs one Paxos-style accept round with a majority. That costs a second round trip (four message delays in total)."},{"title":"Commit is not execute","first":"To execute, a replica builds a graph of commands and their dependencies.","rest":"Concurrent conflicts can create cycles, so it finds the strongly connected components and orders each one by sequence number. A command can only run after everything it depends on has committed. So execution can lag behind commit, most visibly in the tail of the latency distribution.","full":"To execute, a replica builds a graph of commands and their dependencies. Concurrent conflicts can create cycles, so it finds the strongly connected components and orders each one by sequence number. A command can only run after everything it depends on has committed. So execution can lag behind commit, most visibly in the tail of the latency distribution."},{"title":"Failures without elections","first":"No replica is special, so a crash does not stop the whole system to elect a new leader.","rest":"Another replica <em>recovers<\/em> the failed replica&#x27;s unfinished commands, using ballots as in Paxos. Recovery is the most complex part of EPaxos and where correctness bugs were later found; a 2025 paper proposes a simpler variant with a rigorous proof.","full":"No replica is special, so a crash does not stop the whole system to elect a new leader. Another replica <em>recovers<\/em> the failed replica&#x27;s unfinished commands, using ballots as in Paxos. Recovery is the most complex part of EPaxos and where correctness bugs were later found; a 2025 paper proposes a simpler variant with a rigorous proof."},{"title":"What re-measurement found","first":"Tollman, Park and Ousterhout (NSDI 2021) showed that the original evaluation did not trigger the full cost of conflicts.","rest":"They confirmed EPaxos&#x27;s optimal median commit latency in a wide-area network, but found tail latency more than 4× worse than Multi-Paxos. The Paxi study (SIGMOD 2019) likewise found that EPaxos suffers as the conflict rate rises and can end up slower than Multi-Paxos.","full":"Tollman, Park and Ousterhout (NSDI 2021) showed that the original evaluation did not trigger the full cost of conflicts. They confirmed EPaxos&#x27;s optimal median commit latency in a wide-area network, but found tail latency more than 4× worse than Multi-Paxos. The Paxi study (SIGMOD 2019) likewise found that EPaxos suffers as the conflict rate rises and can end up slower than Multi-Paxos."},{"title":"What this means for your benchmark","first":"EPaxos had three goals: optimal wide-area latency, even load across replicas, and graceful degradation when replicas are slow or fail.","rest":"In a single-datacenter cluster the first one mostly disappears. The other two you can test. Your workload&#x27;s key distribution sets the conflict rate, so it directly shapes EPaxos&#x27;s results; report it.","full":"EPaxos had three goals: optimal wide-area latency, even load across replicas, and graceful degradation when replicas are slow or fail. In a single-datacenter cluster the first one mostly disappears. The other two you can test. Your workload&#x27;s key distribution sets the conflict rate, so it directly shapes EPaxos&#x27;s results; report it."}],"ideasExtra":[],"watch":{"h":"Watch (about 25 min)","items":[{"t":"ul","items":[{"html":"Sarah Tollman, <a href=\"https://www.usenix.org/conference/nsdi21/presentation/tollman\" target=\"_blank\" rel=\"noopener noreferrer\">EPaxos Revisited<\/a> (NSDI 2021). The talk video is on the USENIX page. It re-explains EPaxos briefly, then shows how the measurement method changed the conclusions. Note how it does this: it is a model for your own methodology chapter.","text":"Sarah Tollman, EPaxos Revisited (NSDI 2021). The talk video is on the USENIX page. It re-explains EPaxos briefly, then shows how the measurement method changed the conclusions. Note how it does this: it is a model for your own methodology chapter.","children":[]}]}]},"play":{"h":"Play with it (about 10 min)","items":[{"t":"ul","items":[{"html":"The <a href=\"https://sandeepkv93.github.io/distributed-systems-visualizer/consensus-variants/\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Variants visualizer<\/a> has an &quot;EPaxos Fast Path&quot; scenario, with speed and reset controls. It shows only the fast path: no conflicts, slow path or failures. I found nothing better for EPaxos, so use the paper&#x27;s figures for the slow path and execution.","text":"The Consensus Variants visualizer has an \"EPaxos Fast Path\" scenario, with speed and reset controls. It shows only the fast path: no conflicts, slow path or failures. I found nothing better for EPaxos, so use the paper's figures for the slow path and execution.","children":[]}]}]},"read":{"h":"Read (about 3 h)","items":[{"t":"ul","items":[{"html":"Moraru, Andersen and Kaminsky, <a href=\"https://www.cs.princeton.edu/courses/archive/spr25/cos418/papers/epaxos.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">There Is More Consensus in Egalitarian Parliaments<\/a> (SOSP 2013). Read the introduction, the protocol description (commit, execution and recovery) and look at the evaluation&#x27;s setup. Skip the proofs.","text":"Moraru, Andersen and Kaminsky, There Is More Consensus in Egalitarian Parliaments (SOSP 2013). Read the introduction, the protocol description (commit, execution and recovery) and look at the evaluation's setup. Skip the proofs.","children":[]},{"html":"Tollman, Park and Ousterhout, <em>EPaxos Revisited<\/em> (NSDI 2021), from the <a href=\"https://www.usenix.org/conference/nsdi21/presentation/tollman\" target=\"_blank\" rel=\"noopener noreferrer\">same USENIX page<\/a>. Read the sections on the original benchmarking method and its flaws. You will cite them in your methodology chapter.","text":"Tollman, Park and Ousterhout, EPaxos Revisited (NSDI 2021), from the same USENIX page. Read the sections on the original benchmarking method and its flaws. You will cite them in your methodology chapter.","children":[]},{"html":"<em>Optional:<\/em> Murat Demirbas&#x27;s <a href=\"https://muratbuffalo.blogspot.com/2019/07/dissecting-performance-bottlenecks-of.html\" target=\"_blank\" rel=\"noopener noreferrer\">summary of the Paxi paper<\/a>, which covers EPaxos and conflicts. The paper itself comes back in Step 8.","text":"Optional: Murat Demirbas's summary of the Paxi paper, which covers EPaxos and conflicts. The paper itself comes back in Step 8.","children":[]}]}]},"checks":["When do two commands need to be ordered relative to each other in EPaxos?","Why is one round trip enough
