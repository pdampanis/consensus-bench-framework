on the fast path?","What forces the slow path, and what does it cost?","Why can a command be committed but not yet executable?","You kill one replica of a 3-node EPaxos cluster. Do you expect an election pause like Raft&#x27;s? Why or why not?","Your benchmark runs in one datacenter. Which of EPaxos&#x27;s three goals can it test, and which can it not?"],"write":{"h":"Write for the thesis (about 2 pages)","html":"Section <em>Leaderless consensus: EPaxos<\/em>: motivation, conflicts and dependencies, the fast and slow paths, execution, recovery, and the critical findings of EPaxos Revisited and Paxi. Then fill the EPaxos row of the comparison table."}},{"n":5,"title":"Byzantine faults, 3f+1 and PBFT","hours":"about 6 h","h2":"Phase A · Step 5 — Byzantine faults, 3f+1 and PBFT (about 6 h)","intro":["PBFT (1999) is to Byzantine consensus what Paxos is to crash consensus: the ancestor that Tendermint and HotStuff improve on. It is not one of your seven systems, but it is the baseline your BFT chapter compares them against."],"outcomes":["What a Byzantine node can do that a crashed node cannot, and what stops it.","Why Byzantine consensus needs 3f+1 nodes even when the network eventually behaves.","PBFT&#x27;s three phases, and why it needs two rounds of voting.","What a view change is, and why PBFT&#x27;s is expensive."],"ideas":[{"title":"What changes with Byzantine nodes","first":"A faulty node can lie about its state, or <em>equivocate<\/em>: tell different nodes different things.","rest":"Signatures or message authentication codes stop it from forging others&#x27; messages, but not from lying in its own. So every decision rests on enough matching votes that at least one honest node vouches for it.","full":"A faulty node can lie about its state, or <em>equivocate<\/em>: tell different nodes different things. Signatures or message authentication codes stop it from forging others&#x27; messages, but not from lying in its own. So every decision rests on enough matching votes that at least one honest node vouches for it."},{"title":"The bound","first":"Under partial synchrony, Byzantine consensus needs n ≥ 3f+1 (Dwork, Lynch and Stockmeyer, 1988).","rest":"Recall the quorum argument from Step 0: quorums of 2f+1 overlap in f+1 nodes, so at least one honest node sits in every overlap. Roughgarden&#x27;s lecture proves the &quot;33%&quot; bound in about 15 minutes.","full":"Under partial synchrony, Byzantine consensus needs n ≥ 3f+1 (Dwork, Lynch and Stockmeyer, 1988). Recall the quorum argument from Step 0: quorums of 2f+1 overlap in f+1 nodes, so at least one honest node sits in every overlap. Roughgarden&#x27;s lecture proves the &quot;33%&quot; bound in about 15 minutes."},{"title":"Normal case: three phases","first":"The <em>primary<\/em> gives a client request a sequence number and sends PRE-PREPARE to all.","rest":"Each backup that accepts it sends PREPARE to all. A replica holding the pre-prepare plus 2f matching prepares is <em>prepared<\/em>, and sends COMMIT to all. With 2f+1 matching commits it executes the request and replies. The client waits for f+1 matching replies, so at least one comes from an honest replica.","full":"The <em>primary<\/em> gives a client request a sequence number and sends PRE-PREPARE to all. Each backup that accepts it sends PREPARE to all. A replica holding the pre-prepare plus 2f matching prepares is <em>prepared<\/em>, and sends COMMIT to all. With 2f+1 matching commits it executes the request and replies. The client waits for f+1 matching replies, so at least one comes from an honest replica."},{"title":"Why two voting rounds","first":"Pre-prepare plus prepare make sure that, within one view, no two different requests get the same sequence number, even if the primary lies.","rest":"Prepare plus commit make sure that a committed request keeps its number in every later view. The first round orders; the second makes the order survive a change of primary.","full":"Pre-prepare plus prepare make sure that, within one view, no two different requests get the same sequence number, even if the primary lies. Prepare plus commit make sure that a committed request keeps its number in every later view. The first round orders; the second makes the order survive a change of primary."},{"title":"The cost","first":"Every replica sends prepares and commits to every other, so messages grow with n².","rest":"Best-case latency is three message delays from the primary&#x27;s proposal, plus the client&#x27;s request and reply.","full":"Every replica sends prepares and commits to every other, so messages grow with n². Best-case latency is three message delays from the primary&#x27;s proposal, plus the client&#x27;s request and reply."},{"title":"View change","first":"Backups that suspect the primary (a timer expires) send VIEW-CHANGE messages carrying proof of what they have prepared.","rest":"The next primary, chosen as view number mod n, needs 2f+1 of them. It sends NEW-VIEW with that proof, and re-proposes anything that might have committed. Those proofs make view-change messages large, so the cost grows faster than n². PBFT keeps a <em>stable leader<\/em>: it changes primary only when it suspects a problem.","full":"Backups that suspect the primary (a timer expires) send VIEW-CHANGE messages carrying proof of what they have prepared. The next primary, chosen as view number mod n, needs 2f+1 of them. It sends NEW-VIEW with that proof, and re-proposes anything that might have committed. Those proofs make view-change messages large, so the cost grows faster than n². PBFT keeps a <em>stable leader<\/em>: it changes primary only when it suspects a problem."},{"title":"Same skeleton as Paxos","first":"A view is a ballot.","rest":"The view change is Phase 1: learn what may have been decided, then carry it forward. Cachin&#x27;s &quot;Yet Another Visit to Paxos&quot; builds both Paxos and PBFT from the same two abstractions, epoch-change and epoch consensus, which the textbook&#x27;s Chapter 5 also uses. That is the cleanest bridge between the two halves of your thesis.","full":"A view is a ballot. The view change is Phase 1: learn what may have been decided, then carry it forward. Cachin&#x27;s &quot;Yet Another Visit to Paxos&quot; builds both Paxos and PBFT from the same two abstractions, epoch-change and epoch consensus, which the textbook&#x27;s Chapter 5 also uses. That is the cleanest bridge between the two halves of your thesis."},{"title":"Practical tricks","first":"MACs instead of public-key signatures, batching many requests per sequence number, and periodic checkpoints so logs can be truncated.","rest":"These made PBFT &quot;practical&quot;: the paper reports a replicated NFS only 3% slower than an unreplicated one.","full":"MACs instead of public-key signatures, batching many requests per sequence number, and periodic checkpoints so logs can be truncated. These made PBFT &quot;practical&quot;: the paper reports a replicated NFS only 3% slower than an unreplicated one."},{"title":"An honest note for your thesis","first":"Your fault scenarios crash, partition or delay nodes; none makes a node lie.","rest":"So for CometBFT and HotStuff you will measure the <em>price<\/em> of Byzantine tolerance, not its benefit. Say so in your methodology.","full":"Your fault scenarios crash, partition or delay nodes; none makes a node lie. So for CometBFT and HotStuff you will measure the <em>price<\/em> of Byzantine tolerance, not its benefit. Say so in your methodology."}],"ideasExtra":[],"watch":{"h":"Watch (about 1.25 h)","items":[{"t":"ul","items":[{"html":"Tim Roughgarden, <em>Foundations of Blockchains<\/em> (Columbia, 2021), lectures <strong>6.1 The Partially Synchronous Model<\/strong> (41 min) and <strong>6.2 Proof of the 33% Impossibility Result<\/strong> (16 min). Find them on YouTube by those exact titles. The matching <a href=\"https://timroughgarden.org/f21/l6.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">lecture notes (PDF)<\/a> are a clean, citable write-up.","text":"Tim Roughgarden, Foundations of Blockchains (Columbia, 2021), lectures 6.1 The Partially Synchronous Model (41 min) and 6.2 Proof of the 33% Impossibility Result (16 min). Find them on YouTube by those exact titles. The matching lecture notes (PDF) are a clean, citable write-up.","children":[]},{"html":"For PBFT itself, page through Manos Kapritsos&#x27;s <a href=\"https://web.eecs.umich.edu/~manosk/assets/slides/f21/eecs591-lecture13-slides.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">lecture slides (University of Michigan)<\/a>. They animate the message flow step by step.","text":"For PBFT itself, page through Manos Kapritsos's lecture slides (University of Michigan). They animate the message flow step by step.","children":[]}]}]},"play":{"h":"Play with it (about 20 min)","items":[{"t":"ul","items":[{"html":"IIIT Hyderabad Virtual Labs, <a href=\"https://dsys2-iiith.vlabs.ac.in/exp/byzantine-failures-scenario/simulation/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">Byzantine Failures Simulation<\/a>, which simulates PBFT. Choose 4–12 nodes and how many are Byzantine (it keeps f &lt; n/3). Run it step by step or automatically, at 0.5× to 3× speed; step mode is how you pause. Try 4 nodes with 1 Byzantine, and count the prepare and commit messages.","text":"IIIT Hyderabad Virtual Labs, Byzantine Failures Simulation, which simulates PBFT. Choose 4–12 nodes and how many are Byzantine (it keeps f < n/3). Run it step by step or automatically, at 0.5× to 3× speed; step mode is how you pause. Try 4 nodes with 1 Byzantine, and count the prepare and commit messages.","children":[]},{"html":"The PBFT simulator on <a href=\"https://yoichiozaki.github.io/en/blog/consensus-algorithms\" target=\"_blank\" rel=\"noopener noreferrer\">this page<\/a> has a &quot;Too Many Byzantine Nodes&quot; scenario that shows the 3f+1 bound failing.","text":"The PBFT simulator on this page has a \"Too Many Byzantine Nodes\" scenario that shows the 3f+1 bound failing.","children":[]}]}]},"read":{"h":"Read (about 3 h)","items":[{"t":"ul","items":[{"html":"Castro and Liskov, <a href=\"https://pmg.csail.mit.edu/papers/osdi99.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Practical Byzantine Fault Tolerance<\/a> (OSDI 1999). Read <strong>§2–§4<\/strong>: system model, service properties, the algorithm (normal case, garbage collection, view change). Skim §5 (optimizations). Skip the implementation sections.","text":"Castro and Liskov, Practical Byzantine Fault Tolerance (OSDI 1999). Read §2–§4: system model, service properties, the algorithm (normal case, garbage collection, view change). Skim §5 (optimizations). Skip the implementation sections.","children":[]},{"html":"Decentralized Thoughts, <a href=\"https://decentralizedthoughts.github.io/2025-02-14-PBFT\" target=\"_blank\" rel=\"noopener noreferrer\">PBFT<\/a> (2025). A modern presentation built on certificates. It sets up Steps 6 and 7.","text":"Decentralized Thoughts, PBFT (2025). A modern presentation built on certificates. It sets up Steps 6 and 7.","children":[]},{"html":"<em>Optional, the bridge:<\/em> Christian Cachin, <a href=\"https://dominoweb.draco.res.ibm.com/reports/rz3754.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Yet Another Visit to Paxos<\/a> (IBM Research report, 2009, 20 pages), or the Byzantine consensus sections of Chapter 5 of the Cachin, Guerraoui and Rodrigues book, which present the same idea.","text":"Optional, the bridge: Christian Cachin, Yet Another Visit to Paxos (IBM Research report, 2009, 20 pages), or the Byzantine consensus sections of Chapter 5 of the Cachin, Guerraoui and Rodrigues book, which present the same idea.","children":[]},{"html":"<em>Cite:<\/em> Lamport, Shostak and Pease, &quot;The Byzantine Generals Problem&quot; (ACM TOPLAS, 1982).","text":"Cite: Lamport, Shostak and Pease, \"The Byzantine Generals Problem\" (ACM TOPLAS, 1982).","children":[]}]}]},"checks":["Why does a PBFT client wait for f+1 matching replies, not just one?","A replica holds a pre-prepare and 2f matching prepares. What does it know? Why is that not yet enough to execute?","Why does PBFT need two rounds of voting after the pre-prepare?","What must the new primary put in NEW-VIEW, and what could go wrong without it?","How does the number of messages per request grow as you add replicas?"],"write":{"h":"Write for the thesis (about 2 pages)","html":"Section <em>Byzantine fault tolerance and PBFT<\/em>: the Byzantine model, the 3f+1 bound, the three phases, the view change, and the link to Paxos. Add the sentence from point 9 to your methodology notes. Then fill the PBFT row of the comparison table, marked as a reference protocol, not benchmarked."}},{"n":6,"title":"Tendermint / CometBFT","hours":"about 4 h","h2":"Phase A · Step 6 — Tendermint / CometBFT (about 4 h)","intro":["Tendermint keeps PBFT&#x27;s quorums and two voting rounds, but rotates the proposer and folds the view change into ordinary rounds. It pays for that simplicity with timeouts, which is exactly what your benchmark will see."],"outcomes":["Heights, rounds and the three steps: propose, prevote, precommit.","What a lock is, and why Tendermint needs one.","Why Tendermint has no separate view change, and what that costs.","Why CometBFT&#x27;s latency depends so much on its configuration."],"ideas":[{"title":"Heights and rounds","first":"Each block is one consensus instance, called a <em>height<\/em>.","rest":"A height may take several <em>rounds<\/em>. Each round has a proposer chosen deterministically, by weighted round-robin over the validators&#x27; voting power. So the leader rotates.","full":"Each block is one consensus instance, called a <em>height<\/em>. A height may take several <em>rounds<\/em>. Each round has a proposer chosen deterministically, by weighted round-robin over the validators&#x27; voting power. So the leader rotates."},{"title":"Three steps per round","first":"<em>Propose<\/em>: the proposer broadcasts a block. <em>Prevote<\/em>: each validator votes for that block, or for nil if it saw nothing valid in time. <em>Precommit<\/em>: a validator that sees more than two-thirds of prevotes for block B precommits B.","rest":"More than two-thirds of precommits for B commits B, and the next height begins.","full":"<em>Propose<\/em>: the proposer broadcasts a block. <em>Prevote<\/em>: each validator votes for that block, or for nil if it saw nothing valid in time. <em>Precommit<\/em>: a validator that sees more than two-thirds of prevotes for block B precommits B. More than two-thirds of precommits for B commits B, and the next height begins."},{"title":"Polka and lock","first":"More than two-thirds of prevotes for B in a round is called a <em>polka<\/em> (proof of lock change).","rest":"A validator that precommits B also <em>locks<\/em> on B. In later rounds it prevotes only B, unless it sees a polka for another block in a later round. The lock plays the role of PBFT&#x27;s prepared certificate: it keeps a possibly committed block from being replaced.","full":"More than two-thirds of prevotes for B in a round is called a <em>polka<\/em> (proof of lock change). A validator that precommits B also <em>locks<\/em> on B. In later rounds it prevotes only B, unless it sees a polka for another block in a later round. The lock plays the role of PBFT&#x27;s prepared certificate: it keeps a possibly committed block from being replaced."},{"title":"No separate view change","first":"If a round fails, everyone moves to the next round with the next proposer.","rest":"The new proposer does not collect a 2f+1-sized proof of everyone&#x27;s locks, as PBFT&#x27;s new primary does. Instead, honest validators wait long enough for the highest lock to reach the proposer. That wait is a timeout tied to the maximum network delay. So Tendermint is not <em>responsive<\/em>: after a bad round it moves at the speed of its timeouts, not of the actual network.","full":"If a round fails, everyone moves to the next round with the next proposer. The new proposer does not collect a 2f+1-sized proof of everyone&#x27;s locks, as PBFT&#x27;s new primary does. Instead, honest validators wait long enough for the highest lock to reach the proposer. That wait is a timeout tied to the maximum network delay. So Tendermint is not <em>responsive<\/em>: after a bad round it moves at the speed of its timeouts, not of the actual network."},{"title":"Timeouts that grow","first":"Each step has a timeout, and the timeouts grow with every round of the same height.","rest":"After GST, they eventually exceed the real message delay, which guarantees liveness under partial synchrony.","full":"Each step has a timeout, and the timeouts grow with every round of the same height. After GST, they eventually exceed the real message delay, which guarantees liveness under partial synchrony."},{"title":"Gossip","first":"Validators are not all directly connected; proposals and votes spread through peer-to-peer gossip.","rest":"Votes still go all-to-all in effect, so communication grows roughly with n².","full":"Validators are not all directly connected; proposals and votes spread through peer-to-peer gossip. Votes still go all-to-all in effect, so communication grows roughly with n²."},{"title":"Immediate finality","first":"Once a block commits, it is final.","rest":"Unlike longest-chain protocols such as Bitcoin, there is no rollback.","full":"Once a block commits, it is final. Unlike longest-chain protocols such as Bitcoin, there is no rollback."},{"title":"What this means for your benchmark","first":"A transaction first waits in the mempool to be included in the next block.","rest":"That block then needs its three steps. CometBFT also pauses after each commit before starting the next height (<code>timeout_commit<\/code> in the 0.38 config). So write latency has a floor set by the block interval, and throughput is set by block size and block interval. Killing a validator costs roughly one propose timeout in each round where it would have proposed, not a leader election.","full":"A transaction first waits in the mempool to be included in the next block. That block then needs its three steps. CometBFT also pauses after each commit before starting the next height (<code>timeout_commit<\/code> in the 0.38 config). So write latency has a floor set by the block interval, and throughput is set by block size and block interval. Killing a validator costs roughly one propose timeout in each round where it would have proposed, not a leader election."}],"ideasExtra":[],"watch":{"h":"Watch (about 1 h)","items":[{"t":"ul","items":[{"html":"Tim Roughgarden, <em>Foundations of Blockchains<\/em>, lectures <strong>7.1 Tendermint (High-Level Ideas)<\/strong> (19 min) and <strong>7.2 The Tendermint Protocol<\/strong> (40 min); find them on YouTube by those titles. <a href=\"https://timroughgarden.github.io/fob21/slides/F21L7.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Slides (PDF)<\/a>. <em>Optional:<\/em> 7.3 Proof of Consistency and 7.4 Proof of Liveness.","text":"Tim Roughgarden, Foundations of Blockchains, lectures 7.1 Tendermint (High-Level Ideas) (19 min) and 7.2 The Tendermint Protocol (40 min); find them on YouTube by those titles. Slides (PDF). Optional: 7.3 Proof of Consistency and 7.4 Proof of Liveness.","children":[]}]}]},"play":{"h":"Play with it","items":[{"t":"ul","items":[{"html":"I found no hosted interactive Tendermint simulator. <a href=\"https://github.com/kevlubkcm/tenderflow\" target=\"_blank\" rel=\"noopener noreferrer\">tenderflow<\/a> is a Tendermint visualizer that you would have to build locally; I have not tried it. Roughgarden&#x27;s lecture 7.2 slides (above) step through rounds and locks, and are the better use of your time.","text":"I found no hosted interactive Tendermint simulator. tenderflow is a Tendermint visualizer that you would have to build locally; I have not tried it. Roughgarden's lecture 7.2 slides (above) step through rounds and locks, and are the better use of your time.","children":[]}]}]},"read":{"h":"Read (about 1.5 h)","items":[{"t":"ul","items":[{"html":"Buchman, Kwon and Milosevic, <a href=\"https://arxiv.org/abs/1807.04938\" target=\"_blank\" rel=\"noopener noreferrer\">The latest gossip on BFT consensus<\/a> (2018). This is the current Tendermint algorithm. Its pseudocode fits on one page; read it slowly, alongside the text that explains it.","text":"Buchman, Kwon and Milosevic, The latest gossip on BFT consensus (2018). This is the current Tendermint algorithm. Its pseudocode fits on one page; read it slowly, alongside the text that explains it.","children":[]},{"html":"CometBFT specification, <a href=\"https://docs.cosmos.network/cometbft/next/spec/consensus/Byzantine-Consensus-Algorithm\" target=\"_blank\" rel=\"noopener noreferrer\">Byzantine Consensus Algorithm<\/a>: the same algorithm as implemented, with the exact step and timeout rules.","text":"CometBFT specification, Byzantine Consensus Algorithm: the same algorithm as implemented, with the exact step and timeout rules.","children":[]},{"html":"Decentralized Thoughts, <a href=\"https://decentralizedthoughts.github.io/2019-06-23-what-is-the-difference-between\" target=\"_blank\" rel=\"noopener noreferrer\">What is the difference between PBFT, Tendermint, SBFT and HotStuff?<\/a> (2019). Short, with a comparison table of latency, communication and responsiveness. Add its columns to your own table.","text":"Decentralized Thoughts, What is the difference between PBFT, Tendermint, SBFT and HotStuff? (2019). Short, with a comparison table of latency, communication and responsiveness. Add its columns to your own table.","children":[]},{"html":"<em>Optional:<\/em> Ethan Buchman&#x27;s MSc thesis, <em>Tendermint: Byzantine Fault Tolerance in the Age of Blockchains<\/em> (University of Guelph, 2016), for background. Note that Cachin and Vukolić, <a href=\"https://arxiv.org/abs/1707.01873\" target=\"_blank\" rel=\"noopener noreferrer\">Blockchain Consensus Protocols in the Wild<\/a> (2017), found a liveness problem in that earlier version; the 2018 paper is the corrected algorithm.","text":"Optional: Ethan Buchman's MSc thesis, Tendermint: Byzantine Fault Tolerance in the Age of Blockchains (University of Guelph, 2016), for background. Note that Cachin and Vukolić, Blockchain Consensus Protocols in the Wild (2017), found a liveness problem in that earlier version; the 2018 paper is the corrected algorithm.","children":[]}]}]},"checks":["What is a polka, and what does a validator do when it sees one?","Why does Tendermint need locks? What could go wrong without them?","How does Tendermint change proposer, and what does it give up compared with PBFT&#x27;s view change?","Why do the timeouts grow with every round?","You crash one of 4 CometBFT validators. What happens in the rounds where it would propose? Does the chain stop?","Why might CometBFT&#x27;s write latency be set more by its configuration than by the network?"],"write":{"h":"Write for the thesis (about 1.5 pages)","html":"Section <em>Tendermint and CometBFT<\/em>: heights and rounds, the three steps, locking, the round-based view change and its lack of responsiveness, growing timeouts, gossip and finality. Note which configuration settings bound latency and throughput. Then fill the Tendermint row of the comparison table."}},{"n":7,"title":"HotStuff","hours":"about 5 h","h2":"Phase A · Step 7 — HotStuff (about 5 h)","intro":["HotStuff (2019) is the first partially synchronous BFT protocol that is both linear and optimistically responsive. PBFT was responsive but expensive to change leaders; Tendermint was cheap to change leaders but waits on timeouts. HotStuff pays for having both with one extra voting phase."],"outcomes":["The two properties HotStuff combines, and which predecessor had each.","What a quorum certificate is, and why it makes each phase linear.","The hidden-lock problem, and why the extra phase solves it.","Chained HotStuff and its three-chain commit rule, and what 2-chain variants change."],"ideas":[{"title":"The trade-off HotStuff breaks","first":"<em>Optimistically responsive<\/em> means that, once the network behaves, progress runs at the speed of actual message delays, not of a worst-case timeout. <em>Linear<\/em> means a correct leader, including a newly installed one, sends only O(n) authenticators to reach a decision.","rest":"PBFT was responsive but not linear. Tendermint and Casper changed leaders at linear cost but were not responsive; their normal-case voting is still O(n²).","full":"<em>Optimistically responsive<\/em> means that, once the network behaves, progress runs at the speed of actual message delays, not of a worst-case timeout. <em>Linear<\/em> means a correct leader, including a newly installed one, sends only O(n) authenticators to reach a decision. PBFT was responsive but not linear. Tendermint and Casper changed leaders at linear cost but were not responsive; their normal-case voting is still O(n²)."},{"title":"Votes go to the leader","first":"Instead of all-to-all voting, replicas send votes only to the leader.","rest":"The leader combines 2f+1 votes into a <em>quorum certificate<\/em> (QC) and sends it out. With threshold signatures a QC is one constant-size signature, so each phase costs O(n) messages.","full":"Instead of all-to-all voting, replicas send votes only to the leader. The leader combines 2f+1 votes into a <em>quorum certificate<\/em> (QC) and sends it out. With threshold signatures a QC is one constant-size signature, so each phase costs O(n) messages."},{"title":"Basic HotStuff's phases","first":"Prepare, pre-commit, commit and decide.","rest":"Each is one leader-to-replicas-to-leader round that produces a QC. A replica <em>locks<\/em> when it sees the pre-commit QC and executes when it sees the commit QC.","full":"Prepare, pre-commit, commit and decide. Each is one leader-to-replicas-to-leader round that produces a QC. A replica <em>locks<\/em> when it sees the pre-commit QC and executes when it sees the commit QC."},{"title":"The hidden-lock problem","first":"In a two-phase protocol, some honest replica may be locked on a value the new leader has not heard of.","rest":"If the leader proposes something else, that replica refuses to vote, and the view can stall. Tendermint avoids this by having the leader wait for the maximum network delay. HotStuff adds one phase before locking, so that any lock is backed by a QC that enough replicas already hold. The new leader then simply picks the highest QC it receives from n−f replicas, with no fixed wait.","full":"In a two-phase protocol, some honest replica may be locked on a value the new leader has not heard of. If the leader proposes something else, that replica refuses to vote, and the view can stall. Tendermint avoids this by having the leader wait for the maximum network delay. HotStuff adds one phase before locking, so that any lock is backed by a QC that enough replicas already hold. The new leader then simply picks the highest QC it receives from n−f replicas, with no fixed wait."},{"title":"Chained HotStuff","first":"Because every phase has the same shape (propose, vote, QC), phases can be pipelined.","rest":"Each new block&#x27;s QC also serves as the next phase for the blocks before it. A block commits when three consecutive blocks on top of it carry QCs: the <em>three-chain rule<\/em>. The leader can rotate on every block at no extra cost.","full":"Because every phase has the same shape (propose, vote, QC), phases can be pipelined. Each new block&#x27;s QC also serves as the next phase for the blocks before it. A block commits when three consecutive blocks on top of it carry QCs: the <em>three-chain rule<\/em>. The leader can rotate on every block at no extra cost."},{"title":"The pacemaker","first":"Safety lives in the voting rules.","rest":"Liveness comes from a separate module, the <em>pacemaker<\/em>, that keeps replicas moving through views with timeouts. In HotStuff the two concerns are cleanly separated.","full":"Safety lives in the voting rules. Liveness comes from a separate module, the <em>pacemaker<\/em>, that keeps replicas moving through views with timeouts. In HotStuff the two concerns are cleanly separated."},{"title":"The price, and the follow-ups","first":"The extra phase means more message delays per decision than PBFT.","rest":"Jolteon (2021) and DiemBFT v4 use a <em>2-chain<\/em> commit rule, cutting steady-state latency by about 30%, but go back to a quadratic view change. HotStuff-2 (2023) shows two phases suffice while keeping linearity in good cases; it waits a fixed delay only on a &quot;bad day&quot;.","full":"The extra phase means more message delays per decision than PBFT. Jolteon (2021) and DiemBFT v4 use a <em>2-chain<\/em> commit rule, cutting steady-state latency by about 30%, but go back to a quadratic view change. HotStuff-2 (2023) shows two phases suffice while keeping linearity in good cases; it waits a fixed delay only on a &quot;bad day&quot;."},{"title":"What this means for your benchmark","first":"If your HotStuff is the asonnino/hotstuff Rust implementation, which its log analyzer suggests, it implements the 2-chain variant, not the three-chain protocol of the PODC paper.","rest":"Confirm this in Phase B and name the variant in the thesis. Also, linear versus quadratic communication barely differs at 4 replicas. Only an experiment that varies cluster size can show it, and scalability is one of your stated criteria.","full":"If your HotStuff is the asonnino/hotstuff Rust implementation, which its log analyzer suggests, it implements the 2-chain variant, not the three-chain protocol of the PODC paper. Confirm this in Phase B and name the variant in the thesis. Also, linear versus quadratic communication barely differs at 4 replicas. Only an experiment that varies cluster size can show it, and scalability is one of your stated criteria."}],"ideasExtra":[],"watch":{"h":"Watch (about 1 h)","items":[{"t":"ul","items":[{"html":"Murat Demirbas&#x27;s <a href=\"https://muratbuffalo.blogspot.com/2019/12/hotstuff-bft-consensus-in-lens-of.html\" target=\"_blank\" rel=\"noopener noreferrer\">post on HotStuff<\/a> embeds a lecture by Ittai Abraham, one of HotStuff&#x27;s authors, on the hidden-lock problem and the protocol. Watch the lecture, then read the post.","text":"Murat Demirbas's post on HotStuff embeds a lecture by Ittai Abraham, one of HotStuff's authors, on the hidden-lock problem and the protocol. Watch the lecture, then read the post.","children":[]}]}]},"play":{"h":"Play with it (optional, on your laptop)","items":[{"t":"ul","items":[{"html":"I found no hosted HotStuff simulator. Two local options, neither tried by me:","text":"I found no hosted HotStuff simulator. Two local options, neither tried by me:","children":[{"html":"<a href=\"https://github.com/edgedlt/hotstuff2\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuff-2 demo<\/a>: run <code>go run demo/main.go<\/code> and open localhost:8080. It shows nodes and messages live, lets you crash nodes and create partitions, and runs 4–16 nodes. It runs HotStuff-2, not the 2019 protocol.","text":"HotStuff-2 demo: run go run demo/main.go and open localhost:8080. It shows nodes and messages live, lets you crash nodes and create partitions, and runs 4–16 nodes. It runs HotStuff-2, not the 2019 protocol.","children":[]},{"html":"<a href=\"https://github.com/csienslab/BFT-Simulator\" target=\"_blank\" rel=\"noopener noreferrer\">BFT Simulator<\/a> (National Taiwan University, DSN 2022): runs PBFT, HotStuff and LibraBFT, including under a network-partitioning attacker, and plots the traces. Not interactive, but good for seeing leader changes under attack.","text":"BFT Simulator (National Taiwan University, DSN 2022): runs PBFT, HotStuff and LibraBFT, including under a network-partitioning attacker, and plots the traces. Not interactive, but good for seeing leader changes under attack.","children":[]}],"childKind":"bullet"}]}]},"read":{"h":"Read (about 2.5 h)","items":[{"t":"ul","items":[{"html":"Yin, Malkhi, Reiter, Golan Gueta and Abraham, <a href=\"https://arxiv.org/abs/1803.05069\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuff: BFT Consensus in the Lens of Blockchain<\/a> (PODC 2019). Read the introduction and its comparison table, Basic HotStuff and Chained HotStuff. Then the section that casts DLS, PBFT, Tendermint and Casper in the same framework: it is ready-made structure for your BFT chapter.","text":"Yin, Malkhi, Reiter, Golan Gueta and Abraham, HotStuff: BFT Consensus in the Lens of Blockchain (PODC 2019). Read the introduction and its comparison table, Basic HotStuff and Chained HotStuff. Then the section that casts DLS, PBFT, Tendermint and Casper in the same framework: it is ready-made structure for your BFT chapter.","children":[]},{"html":"Decentralized Thoughts, <a href=\"https://decentralizedthoughts.github.io/2023-04-01-hotstuff-2\" target=\"_blank\" rel=\"noopener noreferrer\">What is the difference between PBFT, Tendermint, HotStuff, and HotStuff-2?<\/a> (2023). It ties Steps 5–7 together around one question: how a new leader learns the locks.","text":"Decentralized Thoughts, What is the difference between PBFT, Tendermint, HotStuff, and HotStuff-2? (2023). It ties Steps 5–7 together around one question: how a new leader learns the locks.","children":[]},{"html":"<em>Optional:<\/em> Gelashvili et al., <a href=\"https://arxiv.org/abs/2106.10362\" target=\"_blank\" rel=\"noopener noreferrer\">Jolteon and Ditto<\/a> (2021), for the 2-chain variant your implementation likely uses. Malkhi and Yin, <a href=\"https://arxiv.org/abs/2305.13556\" target=\"_blank\" rel=\"noopener noreferrer\">Lessons from HotStuff<\/a> (2023), for the family&#x27;s evolution since.","text":"Optional: Gelashvili et al., Jolteon and Ditto (2021), for the 2-chain variant your implementation likely uses. Malkhi and Yin, Lessons from HotStuff (2023), for the family's evolution since.","children":[]}]}]},"checks":["Which two properties does HotStuff combine, and which earlier protocol had each one?","What is a QC, and why does it make each phase linear?","What is the hidden-lock problem, and how does HotStuff&#x27;s extra phase fix it?","In chained HotStuff, when exactly does a block commit?","A 2-chain variant removes one phase. What does it save, and what does it pay?","With 4 replicas, can your benchmark show HotStuff&#x27;s linear communication? What experiment would?"],"write":{"h":"Write for the thesis (about 2 pages)","html":"Section <em>HotStuff and its variants<\/em>: responsiveness and linearity, QCs, the phases, the hidden-lock problem, chaining and the three-chain rule, the pacemaker, and the 2-chain and HotStuff-2 follow-ups. Close the BFT chapter with the evolution PBFT → Tendermint → HotStuff → 2-chain variants as one connected story. Then fill the HotStuff row of the comparison table."}},{"n":8,"title":"How to compare and measure protocols","hours":"about 4 h","h2":"Phase A · Step 8 — How to compare and measure protocols (about 4 h)","intro":["This step turns Steps 0–7 into testable predictions and a defensible method. Your abstract names four criteria: consensus latency, throughput, fault tolerance and scalability. Each needs a precise, measurable definition before you run anything."],"outcomes":["How each of your four criteria is defined and measured.","Why latency is a distribution, and why tails rise sharply near saturation.","What coordinated omission is, and why open-loop load avoids it.","Which differences between your seven systems are about the protocol, and which are about the implementation or its settings."],"ideas":[{"title":"Latency is a distribution","first":"Report percentiles (p50, p99, p99.9), not a mean.","rest":"Never average percentiles across runs; merge the underlying histograms instead. Define precisely when the clock starts and stops, per system.","full":"Report percentiles (p50, p99, p99.9), not a mean. Never average percentiles across runs; merge the underlying histograms instead. Define precisely when the clock starts and stops, per system."},{"title":"Throughput only means something with latency beside it","first":"As offered load rises, latency stays flat, then climbs steeply near capacity, because requests queue at the bottleneck (usually the leader).","rest":"Report the latency–throughput curve, not one number.","full":"As offered load rises, latency stays flat, then climbs steeply near capacity, because requests queue at the bottleneck (usually the leader). Report the latency–throughput curve, not one number."},{"title":"A simple model explains the curve","first":"The Paxi paper models latency as queueing wait + service time at the leader + network round trip to the quorum.","rest":"Service time grows with the number of messages the leader handles per request. Near capacity the wait term dominates and latency explodes.","full":"The Paxi paper models latency as queueing wait + service time at the leader + network round trip to the quorum. Service time grows with the number of messages the leader handles per request. Near capacity the wait term dominates and latency explodes."},{"title":"Predict from the protocol, then measure","first":"From the comparison table: Raft, Multi-Paxos, ZAB and KRaft need one round trip to a majority; EPaxos one or two; PBFT and Tendermint three message delays; HotStuff more.","rest":"Inside one datacenter a round trip is typically well under a millisecond. So disk flushes, signature checks, batching and configured intervals often outweigh the message count. Write your predictions down before the runs; where results differ, explain why. That explanation is your analysis chapter.","full":"From the comparison table: Raft, Multi-Paxos, ZAB and KRaft need one round trip to a majority; EPaxos one or two; PBFT and Tendermint three message delays; HotStuff more. Inside one datacenter a round trip is typically well under a millisecond. So disk flushes, signature checks, batching and configured intervals often outweigh the message count. Write your predictions down before the runs; where results differ, explain why. That explanation is your analysis chapter."},{"title":"Open versus closed load","first":"A closed-loop client sends the next request only after the last reply, so when the system slows down, the load drops with it.","rest":"An open-loop client sends on a fixed schedule regardless. Schroeder et al. show the two give significantly different results even at the same average load.","full":"A closed-loop client sends the next request only after the last reply, so when the system slows down, the load drops with it. An open-loop client sends on a fixed schedule regardless. Schroeder et al. show the two give significantly different results even at the same average load."},{"title":"Coordinated omission","first":"If the system freezes for 1 s while a closed-loop client waits, the client records one slow request, though at 1,000 ops/s about 1,000 requests should have been delayed.","rest":"The measurement hides exactly the bad moments, and the tail looks far better than it is. The fix: measure each request from when it <em>should<\/em> have been sent.","full":"If the system freezes for 1 s while a closed-loop client waits, the client records one slow request, though at 1,000 ops/s about 1,000 requests should have been delayed. The measurement hides exactly the bad moments, and the tail looks far better than it is. The fix: measure each request from when it <em>should<\/em> have been sent."},{"title":"Same meaning of \"done\" for every system","first":"Write a table of what each system&#x27;s acknowledgement means: Raft commit, Kafka ISR acknowledgement, CometBFT block commit, Paxi&#x27;s reply after execution, HotStuff&#x27;s commit as its logs report it.","rest":"Where they differ, say so; that difference is part of your result.","full":"Write a table of what each system&#x27;s acknowledgement means: Raft commit, Kafka ISR acknowledgement, CometBFT block commit, Paxi&#x27;s reply after execution, HotStuff&#x27;s commit as its logs report it. Where they differ, say so; that difference is part of your result."},{"title":"Fairness traps to name","first":"<em>Durability<\/em>: etcd flushes to disk before acknowledging, while Kafka by default relies on replication and does not flush each message to disk synchronously. <em>Cluster size<\/em>: the BFT systems run 4 nodes, the crash-fault systems 3. <em>Fixed intervals<\/em>: CometBFT&#x27;s block interval sets a latency floor. <em>Implementations<\/em>: you measure etcd&#x27;s Raft, not Raft.","rest":"State each one rather than hide it.","full":"<em>Durability<\/em>: etcd flushes to disk before acknowledging, while Kafka by default relies on replication and does not flush each message to disk synchronously. <em>Cluster size<\/em>: the BFT systems run 4 nodes, the crash-fault systems 3. <em>Fixed intervals<\/em>: CometBFT&#x27;s block interval sets a latency floor. <em>Implementations<\/em>: you measure etcd&#x27;s Raft, not Raft. State each one rather than hide it."},{"title":"Fault tolerance has two halves","first":"The theoretical half is the f a cluster of n survives (Step 0).","rest":"The measured half is behaviour under a fault: time until writes succeed again, the throughput dip and the latency spike, and whether the fault actually happened (verify it in your logs).","full":"The theoretical half is the f a cluster of n survives (Step 0). The measured half is behaviour under a fault: time until writes succeed again, the throughput dip and the latency spike, and whether the fault actually happened (verify it in your logs)."},{"title":"Scalability needs a second axis","first":"Only runs at several cluster sizes can show how latency and throughput change with n, and that is where HotStuff&#x27;s linear communication should pay off.","rest":"If time allows only one size, say plainly that scalability is argued from theory, not measured.","full":"Only runs at several cluster sizes can show how latency and throughput change with n, and that is where HotStuff&#x27;s linear communication should pay off. If time allows only one size, say plainly that scalability is argued from theory, not measured."},{"title":"Hygiene","first":"Discard a warm-up period, repeat each configuration several times, report the spread between runs, and randomize run order so that time-of-day effects do not line up with one system.","rest":"","full":"Discard a warm-up period, repeat each configuration several times, report the spread between runs, and randomize run order so that time-of-day effects do not line up with one system."}],"ideasExtra":[],"watch":{"h":"Watch (about 45 min)","items":[{"t":"ul","items":[{"html":"Gil Tene, <em>How NOT to Measure Latency<\/em>. Not optional: he named coordinated omission. Several recordings exist; search YouTube for the title (the Strange Loop recording runs about 43 minutes). <a href=\"https://videog.infoq.com/downloads/pdfdownloads/presentations/QConSF2015-GilTene-HowNOTtomeasureLatency.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Slides from QCon San Francisco 2015 (PDF)<\/a>.","text":"Gil Tene, How NOT to Measure Latency. Not optional: he named coordinated omission. Several recordings exist; search YouTube for the title (the Strange Loop recording runs about 43 minutes). Slides from QCon San Francisco 2015 (PDF).","children":[]}]}]},"read":{"h":"Read (about 2 h)","items":[{"t":"ul","items":[{"html":"Ailijiang, Charapko and Demirbas, <a href=\"https://cse.buffalo.edu/~demirbas/publications/dissecting.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Dissecting the Performance of Strongly-Consistent Replication Protocols<\/a> (SIGMOD 2019). It introduces Paxi, the framework behind your Paxos and EPaxos. Read the analytical model and the LAN results. It is the closest prior work to your thesis: anchor your related-work chapter on it.","text":"Ailijiang, Charapko and Demirbas, Dissecting the Performance of Strongly-Consistent Replication Protocols (SIGMOD 2019). It introduces Paxi, the framework behind your Paxos and EPaxos. Read the analytical model and the LAN results. It is the closest prior work to your thesis: anchor your related-work chapter on it.","children":[]},{"html":"Schroeder, Wierman and Harchol-Balter, <a href=\"http://usenix.org/events/nsdi06/tech/full_papers/schroeder/schroeder.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Open Versus Closed: A Cautionary Tale<\/a> (NSDI 2006). Introduction and the eight principles.","text":"Schroeder, Wierman and Harchol-Balter, Open Versus Closed: A Cautionary Tale (NSDI 2006). Introduction and the eight principles.","children":[]},{"html":"Re-read the methodology critique in <em>EPaxos Revisited<\/em> (Step 4) with your own benchmark in mind.","text":"Re-read the methodology critique in EPaxos Revisited (Step 4) with your own benchmark in mind.","children":[]},{"html":"<em>Optional, the BFT counterpart of Paxi:<\/em> Gai et al., <a href=\"https://arxiv.org/abs/2103.00777\" target=\"_blank\" rel=\"noopener noreferrer\">Dissecting the Performance of Chained-BFT<\/a> (ICDCS 2021). It compares HotStuff, 2-chain HotStuff and Streamlet in one framework, with a queueing model.","text":"Optional, the BFT counterpart of Paxi: Gai et al., Dissecting the Performance of Chained-BFT (ICDCS 2021). It compares HotStuff, 2-chain HotStuff and Streamlet in one framework, with a queueing model.","children":[]}]}]},"checks":["Why report percentiles, and why never average them across runs?","A system freezes for 1 s under a closed-loop client targeting 1,000 ops/s. How many slow samples are recorded, and how many requests were really delayed?","Using the Paxi model, why does latency climb so steeply near maximum throughput?","etcd flushes to disk before acknowledging; Kafka by default does not flush each message. What does this do to a latency comparison, and how do you report it fairly?","The BFT systems run 4 nodes and the crash-fault systems 3. Is the comparison fair? What exactly would you write about it?","Which of your four criteria needs runs at several cluster sizes?"],"write":{"h":"Write for the thesis (about 2 pages)","html":"A first draft of your <em>Methodology<\/em> chapter: the four criteria with exact definitions, the &quot;what counts as done&quot; table, the load model (open loop, measured from intended send time), the fairness traps from point 8, the repetition and warm-up rules, and a table of predicted results derived from the comparison table below."}}],"answers":{"0":["Termination, a liveness property. It is still safe: deciding nothing never violates agreement, validity or integrity.","Crash-recovery. A restarted node must remember that it already voted this term; otherwise it could vote twice and two leaders could win the same term.","FLP rules out <em>guaranteed<\/em> termination in a fully asynchronous network. Real networks are partially synchronous: the protocols are always safe and use timeouts to make progress once delays are bounded.","Two in both cases: 5 = 2·2+1 and 7 = 3·2+1.","With n = 3 and f = 1, a quorum can have at most 2 nodes. Two such quorums overlap in one node, which may be the faulty one, so no honest node is guaranteed in the overlap.","The failure-detection timeout (election or session timeout), plus the client&#x27;s own timeout and retry settings."],"1":["An old-term entry on a majority can still be overwritten by a later leader elected without it (Figure 8). It is safe only once an entry from the current term commits after it.","Every new leader already holds every committed entry. Without the rule, a leader missing a committed entry would overwrite it on the followers.","Disk flushes on the leader and followers; applying the entry to the state machine; queueing and batching at the leader.","Their writes time out, because the old leader cannot reach a majority. With CheckQuorum it steps down after about one election timeout, so clients are turned away sooner and find the new leader.","At least one election timeout (1000 ms by default, plus randomization), then a vote round trip and the client&#x27;s retry. Roughly a second or more, depending on those settings.","The leader must send every entry to more followers and handle more acknowledgements, and it is already the bottleneck."],"2":["A value may already be chosen. The highest-ballot value reported is the only one that could have been, because the promising majority overlaps any accepting majority. Proposing anything else could choose a second value.","Phase 1 corresponds to Raft&#x27;s election (RequestVote); Phase 2 to log replication (AppendEntries).","Safe, but not live (livelock). Partial synchrony plus one elected leader, with timeouts, fixes it.","With a stable leader, Phase 1 runs once. Each command then needs one Phase 2 round trip to a majority, the same as AppendEntries.","In Paxos the new leader learns missing values from the promises. In Raft only an up-to-date node can win, so entries only ever flow from leader to followers."],"3":["Every replica in the current ISR, at least <code>min.insync.replicas<\/code> of them. Neither ZAB nor KRaft ran on that write; they manage only metadata.","Yes: an ISR of 2 still meets the minimum of 2. You now hold only two copies, and one more failure stops <code>acks=all<\/code> writes.","It brings followers up to the new leader&#x27;s full history before anything new is broadcast. Raft repairs each follower&#x27;s log gradually through AppendEntries.","Raft replicates commands (active). ZAB replicates the leader&#x27;s state changes (passive).","The broker dies; the controller notices after a configured session or heartbeat timeout; it picks a new leader from the ISR and records it; brokers and clients learn it; producers retry there. The detection step is the configured timeout.","Followers pull with fetch requests instead of the leader pushing AppendEntries. The leader advances the commit point from the voters&#x27; fetch offsets."],"4":["Only when they conflict: same key, and at least one of them writes.","If a fast quorum agrees on the dependencies, any later recovery is guaranteed to find that agreement, so the order is already fixed.","Replicas report different dependencies, because they saw concurrent conflicting commands in different orders. It costs one more round trip, a Paxos-style accept round with a majority.","Its dependencies may not have committed yet, and execution needs the complete, ordered dependency graph.","No global pause: the others keep committing their own commands. Commands that depend on the dead replica&#x27;s unfinished ones wait until another replica recovers them.","Even load and throughput, and graceful degradation under failures. Not the wide-area latency advantage, which needs geographically spread replicas."],"5":["Up to f replies may come from faulty replicas; f+1 matching replies guarantee at least one honest one.","That no conflicting request can be prepared at that number in this view. Not enough to execute, because it does not know the order will survive a view change; the commit round gives that.","The first orders requests within a view; the second makes the order survive a change of primary.","The 2f+1 VIEW-CHANGE messages as proof, and a re-proposal of every request that may have committed. Without them a faulty new primary could reassign committed sequence numbers, and honest replicas could not check it.","With n²: every replica sends prepares and commits to every other replica."],"6":["More than two-thirds of prevotes for one block in one round. The validator precommits that block and locks on it.","If B may have committed, honest locked validators refuse to prevote anything else, so no conflicting block can gather a two-thirds majority. Without locks, two different blocks could commit at the same height in different rounds.","It simply moves to the next round, with the next proposer. It gives up responsiveness: the proposer must wait out timeouts instead of receiving a proof of everyone&#x27;s locks.","So that after GST they eventually exceed the real message delay, without knowing that delay in advance. That guarantees liveness.","Validators wait out the propose timeout, prevote nil and move to the next round. The chain keeps going, more slowly: 3 of 4 equal-weight validators are more than two-thirds.","Each write waits for block inclusion, the three steps and the pause between heights. In a LAN those configured intervals are far longer than network delays."],"7":["Optimistic responsiveness, which PBFT had, and linear communication even across leader changes, which Tendermint and Casper had.","2f+1 votes for one block in one view, collected by the leader and sent out as one certificate (one signature with threshold signatures). Votes go only to the leader and one QC goes back out, so each phase costs O(n).","A new leader may not know the highest lock held by some honest replica, which then refuses to vote, and the view stalls unless the leader waits. With the extra phase, every lock is preceded by a QC that a quorum already holds, so a leader that hears from n−f replicas learns enough to make a proposal everyone accepts.","When it and its next two descendants, each built directly on the one before, have all received QCs.","It saves one phase, about 30% of steady-state latency in the Jolteon paper. Jolteon-style variants pay with a quadratic view change, losing linearity when a leader fails. The HotStuff paper&#x27;s own two-phase variant instead gives up responsiveness, like Tendermint.","No; at 4 replicas O(n) and O(n²) barely differ. Runs at several cluster sizes, measuring throughput, latency and traffic per decision, would."],"8":["Latency is skewed, so a mean hides the tail. Percentiles do not add up: the average of several p99s is not the p99 of the combined data, so merge histograms and compute once.","About one slow sample, while about 1,000 requests were actually delayed.","As the leader nears full utilization, the queueing wait grows without bound.","etcd pays for a disk flush on each write and Kafka by default does not, so part of Kafka&#x27;s advantage is weaker per-write durability. Report the durability settings next to the numbers, or run with matched settings.","It is a comparison at equal fault tolerance (f = 1), not at equal node count. Write that, and what it implies for per-node load and quorum sizes.","Scalability."]},"howto":{"_":[{"t":"p","html":"Phase A is about 43 hours of theory in 9 steps, ordered from easy to hard. At roughly 10 hours a week it ends in mid-December. That leaves January for running the benchmark and February for the analysis and writing.","text":"Phase A is about 43 hours of theory in 9 steps, ordered from easy to hard. At roughly 10 hours a week it ends in mid-December. That leaves January for running the benchmark and February for the analysis and writing."},{"t":"p","html":"The steps follow the three families of protocols in your thesis. Each step builds on the one before it:","text":"The steps follow the three families of protocols in your thesis. Each step builds on the one before it:"},{"t":"ul","items":[{"html":"<strong>Crash faults, one leader:<\/strong> Raft, then Paxos, then ZAB and KRaft (Steps 1–3). You already know Raft, so it comes first and the others are explained as differences from it.","text":"Crash faults, one leader: Raft, then Paxos, then ZAB and KRaft (Steps 1–3). You already know Raft, so it comes first and the others are explained as differences from it.","children":[]},{"html":"<strong>Crash faults, no leader:<\/strong> EPaxos (Step 4).","text":"Crash faults, no leader: EPaxos (Step 4).","children":[]},{"html":"<strong>Byzantine faults:<\/strong> PBFT, then Tendermint, then HotStuff (Steps 5–7). Each one is a fix for a weakness in the one before.","text":"Byzantine faults: PBFT, then Tendermint, then HotStuff (Steps 5–7). Each one is a fix for a weakness in the one before.","children":[]}]},{"t":"p","html":"Step 0 lays the ground for all of them. Step 8 turns the theory into predictions you can test with the benchmark.","text":"Step 0 lays the ground for all of them. Step 8 turns the theory into predictions you can test with the benchmark."}],"The loop for every step":[{"t":"ol","items":[{"html":"<strong>Watch<\/strong> the one video first. It gives you the shape before the details.","text":"Watch the one video first. It gives you the shape before the details.","children":[]},{"html":"<strong>Read<\/strong> only the pages listed. The Cachin, Guerraoui and Rodrigues book (2nd ed., 2011) is your source of precise definitions. Treat it as a reference, not something to read cover to cover.","text":"Read only the pages listed. The Cachin, Guerraoui and Rodrigues book (2nd ed., 2011) is your source of precise definitions. Treat it as a reference, not something to read cover to cover.","children":[]},{"html":"<strong>Explain<\/strong> the check questions out loud, without notes. If you can&#x27;t, re-read that part.","text":"Explain the check questions out loud, without notes. If you can't, re-read that part.","children":[]},{"html":"<strong>Write<\/strong> 1–2 pages of thesis text in your own words. Do it the same day. By Step 8 these pages are your Background chapter.","text":"Write 1–2 pages of thesis text in your own words. Do it the same day. By Step 8 these pages are your Background chapter.","children":[]},{"html":"<strong>Add one row<\/strong> to the comparison table at the end of Phase A. By Step 7 that table is your thesis&#x27;s main comparison table.","text":"Add one row to the comparison table at the end of Phase A. By Step 7 that table is your thesis's main comparison table.","children":[]}]},{"t":"p","html":"Steps 0–7 also have a <strong>Play with it<\/strong> item: a simulator you run in the browser, where a good one exists. Do it right after the video, and try to break the protocol. Good ones exist for Raft, Paxos and PBFT. For ZAB, KRaft, EPaxos, Tendermint and HotStuff I found only weak or laptop-only tools, and each step says so.","text":"Steps 0–7 also have a Play with it item: a simulator you run in the browser, where a good one exists. Do it right after the video, and try to break the protocol. Good ones exist for Raft, Paxos and PBFT. For ZAB, KRaft, EPaxos, Tendermint and HotStuff I found only weak or laptop-only tools, and each step says so."},{"t":"p","html":"The writing step is what makes the knowledge add up. Reading without writing feels like progress, but it does not survive until February.","text":"The writing step is what makes the knowledge add up. Reading without writing feels like progress, but it does not survive until February."}],"Time budget":[{"t":"table","head":["Step","Topic","Hours (approx.)","Feeds thesis section"],"rows":[["0","The problem and the model","6","Background: system model, definitions"],["1","Raft, one level deeper","5","Crash-fault protocols: Raft"],["2","Paxos and Multi-Paxos","5","Crash-fault protocols: Paxos"],["3","ZAB, ZooKeeper, KRaft","3","Crash-fault protocols: in Kafka"],["4","EPaxos","5","Leaderless consensus"],["5","Byzantine faults and PBFT","6","BFT: foundations"],["6","Tendermint / CometBFT","4","BFT: Tendermint"],["7","HotStuff","5","BFT: HotStuff"],["8","Comparing and measuring","4","Methodology, evaluation criteria"]]},{"t":"p","html":"If you fall behind, cut the items marked <em>optional<\/em> first. Never cut the writing step.","text":"If you fall behind, cut the items marked optional first. Never cut the writing step."}]},"compare":{"h2":"Phase A summary — the comparison table","blocks":[{"t":"p","html":"This is the table you build row by row in Steps 1–7. Write your own row at the end of each step first, then check it against this one; the differences show you what to re-read.","text":"This is the table you build row by row in Steps 1–7. Write your own row at the end of each step first, then check it against this one; the differences show you what to re-read."},{"t":"table","head":["Protocol (year)","Family","Nodes to survive f faults","Leader","Good-case commit latency (message delays from the proposal)","Messages per decision","When the leader fails","In your benchmark as"],"rows":[["Paxos / Multi-Paxos (1998, \"The Part-Time Parliament\")","Crash, leader-based","2f+1","Stable leader, chosen outside the protocol","2","O(n)","New leader runs Phase 1 for unfinished slots","Paxos (Paxi)"],["Raft (2014)","Crash, leader-based","2f+1","Stable leader, elected","2","O(n)","Election after a randomized timeout","etcd"],["ZAB (2011)","Crash, primary-backup","2f+1","Stable primary","2 to commit at the leader, +1 to tell followers","O(n)","Election, discovery and synchronization before new broadcasts","ZooKeeper (Kafka metadata, ZooKeeper mode)"],["KRaft (2020, KIP-595)","Crash, Raft dialect","2f+1 voters","Stable leader, elected","About 2 (followers pull)","O(n)","Raft-style election with epochs","Kafka metadata, KRaft mode"],["EPaxos (2013)","Crash, leaderless","2f+1","None: one leader per command","2 on the fast path, 4 on the slow path; execution can wait longer","O(n) per command","No election; other replicas recover its unfinished commands","EPaxos (Paxi)"],["PBFT (1999)","Byzantine, stable leader","3f+1","Stable primary","3","O(n²)","View change carrying proofs; costlier than O(n²)","Not benchmarked: reference"],["Tendermint (2018 algorithm)","Byzantine, rotating leader","3f+1","New proposer each round","3, plus waiting for the next block","O(n²), spread by gossip","Next round; waits on timeouts (not responsive)","CometBFT"],["HotStuff (2019)","Byzantine, rotating leader","3f+1","Rotating leader, votes gathered into QCs","7 (three-chain); 5 in 2-chain variants","O(n) per phase","Linear and responsive; Jolteon-style 2-chain variants pay a quadratic view change","HotStuff (likely the 2-chain variant)"]]},{"t":"p","html":"The latency figures leave out the client&#x27;s own round trip, disk flushes, batching and any block interval; add them when you predict real numbers. The PBFT and Tendermint figures follow <a href=\"https://decentralizedthoughts.github.io/2019-06-23-what-is-the-difference-between\" target=\"_blank\" rel=\"noopener noreferrer\">Decentralized Thoughts (2019)<\/a>; the HotStuff figures follow the comparison table in the <a href=\"https://arxiv.org/abs/2106.10362\" target=\"_blank\" rel=\"noopener noreferrer\">Jolteon paper<\/a>. Kafka&#x27;s data plane is deliberately missing: its write path uses ISR replication, not a consensus protocol (Step 3).","text":"The latency figures leave out the client's own round trip, disk flushes, batching and any block interval; add them when you predict real numbers. The PBFT and Tendermint figures follow Decentralized Thoughts (2019); the HotStuff figures follow the comparison table in the Jolteon paper. Kafka's data plane is deliberately missing: its write path uses ISR replication, not a consensus protocol (Step 3)."}]},"phaseB":{"h2":"Phase B — from theory to the code","blocks":[{"t":"p","html":"Phase B ties each step above to the benchmark code on branch main, and lists what to change, run and analyse before February: <a href=\"https://claude.ai/artifact/HJErTpWQTYFerqRftDow4K\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Protocols — Thesis Study Guide, Phase B<\/a>.","text":"Phase B ties each step above to the benchmark code on branch main, and lists what to change, run and analyse before February: Consensus Protocols — Thesis Study Guide, Phase B."}]},"answerIntro":"Try each step&#x27;s questions out loud first. Use these to check yourself, not to learn from.","refs":{"intro":"Links were checked on 18 November 2026. Where I could not confirm a direct video link, the guide gives the playlist, the course page or the exact title to search. Page numbers for the Cachin book are not given because I could not verify them for the 2nd edition.","groups":[{"name":"Lectures and courses","items":[{"html":"Martin Kleppmann, <em>Distributed Systems<\/em> (Cambridge): <a href=\"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB\" target=\"_blank\" rel=\"noopener noreferrer\">videos<\/a>, <a href=\"https://www.cl.cam.ac.uk/teaching/2122/ConcDisSys/dist-sys-notes.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">lecture notes<\/a>","text":"Martin Kleppmann, Distributed Systems (Cambridge): videos, lecture notes"},{"html":"MIT 6.824 (2020), Robert Morris: <a href=\"http://nil.csail.mit.edu/6.824/2020/video/6.html\" target=\"_blank\" rel=\"noopener noreferrer\">Raft (1)<\/a>, <a href=\"http://nil.csail.mit.edu/6.824/2020/video/7.html\" target=\"_blank\" rel=\"noopener noreferrer\">Raft (2)<\/a>, <a href=\"https://www.youtube.com/playlist?list=PLrw6a1wE39_tb2fErI4-WkMbsvGQk9_UB\" target=\"_blank\" rel=\"noopener noreferrer\">YouTube playlist<\/a>","text":"MIT 6.824 (2020), Robert Morris: Raft (1), Raft (2), YouTube playlist"},{"html":"John Ousterhout, <a href=\"https://www.youtube.com/watch?v=YbZ3zDzDnrw\" target=\"_blank\" rel=\"noopener noreferrer\">Raft lecture<\/a> and <a href=\"https://www.youtube.com/watch?v=JEpsBg0AO6o\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos lecture<\/a> (Raft user study)","text":"John Ousterhout, Raft lecture and Paxos lecture (Raft user study)"},{"html":"Tim Roughgarden, <em>Foundations of Blockchains<\/em> (Columbia, 2021): <a href=\"https://timroughgarden.org/f21/l6.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Lecture 6 notes<\/a>, <a href=\"https://timroughgarden.github.io/fob21/slides/F21L7.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Lecture 7 slides<\/a>; videos on YouTube by title","text":"Tim Roughgarden, Foundations of Blockchains (Columbia, 2021): Lecture 6 notes, Lecture 7 slides; videos on YouTube by title"},{"html":"Jun Rao, <a href=\"https://developer.confluent.io/courses/architecture/\" target=\"_blank\" rel=\"noopener noreferrer\">Apache Kafka Internal Architecture<\/a> (Confluent)","text":"Jun Rao, Apache Kafka Internal Architecture (Confluent)"},{"html":"Sarah Tollman, <a href=\"https://www.usenix.org/conference/nsdi21/presentation/tollman\" target=\"_blank\" rel=\"noopener noreferrer\">EPaxos Revisited talk<\/a> (NSDI 2021)","text":"Sarah Tollman, EPaxos Revisited talk (NSDI 2021)"},{"html":"Gil Tene, <em>How NOT to Measure Latency<\/em>: <a href=\"https://videog.infoq.com/downloads/pdfdownloads/presentations/QConSF2015-GilTene-HowNOTtomeasureLatency.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">slides<\/a>; video on YouTube by title","text":"Gil Tene, How NOT to Measure Latency: slides; video on YouTube by title"},{"html":"Manos Kapritsos, <a href=\"https://web.eecs.umich.edu/~manosk/assets/slides/f21/eecs591-lecture13-slides.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">PBFT lecture slides<\/a> (University of Michigan)","text":"Manos Kapritsos, PBFT lecture slides (University of Michigan)"}]},{"name":"Book","items":[{"html":"Christian Cachin, Rachid Guerraoui, Luís Rodrigues, <em>Introduction to Reliable and Secure Distributed Programming<\/em>, 2nd ed., Springer, 2011: Chapter 2 (models), Chapter 5 (consensus, including Byzantine consensus), Chapter 6 (total-order broadcast)","text":"Christian Cachin, Rachid Guerraoui, Luís Rodrigues, Introduction to Reliable and Secure Distributed Programming, 2nd ed., Springer, 2011: Chapter 2 (models), Chapter 5 (consensus, including Byzantine consensus), Chapter 6 (total-order broadcast)"}]},{"name":"Papers","items":[{"html":"Fischer, Lynch, Paterson, &quot;Impossibility of distributed consensus with one faulty process&quot;, J. ACM, 1985","text":"Fischer, Lynch, Paterson, \"Impossibility of distributed consensus with one faulty process\", J. ACM, 1985"},{"html":"Dwork, Lynch, Stockmeyer, &quot;Consensus in the presence of partial synchrony&quot;, J. ACM, 1988","text":"Dwork, Lynch, Stockmeyer, \"Consensus in the presence of partial synchrony\", J. ACM, 1988"},{"html":"Lamport, Shostak, Pease, &quot;The Byzantine Generals Problem&quot;, ACM TOPLAS, 1982","text":"Lamport, Shostak, Pease, \"The Byzantine Generals Problem\", ACM TOPLAS, 1982"},{"html":"Schneider, &quot;Implementing fault-tolerant services using the state machine approach: a tutorial&quot;, ACM Computing Surveys, 1990","text":"Schneider, \"Implementing fault-tolerant services using the state machine approach: a tutorial\", ACM Computing Surveys, 1990"},{"html":"Lamport, <a href=\"http://css.csail.mit.edu/6.824/2014/papers/paxos-simple.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos Made Simple<\/a>, 2001","text":"Lamport, Paxos Made Simple, 2001"},{"html":"Ongaro, Ousterhout, <a href=\"https://pdos.csail.mit.edu/6.824/papers/raft-extended.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">In Search of an Understandable Consensus Algorithm (Extended Version)<\/a>, USENIX ATC 2014","text":"Ongaro, Ousterhout, In Search of an Understandable Consensus Algorithm (Extended Version), USENIX ATC 2014"},{"html":"Ongaro, <a href=\"https://github.com/ongardie/dissertation\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus: Bridging Theory and Practice<\/a>, PhD dissertation, Stanford, 2014","text":"Ongaro, Consensus: Bridging Theory and Practice, PhD dissertation, Stanford, 2014"},{"html":"Howard, Mortier, <a href=\"https://arxiv.org/abs/2004.05074\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos vs Raft: Have we reached consensus on distributed consensus?<\/a>, PaPoC 2020","text":"Howard, Mortier, Paxos vs Raft: Have we reached consensus on distributed consensus?, PaPoC 2020"},{"html":"Junqueira, Reed, Serafini, &quot;Zab: High-performance broadcast for primary-backup systems&quot;, DSN 2011 (<a href=\"https://blog.acolyer.org/2015/03/09/zab-high-performance-broadcast-for-primary-backup-systems/\" target=\"_blank\" rel=\"noopener noreferrer\">summary<\/a>)","text":"Junqueira, Reed, Serafini, \"Zab: High-performance broadcast for primary-backup systems\", DSN 2011 (summary)"},{"html":"van Renesse, Schiper, Schneider, <a href=\"https://arxiv.org/abs/1309.5671\" target=\"_blank\" rel=\"noopener noreferrer\">Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab<\/a>, IEEE TDSC, 2015","text":"van Renesse, Schiper, Schneider, Vive la Différence: Paxos vs. Viewstamped Replication vs. Zab, IEEE TDSC, 2015"},{"html":"<a href=\"https://cwiki.apache.org/confluence/display/KAFKA/KIP-595%3A+A+Raft+Protocol+for+the+Metadata+Quorum\" target=\"_blank\" rel=\"noopener noreferrer\">KIP-595: A Raft Protocol for the Metadata Quorum<\/a>, Apache Kafka","text":"KIP-595: A Raft Protocol for the Metadata Quorum, Apache Kafka"},{"html":"Moraru, Andersen, Kaminsky, <a href=\"https://www.cs.princeton.edu/courses/archive/spr25/cos418/papers/epaxos.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">There Is More Consensus in Egalitarian Parliaments<\/a>, SOSP 2013","text":"Moraru, Andersen, Kaminsky, There Is More Consensus in Egalitarian Parliaments, SOSP 2013"},{"html":"Tollman, Park, Ousterhout, <a href=\"https://www.usenix.org/conference/nsdi21/presentation/tollman\" target=\"_blank\" rel=\"noopener noreferrer\">EPaxos Revisited<\/a>, NSDI 2021","text":"Tollman, Park, Ousterhout, EPaxos Revisited, NSDI 2021"},{"html":"Castro, Liskov, <a href=\"https://pmg.csail.mit.edu/papers/osdi99.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Practical Byzantine Fault Tolerance<\/a>, OSDI 1999","text":"Castro, Liskov, Practical Byzantine Fault Tolerance, OSDI 1999"},{"html":"Cachin, <a href=\"https://dominoweb.draco.res.ibm.com/reports/rz3754.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Yet Another Visit to Paxos<\/a>, IBM Research report RZ3754, 2009","text":"Cachin, Yet Another Visit to Paxos, IBM Research report RZ3754, 2009"},{"html":"Buchman, Kwon, Milosevic, <a href=\"https://arxiv.org/abs/1807.04938\" target=\"_blank\" rel=\"noopener noreferrer\">The latest gossip on BFT consensus<\/a>, 2018","text":"Buchman, Kwon, Milosevic, The latest gossip on BFT consensus, 2018"},{"html":"Cachin, Vukolić, <a href=\"https://arxiv.org/abs/1707.01873\" target=\"_blank\" rel=\"noopener noreferrer\">Blockchain Consensus Protocols in the Wild<\/a>, 2017","text":"Cachin, Vukolić, Blockchain Consensus Protocols in the Wild, 2017"},{"html":"Yin, Malkhi, Reiter, Golan Gueta, Abraham, <a href=\"https://arxiv.org/abs/1803.05069\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuff: BFT Consensus in the Lens of Blockchain<\/a>, PODC 2019","text":"Yin, Malkhi, Reiter, Golan Gueta, Abraham, HotStuff: BFT Consensus in the Lens of Blockchain, PODC 2019"},{"html":"Gelashvili et al., <a href=\"https://arxiv.org/abs/2106.10362\" target=\"_blank\" rel=\"noopener noreferrer\">Jolteon and Ditto<\/a>, 2021","text":"Gelashvili et al., Jolteon and Ditto, 2021"},{"html":"Malkhi, Yin, <a href=\"https://arxiv.org/abs/2305.13556\" target=\"_blank\" rel=\"noopener noreferrer\">Lessons from HotStuff<\/a>, 2023","text":"Malkhi, Yin, Lessons from HotStuff, 2023"},{"html":"Ailijiang, Charapko, Demirbas, <a href=\"https://cse.buffalo.edu/~demirbas/publications/dissecting.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Dissecting the Performance of Strongly-Consistent Replication Protocols<\/a>, SIGMOD 2019","text":"Ailijiang, Charapko, Demirbas, Dissecting the Performance of Strongly-Consistent Replication Protocols, SIGMOD 2019"},{"html":"Gai et al., <a href=\"https://arxiv.org/abs/2103.00777\" target=\"_blank\" rel=\"noopener noreferrer\">Dissecting the Performance of Chained-BFT<\/a>, ICDCS 2021","text":"Gai et al., Dissecting the Performance of Chained-BFT, ICDCS 2021"},{"html":"Schroeder, Wierman, Harchol-Balter, <a href=\"http://usenix.org/events/nsdi06/tech/full_papers/schroeder/schroeder.pdf\" target=\"_blank\" rel=\"noopener noreferrer\">Open Versus Closed: A Cautionary Tale<\/a>, NSDI 2006","text":"Schroeder, Wierman, Harchol-Balter, Open Versus Closed: A Cautionary Tale, NSDI 2006"}]},{"name":"Posts and documentation","items":[{"html":"Decentralized Thoughts: <a href=\"https://decentralizedthoughts.github.io/2019-06-01-2019-5-31-models\" target=\"_blank\" rel=\"noopener noreferrer\">Synchrony, Asynchrony and Partial synchrony<\/a>, <a href=\"https://decentralizedthoughts.github.io/2021-10-29-consensus-cheat-sheet\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus cheat sheet<\/a>, <a href=\"https://decentralizedthoughts.github.io/2020-12-12-raft-liveness-full-omission/\" target=\"_blank\" rel=\"noopener noreferrer\">Raft liveness under network faults<\/a>, <a href=\"https://decentralizedthoughts.github.io/2022-11-04-paxos-via-recoverable-broadcast\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos from Recoverable Broadcast<\/a>, <a href=\"https://decentralizedthoughts.github.io/2025-02-14-PBFT\" target=\"_blank\" rel=\"noopener noreferrer\">PBFT<\/a>, <a href=\"https://decentralizedthoughts.github.io/2019-06-23-what-is-the-difference-between\" target=\"_blank\" rel=\"noopener noreferrer\">PBFT, Tendermint, SBFT and HotStuff<\/a>, <a href=\"https://decentralizedthoughts.github.io/2023-04-01-hotstuff-2\" target=\"_blank\" rel=\"noopener noreferrer\">PBFT, Tendermint, HotStuff and HotStuff-2<\/a>","text":"Decentralized Thoughts: Synchrony, Asynchrony and Partial synchrony, Consensus cheat sheet, Raft liveness under network faults, Paxos from Recoverable Broadcast, PBFT, PBFT, Tendermint, SBFT and HotStuff, PBFT, Tendermint, HotStuff and HotStuff-2"},{"html":"Murat Demirbas: <a href=\"https://muratbuffalo.blogspot.com/2019/07/dissecting-performance-bottlenecks-of.html\" target=\"_blank\" rel=\"noopener noreferrer\">on Paxi<\/a>, <a href=\"https://muratbuffalo.blogspot.com/2019/12/hotstuff-bft-consensus-in-lens-of.html\" target=\"_blank\" rel=\"noopener noreferrer\">on HotStuff<\/a>","text":"Murat Demirbas: on Paxi, on HotStuff"},{"html":"<a href=\"https://etcd.io/docs/v3.5/tuning/\" target=\"_blank\" rel=\"noopener noreferrer\">etcd tuning<\/a> (heartbeat and election timeout defaults)","text":"etcd tuning (heartbeat and election timeout defaults)"},{"html":"<a href=\"https://docs.confluent.io/kafka/design/replication.html\" target=\"_blank\" rel=\"noopener noreferrer\">Kafka Replication and Committed Messages<\/a> (Confluent)","text":"Kafka Replication and Committed Messages (Confluent)"},{"html":"<a href=\"https://kafka.apache.org/blog/2025/03/18/apache-kafka-4.0.0-release-announcement/\" target=\"_blank\" rel=\"noopener noreferrer\">Apache Kafka 4.0.0 release announcement<\/a>","text":"Apache Kafka 4.0.0 release announcement"},{"html":"<a href=\"https://docs.cosmos.network/cometbft/next/spec/consensus/Byzantine-Consensus-Algorithm\" target=\"_blank\" rel=\"noopener noreferrer\">CometBFT Byzantine Consensus Algorithm specification<\/a>","text":"CometBFT Byzantine Consensus Algorithm specification"},{"html":"<a href=\"https://github.com/asonnino/hotstuff/wiki\" target=\"_blank\" rel=\"noopener noreferrer\">asonnino/hotstuff wiki<\/a> (the 2-chain implementation)","text":"asonnino/hotstuff wiki (the 2-chain implementation)"}]},{"name":"Interactive simulators","items":[{"html":"<a href=\"http://thesecretlivesofdata.com/raft/\" target=\"_blank\" rel=\"noopener noreferrer\">The Secret Lives of Data: Raft<\/a>; <a href=\"https://raft.github.io/\" target=\"_blank\" rel=\"noopener noreferrer\">RaftScope<\/a>","text":"The Secret Lives of Data: Raft; RaftScope"},{"html":"Murat Demirbas, <a href=\"https://muratdem.github.io/BeatPaxos/\" target=\"_blank\" rel=\"noopener noreferrer\">Beat Paxos<\/a>","text":"Murat Demirbas, Beat Paxos"},{"html":"<a href=\"https://yoichiozaki.github.io/en/blog/consensus-algorithms\" target=\"_blank\" rel=\"noopener noreferrer\">Paxos, Raft and PBFT simulators<\/a> (personal blog)","text":"Paxos, Raft and PBFT simulators (personal blog)"},{"html":"<a href=\"https://growingswe.com/blog/consensus\" target=\"_blank\" rel=\"noopener noreferrer\">Byzantine Generals stepper<\/a> (personal blog)","text":"Byzantine Generals stepper (personal blog)"},{"html":"<a href=\"https://sandeepkv93.github.io/distributed-systems-visualizer/consensus-variants/\" target=\"_blank\" rel=\"noopener noreferrer\">Consensus Variants visualizer<\/a> (personal project)","text":"Consensus Variants visualizer (personal project)"},{"html":"IIIT Hyderabad Virtual Labs, <a href=\"https://dsys2-iiith.vlabs.ac.in/exp/byzantine-failures-scenario/simulation/index.html\" target=\"_blank\" rel=\"noopener noreferrer\">Byzantine Failures Simulation (PBFT)<\/a>","text":"IIIT Hyderabad Virtual Labs, Byzantine Failures Simulation (PBFT)"},{"html":"Local only: <a href=\"https://github.com/kevlubkcm/tenderflow\" target=\"_blank\" rel=\"noopener noreferrer\">tenderflow<\/a>, <a href=\"https://github.com/edgedlt/hotstuff2\" target=\"_blank\" rel=\"noopener noreferrer\">HotStuff-2 demo<\/a>, <a href=\"https://github.com/csienslab/BFT-Simulator\" target=\"_blank\" rel=\"noopener noreferrer\">BFT Simulator<\/a>","text":"Local only: tenderflow, HotStuff-2 demo, BFT Simulator"}]}]},"links":[{"href":"https://www.youtube.com/playlist?list=PLeKd45zvjcDFUEv_ohr_HdUFe97RItdiB","text":"YouTube playlist","step":0,"section":"Watch (about 2 h)","item":"Martin Kleppmann, Distributed Systems (University of Cambridge), YouTube playlist. Watch lectures 2.1–2.4 (system models), 5.2 (quorums), 5.3 (replication using broadcast) and 6.1 (introduction to consensus)."},{"href":"https://growingswe.com/blog/consensus","text":"Byzantine Generals stepper","step":0,"section":"Play with it (about 15 min)","item":"The Byzantine Generals stepper (a personal blog). Set 3 generals with one traitor and step through: no agreement. Then 4 generals with the same traitor: agreement. That is n = 3f+1, seen directly. The same page also steps through two-phase commit and Paxos."},{"href":"https://www.cl.cam.ac.uk/teaching/2122/ConcDisSys/dist-sys-notes.pdf","text":"lec
