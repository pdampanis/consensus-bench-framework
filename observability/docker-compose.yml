# docker-compose.yml — obs VM stack. Dashboards and datasource are
# provisioned from files (dashboards-as-code): the repo is the source of
# truth, the UI is disposable.
services:
  prometheus:
    image: prom/prometheus:v2.53.0
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-admin-api          # enables snapshot API for archiving
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: thesis-obs   # change; obs VM is firewalled
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  prom-data:
  grafana-data:
