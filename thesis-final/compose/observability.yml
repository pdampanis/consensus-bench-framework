# =============================================================================
# Observability stack - Prometheus + Grafana + cAdvisor
# =============================================================================
#
# Three services, total ~900 MB of RAM. Brought up once at the start of a
# session and left running across all SUT changes. Prometheus retention is
# 36 hours so the TSDB fits comfortably in 1 GB.
# =============================================================================

networks:
  thesis-net:
    external: true

volumes:
  prom-data:
  grafana-data:

services:

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    restart: unless-stopped
    networks:
      - thesis-net
    ports:
      - "9090:9090"
    volumes:
      - ../analysis/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=36h"
      - "--storage.tsdb.retention.size=1GB"
      - "--web.enable-admin-api"
    mem_limit: 500m
    cpus: 0.5

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    networks:
      - thesis-net
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 200m
    cpus: 0.25

  cadvisor:
    # cAdvisor exposes per-container CPU, memory, and network metrics to
    # Prometheus. The `name` label on each series is the Docker container
    # name, which is what export_metrics.sh filters by.
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    restart: unless-stopped
    networks:
      - thesis-net
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8080:8080"
    mem_limit: 200m
    cpus: 0.25
