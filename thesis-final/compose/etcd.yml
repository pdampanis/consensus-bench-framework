# =============================================================================
# etcd - 3-node Raft cluster, sized for Latitude 7390
# =============================================================================
#
# etcd is the canonical production Raft implementation. Small footprint
# (~50 MB per process) compared to Kafka. We allocate 400 MB per node to
# leave comfortable headroom.
#
# Port 2379 (client) is exposed on the host for etcd1 only, which is what
# the etcd `benchmark` tool uses to reach the cluster from outside.
# Prometheus metrics are exposed on the same port at /metrics natively.
# =============================================================================

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:

networks:
  thesis-net:
    external: true

x-etcd-service: &etcd-service
  image: quay.io/coreos/etcd:v3.5.15
  restart: unless-stopped
  networks:
    - thesis-net
  mem_limit: 400m
  cpus: 0.5

services:

  etcd1:
    <<: *etcd-service
    container_name: etcd1
    hostname: etcd1
    command:
      - /usr/local/bin/etcd
      - --name=etcd1
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=thesis-etcd
      - --initial-cluster-state=new
      - --logger=zap
      - --log-level=warn
    ports:
      - "2379:2379"
    volumes:
      - etcd1-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl endpoint health --endpoints=http://localhost:2379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  etcd2:
    <<: *etcd-service
    container_name: etcd2
    hostname: etcd2
    command:
      - /usr/local/bin/etcd
      - --name=etcd2
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=thesis-etcd
      - --initial-cluster-state=new
      - --logger=zap
      - --log-level=warn
    volumes:
      - etcd2-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl endpoint health --endpoints=http://localhost:2379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  etcd3:
    <<: *etcd-service
    container_name: etcd3
    hostname: etcd3
    command:
      - /usr/local/bin/etcd
      - --name=etcd3
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-token=thesis-etcd
      - --initial-cluster-state=new
      - --logger=zap
      - --log-level=warn
    volumes:
      - etcd3-data:/etcd-data
    healthcheck:
      test: ["CMD-SHELL", "ETCDCTL_API=3 etcdctl endpoint health --endpoints=http://localhost:2379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
