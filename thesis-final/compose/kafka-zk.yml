# =============================================================================
# Kafka with ZooKeeper - 3 brokers + 1 ZK, sized for Latitude 7390
# =============================================================================
#
# Same three-listener layout as kafka-kraft.yml:
#   CLIENT   :9092  - external clients
#   INTERNAL :9094  - inter-broker replication
# (no CONTROLLER listener - in ZK mode, broker coordination goes via ZK)
#
# Single ZooKeeper (not a 3-node ensemble) is intentional: we are comparing
# architectural differences between KRaft and ZK, and a 3-node ZK ensemble
# would triple the ZK footprint for no additional information relative to
# the comparison.
#
# Kafka 3.9 still supports ZK mode. Kafka 4.0 removed it, so we pin 3.9.0
# (same image as kafka-kraft.yml) for an apples-to-apples version compare.
# =============================================================================

volumes:
  zk-data:
  zk-log:
  zb1-data:
  zb2-data:
  zb3-data:

networks:
  thesis-net:
    external: true

x-broker-service: &broker-service
  image: apache/kafka:3.9.0
  restart: unless-stopped
  networks:
    - thesis-net
  mem_limit: 1200m
  cpus: 1.0

x-broker-env: &broker-env
  KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
  KAFKA_LISTENERS: "CLIENT://0.0.0.0:9092,INTERNAL://0.0.0.0:9094"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CLIENT:PLAINTEXT,INTERNAL:PLAINTEXT"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
  KAFKA_LOG_RETENTION_MINUTES: 10
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 6
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
  KAFKA_JVM_PERFORMANCE_OPTS: >-
    -server -XX:+UseG1GC -XX:MaxGCPauseMillis=50
    -XX:InitiatingHeapOccupancyPercent=35 -XX:+ExplicitGCInvokesConcurrent

services:

  zookeeper:
    image: zookeeper:3.9
    container_name: zookeeper
    hostname: zookeeper
    networks:
      - thesis-net
    mem_limit: 600m
    cpus: 0.5
    environment:
      # "ruok" is the four-letter health-check command; whitelisting it lets
      # the container healthcheck below work.
      ZOO_4LW_COMMANDS_WHITELIST: "ruok,srvr,stat,mntr"
      ZOO_MY_ID: "1"
      ZOO_SERVERS: "server.1=zookeeper:2888:3888;2181"
    volumes:
      - zk-data:/data
      - zk-log:/datalog
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep imok"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

  zb1:
    <<: *broker-service
    container_name: zb1
    hostname: zb1
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: "CLIENT://zb1:9092,INTERNAL://zb1:9094"
    ports:
      - "19092:9092"
    volumes:
      - zb1-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  zb2:
    <<: *broker-service
    container_name: zb2
    hostname: zb2
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: "CLIENT://zb2:9092,INTERNAL://zb2:9094"
    ports:
      - "19093:9092"
    volumes:
      - zb2-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  zb3:
    <<: *broker-service
    container_name: zb3
    hostname: zb3
    environment:
      <<: *broker-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: "CLIENT://zb3:9092,INTERNAL://zb3:9094"
    ports:
      - "19094:9092"
    volumes:
      - zb3-data:/var/lib/kafka/data
    depends_on:
      zookeeper:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
