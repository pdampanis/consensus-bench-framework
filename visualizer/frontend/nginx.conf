# nginx configuration for the Consensus Visualizer frontend container.
#
# The frontend container serves the built React bundle as static assets and
# proxies any request to /api/* through to the Spring Boot backend
# container (reached by its Docker DNS name "backend" on port 8080).
# Having the proxy live in nginx rather than in the browser means the
# browser never sees a CORS boundary and the frontend does not need to
# know the backend's host.

server {
    listen 80;
    server_name _;

    # Static assets (the compiled React app)
    root /usr/share/nginx/html;
    index index.html;

    # Sensible caching: HTML is always fresh, hashed assets can be cached.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css|woff2?|png|jpg|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to the Spring Boot backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Spring Boot actuator health pass-through (useful for debugging)
    location /actuator/ {
        proxy_pass http://backend:8080/actuator/;
    }
}
