# =============================================================================
# Consensus Visualizer — docker-compose
# =============================================================================
#
# Three services:
#
#   postgres  : persistent store for imported run records
#   backend   : Spring Boot (Java 21) REST API and results importer
#   frontend  : nginx serving the built React SPA, proxying /api to backend
#
# The backend mounts the thesis results directory read-only. On startup
# it walks the directory and imports every manifest.json into Postgres.
# Subsequent starts are idempotent: existing runs are updated in place.
#
# Run from the visualizer/ directory:
#   RESULTS_DIR=/absolute/path/to/thesis/results docker compose up -d
#
# Then open http://localhost:8090 in your browser.
# =============================================================================

version: "3.9"

networks:
  # Internal network. No need to expose services other than the frontend to
  # the outside world.
  visualizer-net:
    driver: bridge

volumes:
  # Persistent Postgres data. Survives `docker compose down` but wiped by
  # `docker compose down -v`.
  postgres-data:

services:

  # ---------------------------------------------------------------------------
  # Postgres — persistent store for benchmark-run records and aggregates.
  # Version 16 is the latest LTS at time of writing; pin to avoid surprises.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: visualizer-postgres
    restart: unless-stopped
    networks:
      - visualizer-net
    environment:
      POSTGRES_DB: thesis
      POSTGRES_USER: thesis
      POSTGRES_PASSWORD: thesis
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesis -d thesis"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    # Not exposed on the host — only the backend container needs to reach it.

  # ---------------------------------------------------------------------------
  # Backend — Spring Boot 3 + Java 21. Reads manifest.json files from the
  # mounted results directory, persists parsed runs to Postgres, serves the
  # REST API consumed by the frontend.
  # ---------------------------------------------------------------------------
  backend:
    build: ./backend
    container_name: visualizer-backend
    restart: unless-stopped
    networks:
      - visualizer-net
    environment:
      # Datasource pointed at the Postgres sidecar. Credentials match above.
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/thesis"
      SPRING_DATASOURCE_USERNAME: "thesis"
      SPRING_DATASOURCE_PASSWORD: "thesis"
      SPRING_DATASOURCE_DRIVER: "org.postgresql.Driver"
      SPRING_JPA_DDL_AUTO: "update"
      # Where run_experiment.sh writes its output. Mounted read-only below.
      APP_RESULTS_DIR: "/data/results"
      # Safe memory footprint on a 32 GB laptop. -XX:MaxRAMPercentage in the
      # Dockerfile JAVA_OPTS makes the JVM respect the container's limit.
      JAVA_OPTS: "-XX:MaxRAMPercentage=50.0 -XX:+UseG1GC"
    volumes:
      # Mount the thesis results directory read-only. The importer walks
      # this on startup. The variable RESULTS_DIR defaults to a sensible
      # local path; override with `RESULTS_DIR=... docker compose up`.
      - ${RESULTS_DIR:-../results}:/data/results:ro
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Frontend — nginx serving the compiled React bundle and proxying /api
  # through to the backend container. Only service exposed on the host.
  # ---------------------------------------------------------------------------
  frontend:
    build: ./frontend
    container_name: visualizer-frontend
    restart: unless-stopped
    networks:
      - visualizer-net
    ports:
      # 8090 is chosen to avoid collisions with Grafana on :3000 and
      # Prometheus on :9090 that the benchmark stack uses in parallel.
      - "8090:80"
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      backend:
        condition: service_healthy
